name: Live Contextual Luna Tests

on:
  workflow_dispatch:
  push:
    branches:
      - test/live-contextual-luna
    paths:
      - .github/workflows/live-semantic-staging.yml
      - backend/tests/test_contextual_time_followups.py
      - backend/tests/test_contextual_followup_regressions.py
      - backend/app/agents/turn_interpreter.py
      - backend/app/agents/structured_output.py
      - backend/app/agents/turn_models.py

permissions:
  contents: read

concurrency:
  group: live-contextual-luna
  cancel-in-progress: false

jobs:
  contextual:
    name: New contextual regressions on Luna
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    defaults:
      run:
        working-directory: backend

    env:
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_live_semantic_unused
      SUPABASE_SECRET_KEY: sb_secret_live_semantic_unused
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-5.6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "2"
      LLM_REALTIME_MAX_RETRIES: "0"
      AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
      CORS_ORIGINS: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify OpenAI secret
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is missing"; exit 1; }

      - name: Show test model
        run: |
          echo "Model: $OPENAI_MODEL"
          echo "Reasoning effort: $OPENAI_REASONING_EFFORT"

      - name: Run booking-time, references, and ambiguity live tests
        run: |
          python -m pytest -q \
            tests/test_contextual_time_followups.py::test_live_same_phrase_changes_meaning_with_conversation_context \
            tests/test_contextual_followup_regressions.py::test_live_reference_resolution_survives_side_reads \
            tests/test_contextual_followup_regressions.py::test_live_ambiguous_same_time_does_not_guess_doctor

      - name: Run reschedule select-vs-filter live check
        run: |
          python - <<'PY'
          import runpy
          from datetime import datetime

          from app.agents.turn_interpreter import interpret_customer_turn

          case = runpy.run_path("tests/test_contextual_followup_regressions.py")
          local_now = datetime(2026, 9, 9, 14, 0)
          catalog = case["_catalog"]()

          selection = interpret_customer_turn(
              flow=case["_reschedule_flow"](presented=True),
              history=case["_reschedule_selection_history"](),
              timezone_name="Africa/Cairo",
              local_now=local_now,
              clinic_catalog=catalog,
          )
          assert selection.action == "select_option", selection
          assert selection.selection_time == "15:00", selection
          assert selection.entity_hints.requested_start_time is None, selection
          assert selection.entity_hints.not_before_time is None, selection
          assert "appointment_reschedule" in selection.capabilities, selection

          search = interpret_customer_turn(
              flow=case["_reschedule_flow"](presented=False),
              history=case["_reschedule_search_history"](),
              timezone_name="Africa/Cairo",
              local_now=local_now,
              clinic_catalog=catalog,
          )
          assert search.action in {"continue", "modify"}, search
          assert search.selection_time is None, search
          assert search.entity_hints.requested_start_time is None, search
          assert search.entity_hints.not_before_time == "15:00", search
          print("reschedule contextual semantics: PASS")
          PY
