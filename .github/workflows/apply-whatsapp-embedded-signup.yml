name: Apply WhatsApp Embedded Signup
on:
  push:
    branches: [feat/clinic-ops-ux-cleanup]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clinic-ops-ux-cleanup
          fetch-depth: 0
      - name: Patch integration wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_str, old, new):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path_str}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'backend/app/services/meta_whatsapp_onboarding.py',
              'from app.core.config import settings\n',
              'from app.core.meta_whatsapp_config import meta_whatsapp_settings as settings\n',
          )

          replace(
              'backend/app/models/__init__.py',
              'from app.models.channel_inbound_event import ChannelInboundEvent\n',
              'from app.models.channel_inbound_event import ChannelInboundEvent\nfrom app.models.channel_provider_credential import ChannelProviderCredential\n',
          )
          replace(
              'backend/app/models/__init__.py',
              '    "ChannelConnection",\n',
              '    "ChannelConnection",\n    "ChannelProviderCredential",\n',
          )

          replace(
              'backend/app/api/router.py',
              'from app.api.routes.payments import router as payments_router\n',
              'from app.api.routes.payments import router as payments_router\nfrom app.api.routes.whatsapp_setup import router as whatsapp_setup_router\n',
          )
          replace(
              'backend/app/api/router.py',
              'api_router.include_router(channels_router, prefix="/channels", tags=["channels"])\n',
              'api_router.include_router(channels_router, prefix="/channels", tags=["channels"])\napi_router.include_router(whatsapp_setup_router, prefix="/channels/whatsapp", tags=["whatsapp-setup"])\n',
          )

          requirements = Path('backend/requirements.txt')
          req = requirements.read_text(encoding='utf-8')
          if 'cryptography>=' not in req:
              req += 'cryptography>=45,<51\n'
              requirements.write_text(req, encoding='utf-8')

          replace(
              '.github/workflows/ci.yml',
              '0058_whatsapp_safety (head)',
              '0059_channel_provider_credentials (head)',
          )

          page = Path('frontend/src/app/(dashboard)/setup/whatsapp/page.tsx')
          text = page.read_text(encoding='utf-8')
          text = text.replace(
              'import type {\n  AutomationOperationsOverview,\n  AutomationRule,\n  ChannelConnection,\n} from "@/lib/types";\n',
              'import type {\n  AutomationOperationsOverview,\n  AutomationRule,\n  ChannelConnection,\n} from "@/lib/types";\nimport { MetaEmbeddedSignup, type EmbeddedSignupConfig } from "./meta-embedded-signup";\n',
              1,
          )
          text = text.replace(
              '  const [connections, rules, overview, ctx] = await Promise.all([\n    tiaRequest<ChannelConnection[]>("/channels/connections"),\n    tiaRequest<AutomationRule[]>("/automations/rules"),\n    tiaRequest<AutomationOperationsOverview>("/automations/overview"),\n    getAppContext(),\n  ]);',
              '  const [connections, rules, overview, signupConfig, ctx] = await Promise.all([\n    tiaRequest<ChannelConnection[]>("/channels/connections"),\n    tiaRequest<AutomationRule[]>("/automations/rules"),\n    tiaRequest<AutomationOperationsOverview>("/automations/overview"),\n    tiaRequest<EmbeddedSignupConfig>("/channels/whatsapp/setup/embedded-signup/config"),\n    getAppContext(),\n  ]);',
              1,
          )
          old_card = '''                    <p className="mt-2 text-sm leading-6 text-[var(--muted)]">\n                      زر الربط المباشر مع Meta سيظهر هنا عند تفعيل Embedded Signup على منصة Tia. لن يحتاج مدير العيادة لنسخ أي IDs أو Tokens يدويًا.\n                    </p>'''
          new_card = '''                    <p className="mt-2 mb-3 text-sm leading-6 text-[var(--muted)]">\n                      افتح شاشة Meta الرسمية واختار Business العيادة ورقم واتساب فقط.\n                    </p>\n                    <MetaEmbeddedSignup config={signupConfig} />'''
          if old_card not in text:
              raise SystemExit('WhatsApp next-step card not found')
          page.write_text(text.replace(old_card, new_card, 1), encoding='utf-8')
          PY
      - name: Backend static checks
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ruff check app alembic tests
          python -m compileall -q app alembic tests
          test "$(python -m alembic heads)" = "0059_channel_provider_credentials (head)"
      - name: Commit wiring and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-whatsapp-embedded-signup.yml
          git add backend frontend .github/workflows/ci.yml
          git commit -m "feat: wire WhatsApp embedded signup"
          git push origin HEAD:feat/clinic-ops-ux-cleanup
