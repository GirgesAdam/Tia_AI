name: Apply patient package panel

on:
  push:
    branches:
      - feat/laser-package-offers

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patient-package-panel-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/laser-package-offers
          fetch-depth: 0
      - name: Patch patient profile page
        run: |
          python backend/scripts/patch_patient_package_panel_temp.py
          git diff --check
      - name: Commit patient profile page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'frontend/src/app/(dashboard)/patients/[patientId]/page.tsx'
          git commit -m "feat(frontend): surface packages on patient profile [patient-package-panel-patched]"
          git push origin HEAD:feat/laser-package-offers
