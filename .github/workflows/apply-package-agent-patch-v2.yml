name: Apply package agent patch v2

on:
  push:
    branches:
      - feat/laser-package-offers

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[package-agent-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/laser-package-offers
          fetch-depth: 0
      - name: Apply focused source patches
        run: |
          python backend/scripts/patch_agent_chat_package_offers_temp.py
          python backend/scripts/patch_package_interpreter_temp.py
          git diff --check
      - name: Commit patched product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/agent_chat.py backend/app/agents/turn_interpreter.py
          git commit -m "feat(agent): complete verified package offer purchases [package-agent-patched]"
          git push origin HEAD:feat/laser-package-offers
