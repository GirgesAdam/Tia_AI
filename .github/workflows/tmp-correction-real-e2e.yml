name: Temporary Isolated Real Correction E2E

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  real-e2e:
    if: github.head_ref == 'fix/correction-semantics-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      MIGRATION_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
      SUPABASE_SECRET_KEY: sb_secret_ci_dummy
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      AGENT_V2_LIVE_ENABLED: "true"
      AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "2"
      LLM_REALTIME_MAX_RETRIES: "0"
      CORS_ORIGINS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/correction-semantics-20261011
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Verify OpenAI secret
        shell: bash
        run: test -n "$OPENAI_API_KEY"
      - name: Bootstrap Supabase compatibility roles
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h localhost -U ci_user -d ci_db -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
          END
          $$;
          SQL
      - name: Apply clean migrations
        run: python -m alembic upgrade head
      - name: Create isolated synthetic workspace
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine
          from sqlalchemy.orm import Session
          from app.core.config import settings
          from app.models.workspace import Workspace
          engine = create_engine(settings.database_url)
          with Session(engine) as db:
              db.add(Workspace(name="Correction E2E Clinic", slug="tia", timezone="Africa/Cairo", is_active=True, is_demo=True))
              db.commit()
          engine.dispose()
          PY
      - name: Seed realistic synthetic clinic
        run: python -m scripts.seed_realistic_aesthetic_clinic --workspace-slug tia
      - name: Clear seeded appointment history for correction cases
        env:
          PGPASSWORD: ci_password
        run: psql -h localhost -U ci_user -d ci_db -v ON_ERROR_STOP=1 -c "DELETE FROM appointments;"
      - name: Tighten E2E fixture assumptions in runner workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/tmp_correction_real_e2e.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "عايزة أحجز PRP للبشرة يوم 2026-10-17 الساعة 5 مع هالة مصطفى",
              "عايزة أحجز PRP للبشرة يوم 2026-10-17 الساعة 17:00 مع هالة مصطفى",
          )
          text = text.replace(
              '        start = (\n            f"عايزة أغير ميعاد {service.name} يوم {local.date().isoformat()} "\n            f"الساعة {local.strftime(\'%H:%M\')}"\n        )',
              '        start = "عايزة أغير ميعادي"',
          )
          text = text.replace(
              "عايزة أحجز PRP للبشرة يوم 2026-10-17 الساعة 3",
              "عايزة أحجز PRP للبشرة يوم 2026-10-17 الساعة 15:00",
          )
          text = text.replace("لا خليها 5", "لا خليها 17:00")
          p.write_text(text, encoding="utf-8")
          PY
      - name: Run rollback-only Real Agent E2E
        run: python -m scripts.tmp_correction_real_e2e
      - name: Upload exact replies and state report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correction-real-e2e
          path: backend/artifacts/correction-real-e2e.json
          if-no-files-found: warn
          retention-days: 7