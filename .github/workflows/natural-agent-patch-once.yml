name: Natural Agent Patch Once

on:
  push:
    branches:
      - feat/core-product-hardening
    paths:
      - .github/workflows/natural-agent-patch-once.yml
      - backend/scripts/apply_natural_agent_patch_once.py

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply patch
        working-directory: backend
        run: python scripts/apply_natural_agent_patch_once.py

      - name: Lint
        working-directory: backend
        run: |
          ruff check --fix app tests scripts/apply_natural_agent_patch_once.py
          ruff check app tests scripts/apply_natural_agent_patch_once.py

      - name: Focused natural UX tests
        working-directory: backend
        run: pytest -q tests/test_agent_natural_availability.py

      - name: Full backend regression
        working-directory: backend
        run: pytest -q

      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/agents/availability_presentation.py \
                  backend/app/agents/semantic_actions.py \
                  backend/app/agents/tools/clinic_tools.py \
                  backend/app/services/agent_chat.py \
                  backend/app/agents/prompts/customer_service.py \
                  backend/app/agents/grounded_response.py \
                  backend/app/agents/tia_customer_agent.py \
                  backend/app/agents/turn_interpreter.py \
                  backend/tests/test_agent_natural_availability.py
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "fix: make customer booking conversations natural"
          git push origin HEAD:feat/core-product-hardening
