name: Fix PR40 Ruff

on:
  push:
    branches:
      - test/realistic-system-journeys-v1
    paths:
      - .github/workflows/fix-pr40-ruff.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/realistic-system-journeys-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.7
      - name: Apply Ruff fixes only
        working-directory: backend
        run: ruff check app/agents/turn_interpreter.py tests/test_verified_cancellation_execution.py --fix
      - name: Commit fixes
        run: |
          git config user.name "Tia CI"
          git config user.email "tia-ci@users.noreply.github.com"
          git add backend/app/agents/turn_interpreter.py backend/tests/test_verified_cancellation_execution.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix agent lint after semantic cleanup"
          git push origin HEAD:test/realistic-system-journeys-v1
