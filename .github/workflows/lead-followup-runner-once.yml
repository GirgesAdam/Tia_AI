name: Lead follow-up runner once

on:
  push:
    branches: [feat/core-product-hardening]
    paths:
      - .github/workflows/lead-followup-runner-once.yml

permissions:
  contents: read

jobs:
  inspect-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/core-product-hardening
          fetch-depth: 0

      - name: Inspect extracted patch around failing assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/lead-followup-once.yml').read_text(encoding='utf-8').splitlines()
          marker = next(i for i, line in enumerate(lines) if 'name: Add optional lead not-booked follow-up' in line)
          start = next(i for i in range(marker + 1, len(lines)) if lines[i].strip() == 'run: |') + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == '- uses: actions/setup-python@v5')
          body = [line[10:] if line.startswith('          ') else line for line in lines[start:end]]
          script = '\n'.join(body) + '\n'
          compile(script, '<lead-followup-patch>', 'exec')
          for number, line in enumerate(script.splitlines(), start=1):
              if 325 <= number <= 350:
                  print(f'{number:04d}: {line}')
          PY
