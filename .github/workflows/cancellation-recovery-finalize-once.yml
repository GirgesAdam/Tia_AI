name: Cancellation recovery finalize once

on:
  push:
    branches: [feat/core-product-hardening]
    paths:
      - .github/workflows/cancellation-recovery-finalize-once.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/core-product-hardening
          fetch-depth: 0

      - name: Add optional cancellation recovery automation
        shell: python
        run: |
          from pathlib import Path

          def find_line(lines: list[str], needle: str, start: int = 0) -> int:
              for index in range(start, len(lines)):
                  if needle in lines[index]:
                      return index
              raise AssertionError(f"Missing marker: {needle}")

          # Default rule + cancelled_at scheduling anchor.
          path = Path("backend/app/core/automation_rules.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          assert not any('key="cancellation_recovery"' in line for line in lines)
          key_index = find_line(lines, 'key="no_show_followup"')
          start_index = key_index - 1
          base_indent = lines[start_index][: len(lines[start_index]) - len(lines[start_index].lstrip())]
          inner = base_indent + "    "
          lines[start_index:start_index] = [
              f"{base_indent}DefaultAutomationRule(",
              f'{inner}key="cancellation_recovery",',
              f'{inner}name="Cancellation recovery follow-up",',
              f'{inner}trigger_kind="after_cancelled",',
              f"{inner}offset_minutes=60,",
              f'{inner}channel="whatsapp",',
              f'{inner}template_name="tia_cancellation_recovery_ar",',
              f'{inner}template_language="ar",',
              f"{inner}max_lateness_minutes=1440,",
              f"{inner}enabled_by_default=False,",
              f"{base_indent}),",
          ]
          no_show_param = find_line(lines, "no_show_at: datetime | None,")
          param_indent = lines[no_show_param][: len(lines[no_show_param]) - len(lines[no_show_param].lstrip())]
          lines.insert(no_show_param + 1, f"{param_indent}cancelled_at: datetime | None = None,")
          anchor_index = find_line(lines, 'elif trigger_kind == "after_no_show":')
          anchor_indent = lines[anchor_index][: len(lines[anchor_index]) - len(lines[anchor_index].lstrip())]
          lines[anchor_index + 2:anchor_index + 2] = [
              f'{anchor_indent}elif trigger_kind == "after_cancelled":',
              f"{anchor_indent}    anchor = cancelled_at",
          ]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          # Persisted trigger-kind constraint.
          path = Path("backend/app/models/automation_rule.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          trigger_tuple = find_line(lines, '"after_no_show",')
          indent = lines[trigger_tuple][: len(lines[trigger_tuple]) - len(lines[trigger_tuple].lstrip())]
          lines.insert(trigger_tuple + 1, f'{indent}"after_cancelled",')
          text = "\n".join(lines) + "\n"
          old_check = "trigger_kind IN ('appointment_created', 'before_appointment', 'after_completed', 'after_no_show')"
          new_check = "trigger_kind IN ('appointment_created', 'before_appointment', 'after_completed', 'after_no_show', 'after_cancelled')"
          assert old_check in text
          path.write_text(text.replace(old_check, new_check, 1), encoding="utf-8")

          # Reuse the existing appointment automation planner/executor.
          path = Path("backend/app/services/automations.py")
          lines = path.read_text(encoding="utf-8").splitlines()
          eligible_start = find_line(lines, "def _eligible_for_rule")
          eligible_no_show = find_line(lines, 'if rule.trigger_kind == "after_no_show":', eligible_start)
          indent = lines[eligible_no_show][: len(lines[eligible_no_show]) - len(lines[eligible_no_show].lstrip())]
          lines[eligible_no_show + 2:eligible_no_show + 2] = [
              f'{indent}if rule.trigger_kind == "after_cancelled":',
              f'{indent}    return appointment.status == "cancelled" and appointment.cancelled_at is not None',
          ]

          candidate_start = find_line(lines, "def _candidate_appointments")
          candidate_no_show = find_line(lines, 'if rule.trigger_kind == "after_no_show":', candidate_start)
          candidate_return = find_line(lines, "return []", candidate_no_show)
          indent = lines[candidate_no_show][: len(lines[candidate_no_show]) - len(lines[candidate_no_show].lstrip())]
          i1, i2, i3, i4 = indent + "    ", indent + "        ", indent + "            ", indent + "                "
          lines[candidate_return:candidate_return] = [
              f'{indent}if rule.trigger_kind == "after_cancelled":',
              f"{i1}oldest = now - timedelta(days=7)",
              f"{i1}return list(",
              f"{i2}db.scalars(",
              f"{i3}select(Appointment).where(",
              f"{i4}Appointment.workspace_id == workspace_id,",
              f'{i4}Appointment.status == "cancelled",',
              f"{i4}Appointment.cancelled_at.is_not(None),",
              f"{i4}Appointment.cancelled_at >= oldest,",
              f"{i3})",
              f"{i2})",
              f"{i1})",
          ]

          plan_start = find_line(lines, "def plan_automation_jobs")
          no_show_call = find_line(lines, "no_show_at=appointment.no_show_at,", plan_start)
          call_indent = lines[no_show_call][: len(lines[no_show_call]) - len(lines[no_show_call].lstrip())]
          lines.insert(no_show_call + 1, f"{call_indent}cancelled_at=appointment.cancelled_at,")

          fallback_start = find_line(lines, "def _fallback_text")
          no_show_copy = find_line(lines, 'if rule_key == "no_show_followup":', fallback_start)
          indent = lines[no_show_copy][: len(lines[no_show_copy]) - len(lines[no_show_copy].lstrip())]
          lines[no_show_copy:no_show_copy] = [
              f'{indent}if rule_key == "cancellation_recovery":',
              f"{indent}    return (",
              f'{indent}        f"أهلًا {{data[\'patient_name\']}}، حبيت أساعدك بعد إلغاء موعد {{data[\'service_name\']}} "',
              f'{indent}        f"يوم {{data[\'date\']}} الساعة {{data[\'time\']}}. "',
              f'{indent}        "لو حابة نرتب ميعاد جديد ابعتيلي هنا وأنا أساعدك."',
              f"{indent}    )",
          ]

          params_start = find_line(lines, "def _appointment_template_body_parameters")
          post_params = find_line(lines, 'if rule_key == "post_visit_followup":', params_start)
          indent = lines[post_params][: len(lines[post_params]) - len(lines[post_params].lstrip())]
          lines[post_params:post_params] = [
              f'{indent}if rule_key == "cancellation_recovery":',
              f"{indent}    return [patient_name, service_name, date, time]",
          ]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          # Admin UI: optional toggle + the same simple timing form.
          path = Path("frontend/src/app/(dashboard)/automations/page.tsx")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '  no_show_followup: "متابعة عدم الحضور",',
              '  cancellation_recovery: "استرجاع الحجوزات الملغاة",\n  no_show_followup: "متابعة عدم الحضور",',
              1,
          )
          text = text.replace(
              '  no_show_followup: "اختياري: تتواصل مع العميل بعد عدم الحضور لعرض إعادة الحجز.",',
              '  cancellation_recovery: "اختياري: تتواصل مع العميل بعد إلغاء الموعد وتعرض عليه ترتيب موعد جديد.",\n  no_show_followup: "اختياري: تتواصل مع العميل بعد عدم الحضور لعرض إعادة الحجز.",',
              1,
          )
          text = text.replace(
              '  "post_visit_followup",\n  "no_show_followup",',
              '  "post_visit_followup",\n  "cancellation_recovery",\n  "no_show_followup",',
              1,
          )
          text = text.replace(
              'const timingRuleKeys = new Set(["appointment_reminder_6h", "post_visit_followup", "no_show_followup"]);',
              'const timingRuleKeys = new Set(["appointment_reminder_6h", "post_visit_followup", "cancellation_recovery", "no_show_followup"]);',
              1,
          )
          old_label = '  if (rule.trigger_kind === "after_no_show") return "أرسل بعد عدم الحضور بـ";'
          assert old_label in text
          text = text.replace(
              old_label,
              old_label + '\n  if (rule.trigger_kind === "after_cancelled") return "أرسل بعد إلغاء الموعد بـ";',
              1,
          )
          assert "cancellation_recovery" in text
          path.write_text(text, encoding="utf-8")

          # Minimal migration: widen only the existing check constraint.
          migration_path = Path("backend/alembic/versions/0054_cancel_recovery.py")
          migration_path.write_text(
              '''"""Allow cancellation recovery automation rules.\n\nRevision ID: 0054_cancel_recovery\nRevises: 0053_public_table_rls_completion\nCreate Date: 2026-09-04\n"""\n\nfrom collections.abc import Sequence\n\nfrom alembic import op\n\nrevision: str = "0054_cancel_recovery"\ndown_revision: str | Sequence[str] | None = "0053_public_table_rls_completion"\nbranch_labels: str | Sequence[str] | None = None\ndepends_on: str | Sequence[str] | None = None\n\n\ndef _replace_trigger_constraint(values: str) -> None:\n    op.drop_constraint(\n        "automation_rule_trigger_kind_valid",\n        "automation_rules",\n        type_="check",\n    )\n    op.create_check_constraint(\n        "automation_rule_trigger_kind_valid",\n        "automation_rules",\n        f"trigger_kind IN ({values})",\n    )\n\n\ndef upgrade() -> None:\n    _replace_trigger_constraint(\n        "'appointment_created', 'before_appointment', 'after_completed', 'after_no_show', 'after_cancelled'"\n    )\n\n\ndef downgrade() -> None:\n    _replace_trigger_constraint(\n        "'appointment_created', 'before_appointment', 'after_completed', 'after_no_show'"\n    )\n''',
              encoding="utf-8",
          )

          readiness = Path("backend/app/services/operational_readiness.py")
          text = readiness.read_text(encoding="utf-8")
          assert 'EXPECTED_MIGRATION_HEAD = "0053_public_table_rls_completion"' in text
          readiness.write_text(
              text.replace(
                  'EXPECTED_MIGRATION_HEAD = "0053_public_table_rls_completion"',
                  'EXPECTED_MIGRATION_HEAD = "0054_cancel_recovery"',
                  1,
              ),
              encoding="utf-8",
          )

          # Update only assertions that mean "current schema head".
          old_eq = 'EXPECTED_MIGRATION_HEAD == "0053_public_table_rls_completion"'
          new_eq = 'EXPECTED_MIGRATION_HEAD == "0054_cancel_recovery"'
          old_source = 'EXPECTED_MIGRATION_HEAD = "0053_public_table_rls_completion"'
          new_source = 'EXPECTED_MIGRATION_HEAD = "0054_cancel_recovery"'
          for test_path in Path("backend/tests").glob("test_*.py"):
              source = test_path.read_text(encoding="utf-8")
              updated = source.replace(old_eq, new_eq).replace(old_source, new_source)
              if updated != source:
                  test_path.write_text(updated, encoding="utf-8")

          # Existing exact rule-set contracts now include the new opt-in rule.
          for test_name in ("test_automation_engine.py", "test_automation_product_contract.py"):
              test_path = Path("backend/tests") / test_name
              source = test_path.read_text(encoding="utf-8")
              marker = '        "post_visit_followup",\n        "no_show_followup",'
              assert marker in source
              source = source.replace(
                  marker,
                  '        "post_visit_followup",\n        "cancellation_recovery",\n        "no_show_followup",',
                  1,
              )
              if test_name == "test_automation_product_contract.py":
                  marker2 = '    assert rules["post_visit_followup"].enabled_by_default is False\n'
                  assert marker2 in source
                  source = source.replace(
                      marker2,
                      marker2 + '    assert rules["cancellation_recovery"].enabled_by_default is False\n',
                      1,
                  )
              test_path.write_text(source, encoding="utf-8")

          # Focused cancellation-recovery contract.
          Path("backend/tests/test_cancellation_recovery_automation.py").write_text(
              '''from datetime import UTC, datetime\nfrom pathlib import Path\n\nfrom app.core.automation_rules import DEFAULT_AUTOMATION_RULES, scheduled_for\nfrom app.services.automations import _appointment_template_body_parameters\n\n\ndef _root() -> Path:\n    return Path(__file__).resolve().parents[2]\n\n\ndef test_cancellation_recovery_is_optional_and_uses_cancelled_at() -> None:\n    rules = {rule.key: rule for rule in DEFAULT_AUTOMATION_RULES}\n    rule = rules["cancellation_recovery"]\n    assert rule.enabled_by_default is False\n    assert rule.trigger_kind == "after_cancelled"\n    assert rule.offset_minutes == 60\n    cancelled_at = datetime(2026, 9, 4, 12, 0, tzinfo=UTC)\n    when = scheduled_for(\n        trigger_kind=rule.trigger_kind,\n        offset_minutes=rule.offset_minutes,\n        appointment_created_at=cancelled_at,\n        appointment_start_at=cancelled_at,\n        completed_at=None,\n        no_show_at=None,\n        cancelled_at=cancelled_at,\n    )\n    assert when == datetime(2026, 9, 4, 13, 0, tzinfo=UTC)\n\n\ndef test_cancellation_recovery_reuses_existing_appointment_engine() -> None:\n    service = (_root() / "backend/app/services/automations.py").read_text(encoding="utf-8")\n    assert 'rule.trigger_kind == "after_cancelled"' in service\n    assert 'Appointment.status == "cancelled"' in service\n    assert "Appointment.cancelled_at >= oldest" in service\n    assert "CancellationRecovery" not in service\n    assert "cancellation_recovery_state" not in service\n\n\ndef test_cancellation_recovery_template_contract_is_four_simple_variables() -> None:\n    assert _appointment_template_body_parameters(\n        "cancellation_recovery",\n        {\n            "patient_name": "سارة",\n            "service_name": "ليزر",\n            "date": "04/09/2026",\n            "time": "18:00",\n            "branch_name": "العيادة",\n        },\n    ) == ["سارة", "ليزر", "04/09/2026", "18:00"]\n\n\ndef test_cancellation_recovery_is_admin_visible_and_timing_configurable() -> None:\n    page = (_root() / "frontend/src/app/(dashboard)/automations/page.tsx").read_text(encoding="utf-8")\n    assert 'cancellation_recovery: "استرجاع الحجوزات الملغاة"' in page\n    assert 'rule.trigger_kind === "after_cancelled"' in page\n\n\ndef test_migration_only_extends_automation_trigger_constraint() -> None:\n    migration = (_root() / "backend/alembic/versions/0054_cancel_recovery.py").read_text(encoding="utf-8")\n    assert 'revision: str = "0054_cancel_recovery"' in migration\n    assert 'down_revision: str | Sequence[str] | None = "0053_public_table_rls_completion"' in migration\n    assert "automation_rule_trigger_kind_valid" in migration\n    assert "after_cancelled" in migration\n    assert "create_table" not in migration\n    assert "add_column" not in migration\n''',
              encoding="utf-8",
          )

          docs = Path("n8n/AUTOMATIONS_SETUP.md")
          text = docs.read_text(encoding="utf-8")
          if "## Cancellation recovery" not in text:
              text += '''\n\n## Cancellation recovery\n\n`cancellation_recovery` is an optional WhatsApp automation and is disabled by default.\nThe admin can enable it and choose how long after `appointments.cancelled_at` it should run.\nIt reuses the normal appointment automation job/outbox path; there is no separate cancellation workflow or state machine.\nThe Meta template is `tia_cancellation_recovery_ar` with four positional body parameters: customer name, service, cancelled appointment date, and cancelled appointment time.\n'''
          docs.write_text(text, encoding="utf-8")

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend quality gate
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
          MIGRATION_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          SUPABASE_SECRET_KEY: sb_secret_ci_dummy
          ENVIRONMENT: test
          DEBUG: "false"
          DOCS_ENABLED: "false"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ruff check app tests alembic
          python -m compileall -q app alembic tests
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend quality gate
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          TIA_API_URL: http://127.0.0.1:8000
        run: |
          npm ci
          npm run lint
          npx next typegen
          npm run typecheck
          npm run build

      - name: Commit tested cancellation recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app backend/alembic/versions/0054_cancel_recovery.py backend/tests 'frontend/src/app/(dashboard)/automations/page.tsx' n8n/AUTOMATIONS_SETUP.md
          git diff --cached --check
          git commit -m "feat: add optional cancellation recovery automation"
          git push origin HEAD:feat/core-product-hardening
