name: Security dependency update

on:
  push:
    branches: [chore/security-dependency-update]

permissions:
  contents: write

jobs:
  update-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Update Next.js runtime
        run: npm install next@16.3.4 --save-exact
      - name: Keep Next ESLint config aligned
        run: npm install eslint-config-next@16.3.4 --save-dev --save-exact
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run build
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "Update Next.js security dependencies"
          git push
