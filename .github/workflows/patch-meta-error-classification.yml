name: Patch Meta Error Classification
on:
  push:
    branches: [feat/clinic-ops-ux-cleanup]
    paths: [.github/workflows/patch-meta-error-classification.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clinic-ops-ux-cleanup
      - name: Patch provider error classification
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/meta_whatsapp_transport.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '''class MetaWhatsAppTransportError(RuntimeError):\n    pass\n''',
              '''class MetaWhatsAppTransportError(RuntimeError):\n    def __init__(self, message: str, *, code: int | None = None) -> None:\n        super().__init__(message)\n        self.code = code\n''',
              1,
          )

          provider_marker = '''    return message, error_meta\n\n\ndef _credential_for_connection'''
          provider_replacement = '''    return message, error_meta\n\n\ndef _coerce_meta_error_code(value: object) -> int | None:\n    try:\n        return int(value) if value is not None else None\n    except (TypeError, ValueError):\n        return None\n\n\ndef _credential_for_connection'''
          if provider_marker not in text:
              raise SystemExit('provider error marker not found')
          text = text.replace(provider_marker, provider_replacement, 1)

          old_raise = '''        raise MetaWhatsAppTransportError(f"{meta.get('code') or ''}:{message}")'''
          new_raise = '''        raise MetaWhatsAppTransportError(\n            message,\n            code=_coerce_meta_error_code(meta.get("code")),\n        )'''
          if text.count(old_raise) != 2:
              raise SystemExit(f'expected two provider raises, got {text.count(old_raise)}')
          text = text.replace(old_raise, new_raise)

          old_health_sig = '''def _set_provider_health(\n    connection: ChannelConnection,\n    *,\n    state: str,\n    error: str | None = None,\n    action_required: str | None = None,\n) -> None:'''
          new_health_sig = '''def _set_provider_health(\n    connection: ChannelConnection,\n    *,\n    state: str,\n    error: str | None = None,\n    error_code: int | str | None = None,\n    action_required: str | None = None,\n) -> None:'''
          if old_health_sig not in text:
              raise SystemExit('health signature marker not found')
          text = text.replace(old_health_sig, new_health_sig, 1)
          text = text.replace(
              '    health["current_error_code"] = None\n',
              '    health["current_error_code"] = str(error_code) if error_code is not None else None\n',
              1,
          )

          old_catch = '''    try:\n        phone_info = _fetch_phone_info(token, phone_number_id)\n        template_statuses = _fetch_template_statuses(token, waba_id)\n    except (httpx.HTTPError, MetaWhatsAppTransportError) as exc:\n        message = str(exc)\n        config = dict(connection.config_json or {})\n        config["transport_ready"] = False\n        connection.config_json = config\n        connection.status = "paused"\n        action_required = "reconnect_meta" if message.startswith("190:") else None\n        _set_provider_health(\n            connection,\n            state="degraded",\n            error=message,\n            action_required=action_required,\n        )\n        db.commit()\n        return False\n'''
          new_catch = '''    try:\n        phone_info = _fetch_phone_info(token, phone_number_id)\n        template_statuses = _fetch_template_statuses(token, waba_id)\n    except (httpx.HTTPError, MetaWhatsAppTransportError) as exc:\n        message = str(exc)\n        error_code = exc.code if isinstance(exc, MetaWhatsAppTransportError) else None\n        config = dict(connection.config_json or {})\n        config["transport_ready"] = False\n        connection.config_json = config\n        connection.status = "paused"\n        action_required = (\n            "reconnect_meta"\n            if error_code == 190\n            else "meta_account_review"\n            if error_code == 131031\n            else None\n        )\n        _set_provider_health(\n            connection,\n            state="disabled" if error_code == 131031 else "degraded",\n            error=message,\n            error_code=error_code,\n            action_required=action_required,\n        )\n        db.commit()\n        return False\n'''
          if old_catch not in text:
              raise SystemExit('readiness catch marker not found')
          text = text.replace(old_catch, new_catch, 1)

          old_reconnect = '''            _set_provider_health(\n                connection,\n                state="degraded",\n                error=message,\n                action_required="reconnect_meta",\n            )'''
          new_reconnect = '''            _set_provider_health(\n                connection,\n                state="degraded",\n                error=message,\n                error_code=190,\n                action_required="reconnect_meta",\n            )'''
          if old_reconnect not in text:
              raise SystemExit('send reconnect marker not found')
          text = text.replace(old_reconnect, new_reconnect, 1)
          path.write_text(text, encoding='utf-8')

          onboarding_path = Path('backend/app/services/meta_whatsapp_onboarding.py')
          onboarding = onboarding_path.read_text(encoding='utf-8')
          marker = '''def _exchange_signup_code(code: str) -> tuple[str, datetime | None]:\n'''
          helper = '''def _setup_provider_health(\n    provider_error: MetaWhatsAppProviderError | None,\n    *,\n    now: datetime,\n) -> dict[str, Any]:\n    code = provider_error.code if provider_error else None\n    state = (\n        "disabled"\n        if code == "131031"\n        else "degraded"\n        if provider_error is not None\n        else "setup_pending"\n    )\n    health: dict[str, Any] = {\n        "state": state,\n        "current_error_code": code,\n        "current_error": str(provider_error) if provider_error else None,\n        "last_checked_at": now.isoformat(),\n    }\n    if code == "190":\n        health["action_required"] = "reconnect_meta"\n    elif code == "131031":\n        health["action_required"] = "meta_account_review"\n    return health\n\n\n'''
          if marker not in onboarding:
              raise SystemExit('onboarding helper marker not found')
          onboarding = onboarding.replace(marker, helper + marker, 1)

          old_health = '''    health = {\n        "state": "degraded" if provider_error else "setup_pending",\n        "current_error_code": provider_error.code if provider_error else None,\n        "current_error": str(provider_error) if provider_error else None,\n        "last_checked_at": now.isoformat(),\n    }\n'''
          new_health = '''    health = _setup_provider_health(provider_error, now=now)\n'''
          if old_health not in onboarding:
              raise SystemExit('onboarding health marker not found')
          onboarding = onboarding.replace(old_health, new_health, 1)
          onboarding_path.write_text(onboarding, encoding='utf-8')

          transport_test = Path('backend/tests/test_meta_native_whatsapp_transport.py')
          tests = transport_test.read_text(encoding='utf-8')
          tests = tests.replace(
              'from app.services.meta_whatsapp_transport import (\n',
              'import app.services.meta_whatsapp_transport as meta_transport\nfrom app.services.meta_whatsapp_transport import (\n',
              1,
          )
          tests = tests.replace(
              '    build_meta_message_payload,\n',
              '    build_meta_message_payload,\n    refresh_meta_connection_readiness,\n',
              1,
          )
          anchor = '''def test_native_transport_builds_text_message() -> None:\n'''
          additions = '''def _provider_error_connection():\n    return SimpleNamespace(\n        channel="whatsapp",\n        provider="meta_cloud",\n        external_account_id="123456789",\n        status="active",\n        config_json={\n            "phone_number_id": "123456789",\n            "waba_id": "987654321",\n            "transport_ready": True,\n        },\n    )\n\n\ndef test_readiness_131031_surfaces_meta_account_review(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    connection = _provider_error_connection()\n    db = SimpleNamespace(commit=lambda: None)\n    monkeypatch.setattr(\n        meta_transport,\n        "_decrypt_connection_token",\n        lambda _db, _connection: ("token", None),\n    )\n\n    def fail_phone(_token: str, _phone_number_id: str):\n        raise MetaWhatsAppTransportError("Business account locked", code=131031)\n\n    monkeypatch.setattr(meta_transport, "_fetch_phone_info", fail_phone)\n\n    assert refresh_meta_connection_readiness(db, connection) is False\n    health = connection.config_json["provider_health"]\n    assert connection.status == "paused"\n    assert connection.config_json["transport_ready"] is False\n    assert health["state"] == "disabled"\n    assert health["current_error_code"] == "131031"\n    assert health["action_required"] == "meta_account_review"\n\n\ndef test_readiness_190_surfaces_reconnect_meta(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    connection = _provider_error_connection()\n    db = SimpleNamespace(commit=lambda: None)\n    monkeypatch.setattr(\n        meta_transport,\n        "_decrypt_connection_token",\n        lambda _db, _connection: ("token", None),\n    )\n\n    def fail_phone(_token: str, _phone_number_id: str):\n        raise MetaWhatsAppTransportError("Invalid OAuth access token", code=190)\n\n    monkeypatch.setattr(meta_transport, "_fetch_phone_info", fail_phone)\n\n    assert refresh_meta_connection_readiness(db, connection) is False\n    health = connection.config_json["provider_health"]\n    assert connection.status == "paused"\n    assert health["state"] == "degraded"\n    assert health["current_error_code"] == "190"\n    assert health["action_required"] == "reconnect_meta"\n\n\n'''
          if anchor not in tests:
              raise SystemExit('transport test anchor not found')
          tests = tests.replace(anchor, additions + anchor, 1)
          transport_test.write_text(tests, encoding='utf-8')

          onboarding_test = Path('backend/tests/test_whatsapp_embedded_signup_onboarding.py')
          otests = onboarding_test.read_text(encoding='utf-8')
          otests = otests.replace(
              'from pathlib import Path\n',
              'from datetime import UTC, datetime\nfrom pathlib import Path\n',
              1,
          )
          otests = otests.replace(
              'from app.services.meta_whatsapp_onboarding import embedded_signup_public_config\n',
              'from app.services.meta_whatsapp_onboarding import (\n    MetaWhatsAppProviderError,\n    _setup_provider_health,\n    embedded_signup_public_config,\n)\n',
              1,
          )
          oanchor = '''def test_provider_access_token_is_encrypted_at_rest(monkeypatch: pytest.MonkeyPatch) -> None:\n'''
          oadditions = '''def test_signup_provider_health_classifies_reconnect_and_account_review() -> None:\n    now = datetime(2026, 9, 7, 20, 0, tzinfo=UTC)\n\n    expired = _setup_provider_health(\n        MetaWhatsAppProviderError("Invalid OAuth token", code="190"),\n        now=now,\n    )\n    locked = _setup_provider_health(\n        MetaWhatsAppProviderError("Business account locked", code="131031"),\n        now=now,\n    )\n\n    assert expired["state"] == "degraded"\n    assert expired["action_required"] == "reconnect_meta"\n    assert expired["current_error_code"] == "190"\n    assert locked["state"] == "disabled"\n    assert locked["action_required"] == "meta_account_review"\n    assert locked["current_error_code"] == "131031"\n\n\n'''
          if oanchor not in otests:
              raise SystemExit('onboarding test anchor not found')
          otests = otests.replace(oanchor, oadditions + oanchor, 1)
          onboarding_test.write_text(otests, encoding='utf-8')
          PY
      - name: Validate patched files
        run: |
          python -m compileall -q backend/app/services/meta_whatsapp_transport.py backend/app/services/meta_whatsapp_onboarding.py backend/tests/test_meta_native_whatsapp_transport.py backend/tests/test_whatsapp_embedded_signup_onboarding.py
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/meta_whatsapp_transport.py backend/app/services/meta_whatsapp_onboarding.py backend/tests/test_meta_native_whatsapp_transport.py backend/tests/test_whatsapp_embedded_signup_onboarding.py
          git commit -m "fix: preserve Meta provider error actions"
          git push origin HEAD:feat/clinic-ops-ux-cleanup
