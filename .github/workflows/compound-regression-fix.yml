name: Compound flow regression fix

on:
  push:
    branches:
      - feat/compound-customer-requests
    paths:
      - .github/workflows/compound-regression-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compound-customer-requests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply safe compound regression fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          chat = Path('backend/app/services/agent_chat.py')
          source = chat.read_text(encoding='utf-8')
          old = '''    candidate_list_fields = {\n        "service_candidate_ids",\n        "branch_candidate_ids",\n        "doctor_candidate_ids",\n    }\n'''
          new = '''    candidate_list_fields = {\n        "service_candidate_ids",\n        "branch_candidate_ids",\n        "doctor_candidate_ids",\n        "requested_items",\n    }\n'''
          if source.count(old) != 1:
              raise SystemExit(f'agent_chat candidate marker count={source.count(old)}')
          chat.write_text(source.replace(old, new, 1), encoding='utf-8')

          interpreter = Path('backend/app/agents/turn_interpreter.py')
          source = interpreter.read_text(encoding='utf-8')
          old = (
              '        "Use at most six requested_items. Leave requested_items empty for ordinary single-operation turns. "\n'
              '        "For a compound request include the union of required capabilities; Python will sequence and authorize "\n'
          )
          new = (
              '        "Use at most six requested_items. Leave requested_items empty for ordinary single-operation turns. "\n'
              '        "If the latest turn is a direct clarification to the immediately preceding assistant question about a missing "\n'
              '        "field in a compound request, reconstruct the same requested_items from recent conversation context and change "\n'
              '        "only the clarified field; do not drop the other requested operations. "\n'
              '        "For a compound request include the union of required capabilities; Python will sequence and authorize "\n'
          )
          if source.count(old) != 1:
              raise SystemExit(f'interpreter prompt marker count={source.count(old)}')
          interpreter.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate focused backend files
        run: |
          cd backend
          python -m pip install 'ruff>=0.12,<1.0' 'pydantic>=2.9'
          ruff check app/services/agent_chat.py app/agents/turn_interpreter.py
          python -m compileall -q app/services/agent_chat.py app/agents/turn_interpreter.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/agent_chat.py backend/app/agents/turn_interpreter.py
          git commit -m "fix(agent): preserve single flows and compound clarifications"
          git push origin HEAD:feat/compound-customer-requests
