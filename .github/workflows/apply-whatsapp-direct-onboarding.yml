name: Apply direct WhatsApp onboarding patch
on:
  push:
    branches: [feat/clinic-ops-ux-cleanup]
    paths:
      - apply_whatsapp_direct_onboarding_patch.py
      - .github/workflows/apply-whatsapp-direct-onboarding.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clinic-ops-ux-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python apply_whatsapp_direct_onboarding_patch.py
      - name: Validate backend syntax and direct onboarding tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ruff check app tests alembic
          python -m compileall -q app alembic tests
          python -m pytest -q tests/test_whatsapp_direct_onboarding.py tests/test_meta_native_whatsapp_transport.py
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx next typegen
          npm run typecheck
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace Embedded Signup with direct WhatsApp onboarding"
          git push origin HEAD:feat/clinic-ops-ux-cleanup
