name: Temporary Correction Semantics Validation

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'fix/correction-semantics-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_correction_review_unused
      SUPABASE_SECRET_KEY: sb_secret_correction_review_unused
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "2"
      LLM_REALTIME_MAX_RETRIES: "0"
      AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
      CORS_ORIGINS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/correction-semantics-20261011
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify staging secrets
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$DATABASE_URL"
      - name: Focused deterministic correction regressions
        run: |
          python -m pytest -q \
            tests/test_v2_correction_semantics_fix.py \
            tests/test_v2_active_task_progress.py \
            tests/test_agent_availability_reference_interpreter.py \
            tests/test_v2_reschedule_required_field_safety_db.py \
            tests/test_v2_structured_output_containment.py \
            tests/test_v2_structured_output_containment_db.py \
            tests/test_v2_side_question_continuity.py
      - name: Real Agent rollback-only C1-C18 and CLEAR safety
        run: python -m scripts.tmp_correction_semantics_validation
      - name: Upload correction validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correction-semantics-validation
          path: backend/artifacts/correction-semantics-validation.json
          if-no-files-found: warn
          retention-days: 7
