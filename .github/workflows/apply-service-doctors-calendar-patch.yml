name: Apply service doctors calendar patch

on:
  push:
    branches:
      - fix/service-edit-doctors-calendar
    paths:
      - backend/scripts/apply_service_doctors_calendar_patch.py
      - .github/workflows/apply-service-doctors-calendar-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/service-edit-doctors-calendar
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python backend/scripts/apply_service_doctors_calendar_patch.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "Fix appointment service edits and add doctor calendar"
          git push origin HEAD:fix/service-edit-doctors-calendar
