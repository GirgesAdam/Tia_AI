name: Automation UI hardening (one-time)

on:
  push:
    branches: [feat/core-product-hardening]
    paths: [.github/workflows/automation-ui-hardening-once.yml]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/core-product-hardening
          fetch-depth: 0

      - name: Patch automation admin UI
        shell: python
        run: |
          from pathlib import Path

          path = Path("frontend/src/app/(dashboard)/automations/page.tsx")
          source = path.read_text(encoding="utf-8")

          source = source.replace(
              'const legacyRuleKeys = new Set(["appointment_reminder_24h", "appointment_reminder_2h"]);',
              'const visibleProductRuleKeys = new Set(["booking_confirmation", "appointment_reminder_6h", "post_visit_followup"]);',
              1,
          )
          source = source.replace(
              '  if (state === "stale") return "بعض عمليات الأتمتة تتأخر عن المعتاد. راجع الحالات التي تحتاج تدخلًا أدناه.";\n  if (state === "missing") return "الأتمتة غير جاهزة للتنفيذ حاليًا. راجع إعدادات التشغيل قبل الاعتماد على الرسائل التلقائية.";',
              '  if (state === "stale") return "محرك تنفيذ الأتمتة غير متصل حاليًا، لذلك لن تُرسل الرسائل التلقائية حتى يعود الاتصال.";\n  if (state === "missing") return "لم يتم ربط محرك تنفيذ الأتمتة بعد، لذلك لن تُرسل الرسائل التلقائية حتى يكتمل إعداد التشغيل.";',
              1,
          )
          source = source.replace(
              '  const rules = rawRules.filter((rule) => !legacyRuleKeys.has(rule.key));',
              '  const rules = rawRules.filter((rule) => visibleProductRuleKeys.has(rule.key));',
              1,
          )
          old_warning = '''          <div><b>تحتاج مراجعة</b><p className="mt-1 leading-6">{warning}</p></div>'''
          new_warning = '''          <div>\n            <b>تحتاج مراجعة</b>\n            <p className="mt-1 leading-6">{warning}</p>\n            {overview.worker_last_seen_at && (\n              <p className="mt-1 text-xs">آخر اتصال بمحرك التنفيذ: {formatDateTime(overview.worker_last_seen_at)}</p>\n            )}\n          </div>'''
          assert source.count(old_warning) == 1, "worker warning markup changed"
          source = source.replace(old_warning, new_warning, 1)

          assert "legacyRuleKeys" not in source
          assert "visibleProductRuleKeys" in source
          path.write_text(source, encoding="utf-8")

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend quality gate
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          TIA_API_URL: http://127.0.0.1:8000
        run: |
          npm run lint
          npx next typegen
          npm run typecheck
          npm run build

      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'frontend/src/app/(dashboard)/automations/page.tsx'
          git diff --cached --check
          git commit -m "fix: clarify automation runtime health in admin UI"
          git push origin HEAD:feat/core-product-hardening
