name: Apply reschedule appointment-resolution patch

on:
  push:
    branches:
      - fix/reschedule-appointment-resolution-v2

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[reschedule-appointment-resolution-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reschedule-appointment-resolution-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted patch
        run: python scripts/apply_reschedule_appointment_resolution_patch.py
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply_reschedule_appointment_resolution_patch.py
          rm .github/workflows/apply-reschedule-appointment-resolution.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ground existing appointment IDs in reschedule flow [reschedule-appointment-resolution-applied]"
          git push origin HEAD:fix/reschedule-appointment-resolution-v2
