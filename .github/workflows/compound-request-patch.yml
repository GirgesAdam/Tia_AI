name: Compound request patch

on:
  push:
    branches:
      - feat/compound-customer-requests
    paths:
      - backend/scripts/apply_compound_customer_requests_patch.py
      - .github/workflows/compound-request-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compound-customer-requests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scoped patch
        run: python backend/scripts/apply_compound_customer_requests_patch.py
      - name: Syntax check
        run: python -m compileall -q backend/app/agents/turn_interpreter.py backend/app/services/agent_chat.py backend/app/services/compound_customer_requests.py backend/app/agents/turn_models.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/agents/turn_interpreter.py backend/app/services/agent_chat.py
          if git diff --cached --quiet; then
            echo "No product changes to commit"
          else
            git commit -m "feat(agent): support compound booking and package requests"
            git push origin HEAD:feat/compound-customer-requests
          fi
