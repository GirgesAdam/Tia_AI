name: WhatsApp safety patch

on:
  push:
    branches: [feat/clinic-ops-ux-cleanup]
    paths: [.github/workflows/whatsapp-safety-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clinic-ops-ux-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused WhatsApp safety hardening
        run: python .github/scripts/apply_whatsapp_safety_patch.py
      - name: Commit product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend n8n
          git diff --cached --check
          git commit -m "Harden WhatsApp opt-in and provider failure handling"
          git push origin HEAD:feat/clinic-ops-ux-cleanup
