name: Diagnose CI
on:
  pull_request:
    paths:
      - .github/workflows/diagnose-ci.yml
permissions:
  contents: read
jobs:
  diagnose:
    if: github.head_ref == 'feat/clinic-ops-ux-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend lint log
        working-directory: frontend
        run: |
          npm ci >/dev/null 2>&1
          npm run lint > ../frontend-lint.log 2>&1 || true
      - name: Backend pytest log
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
          MIGRATION_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          SUPABASE_SECRET_KEY: sb_secret_ci_dummy
          ENVIRONMENT: test
          DEBUG: "false"
          DOCS_ENABLED: "false"
        run: |
          python -m pip install --upgrade pip >/dev/null 2>&1
          pip install -r requirements.txt >/dev/null 2>&1
          python -m pytest -q > ../backend-pytest.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            frontend-lint.log
            backend-pytest.log
          retention-days: 1
