name: No-show cancellation recovery once

on:
  push:
    branches: [feat/core-product-hardening]
    paths:
      - .github/workflows/no-show-cancellation-once.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/core-product-hardening
          fetch-depth: 0

      - name: Apply no-show simplification
        run: python .github/scripts/retire_no_show_followup.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend quality gate
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
          MIGRATION_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          SUPABASE_SECRET_KEY: sb_secret_ci_dummy
          ENVIRONMENT: test
          DEBUG: "false"
          DOCS_ENABLED: "false"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ruff check app tests alembic
          python -m compileall -q app alembic tests
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend quality gate
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          TIA_API_URL: http://127.0.0.1:8000
        run: |
          npm ci
          npm run lint
          npx next typegen
          npm run typecheck
          npm run build

      - name: Commit tested no-show simplification
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/core/automation_rules.py backend/app/services/automations.py backend/tests 'frontend/src/app/(dashboard)/automations/page.tsx'
          git diff --cached --check
          git commit -m "fix: treat no-show as cancellation recovery"
          git push origin HEAD:feat/core-product-hardening

# temporary gate rerun
