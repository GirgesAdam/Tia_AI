name: Verify Compact Semantic Prompt

on:
  push:
    branches:
      - test/realistic-system-journeys-v1
    paths:
      - .github/workflows/optimize-semantic-prompt-only.yml

permissions:
  contents: write

concurrency:
  group: verify-compact-semantic-prompt
  cancel-in-progress: true

env:
  ENVIRONMENT: staging
  DEBUG: "false"
  DOCS_ENABLED: "false"
  DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_prompt_unused
  SUPABASE_SECRET_KEY: sb_secret_prompt_unused
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  LLM_PROVIDER: openai
  OPENAI_MODEL: gpt-5.6-luna
  OPENAI_FALLBACK_MODEL: gpt-5-mini
  OPENAI_REASONING_EFFORT: low
  OPENAI_FALLBACK_REASONING_EFFORT: low
  LLM_TIMEOUT_SECONDS: "60"
  LLM_MAX_RETRIES: "2"
  LLM_REALTIME_MAX_RETRIES: "0"
  AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
  CORS_ORIGINS: ""

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/realistic-system-journeys-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compact semantic prompt conservatively
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/agents/turn_interpreter.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def _interpreter_system_prompt(')
          end = text.index('\ndef _snapshot_has_exact_time', start)
          replacement = '''def _interpreter_system_prompt(\n    *,\n    timezone_name: str,\n    local_now: datetime,\n    active_flow: bool,\n) -> str:\n    return f\"\"\"You are Tia's single semantic turn interpreter for an aesthetic clinic. Return only the structured schema. Never answer the customer, expose implementation tool names, or authorize writes. Python and the canonical clinic data remain execution authorities.\n\nAUTHORITY AND CAPABILITY MAP\nInterpret the latest customer turn; recent conversation is only for references/corrections and persisted workflow state is operational memory, not permission to repeat old intents. Use the smallest capability set required. Map meaning explicitly: service details/existence/duration -> service_information; price -> pricing; which doctor/doctor information -> doctor_discovery; clinic address/phone/hours -> clinic_information; availability/when can I come -> availability_discovery; a clear request to create a booking -> appointment_creation; upcoming appointments -> appointment_list; current-customer profile -> customer_profile; past visits/services/payments or payment status -> customer_history; package details/remaining sessions -> package_information; buying/starting a package -> package_purchase; package cancellation refund amount -> package_refund_quote; reminder/future follow-up -> follow_up_request; marketing consent -> marketing_preferences; explicit human request -> human_support. Combine capabilities when one turn clearly asks for several of these. Do not turn an information question into a write capability.\n\nFLOW AND VERIFIED REFERENCES\nFor an active flow: continue keeps requirements; modify changes them; select_option chooses a presented option; cancel_flow stops the flow; interrupt transfers ownership. Greetings, acknowledgements, language changes, recall questions, and a harmless side read must not mutate the flow. A verified service/doctor option set remains a valid reference target across one harmless side read or factual answer; an intervening factual answer is not a new option list. Resolve short positional/pronominal follow-ups from that verified set only, and preserve ambiguity when several options still fit. For numbered choices set selection_index.\n\nTIME, AVAILABILITY, AND BOOKING FOLLOW-UPS\nResolve relative dates/times from the clinic clock. Exact appointment starts use requested_start_time; search constraints use not_before_time/not_after_time. When availability is presented and the customer responds, distinguish semantically between selecting an appointment start and changing the availability search. If the assistant's immediately preceding question asks which verified time to book and the customer chooses one specific start, including by referring to the start or beginning of a presented period, use action=select_option, selection_time=HH:MM, and include appointment_creation; the customer does not need to repeat the word 'book'. Use not_before_time/not_after_time only when the customer actually wants to search, filter, or constrain availability, not when choosing the appointment itself. Never infer a time that cannot resolve against the verified presented options. If a previously rejected exact time is broadened/replaced, clear requested_start_time and any stale opposite bounds. Never silently round an exact minute. If the same exact time belongs to multiple presented doctors, preserve doctor ambiguity. If the customer rejects a presented date/time and asks for another day, action=modify, preserve relevant service/doctor/time requirements, clear the rejected requested_date as needed, and refresh discovery rather than selecting the old offer.\n\nFRESH BOOKING AND RESCHEDULE\nA fresh explicit booking with sufficient grounded details may include availability_discovery + appointment_creation; Python still verifies exact availability before writing. A question about whether a time is possible is exploratory and not write authorization. FRESH RESCHEDULE AUTHORIZATION: when a fresh turn clearly commands changing one existing appointment now and supplies an exact replacement date/time, use appointment_reschedule, flow_signal=start_reschedule, action=modify, capture requested_date/requested_start_time, and do not require a second confirmation; Python verifies the target before writing. For a presented replacement availability window, choosing a replacement start uses action=select_option + selection_time + appointment_reschedule. If the customer instead says when the replacement search should begin/end or supplies a broader bound, use action=modify + not_before_time/not_after_time. Existing appointment service/device edits are appointment_reschedule even if date/time stays the same. Resolve the existing appointment from current-patient appointments, never from replacement target fields. If the old doctor was not reaffirmed and is incompatible with a newly selected service, clear the old doctor requirement.\n\nCOMPOUND REQUESTS\nWhen the latest turn clearly asks for 2+ independently executable appointment/package operations, emit requested_items in customer order (max 6), one operation per item. Each item owns its own service, doctor, device, date/time, and package intent. Do not create requested_items for alternatives, comparisons, uncertain matching, or one operation with multiple candidates. Package purchase plus its first appointment emits package_purchase first and appointment second with package_intent=use_existing. A direct clarification to the immediately preceding assistant question about a missing compound field reconstructs the same requested_items and changes only that field. Python grounds and sequences the items deterministically. Never collapse two explicitly requested services into ambiguity.\n\nPACKAGES\nUse package_intent=none for an ordinary appointment, inquire for package information/comparison, purchase when obtaining/starting a package, use_existing when this appointment should consume an existing package, and avoid_existing when the customer explicitly wants a normal paid appointment instead. For purchase, capture package_sessions_count only for an explicitly chosen configured 3/6/9 tier and laser_device_key only for an explicitly chosen configured device. Package purchase/inquiry is not a booking unless a specific appointment is separately requested. An existing package for one service must not affect a different service. A pure package cancellation refund amount question is package_refund_quote and read-only. Operational package/price/booking guidance is not medical unless the customer asks for clinical judgment.\n\nAPPOINTMENTS, CUSTOMER DATA, AND SUPPORT\nCancellation: include appointment_cancellation for a cancellation request or direct clarification to the preceding question about which appointment; select appointment_id only from supplied current-patient appointments when context identifies exactly one, otherwise keep ambiguity. Confirmation uses appointment_confirmation only to change a pending appointment to confirmed; asking whether existing details are correct is read-only. Past visits/services/payments and simple paid/how-paid/amount-paid questions for the current customer use customer_history and do not set payment risk by themselves. Payment disputes, corrections, failed-payment problems, or financial-record changes may use payment risk/handoff. Remaining package sessions use package_information. Medical suitability, diagnosis, contraindications, symptoms, adverse effects, or health-based treatment recommendations set medical risk/handoff; a catalog medical-review flag alone does not make an operational request medical. Explicit requests for a human use human_support.\n\nSINGLE LOCATION AND GROUNDING\nThis is a single-location customer experience: never emit branch_discovery or branch_query/branch_id/branch_candidate_ids. Resolve services, doctors, devices, and existing appointments only from the supplied canonical catalog. Respect doctor.service_ids compatibility. Emit one canonical ID only when one record is clearly intended; otherwise emit plausible candidates and preserve ambiguity. Never invent IDs. requested_date must be resolved YYYY-MM-DD when clear. Resolve colloquial clock hours using plausible clinic hours unless AM/PM or another explicit meaning is given. When the latest turn replaces a service/doctor/time constraint in an active flow, action=modify and the latest meaning owns that requirement; clear stale incompatible persisted fields. A new service must refresh availability rather than reuse the previous service's snapshot. If a doctor set from the preceding exchange is referenced collectively for earliest availability, inherit the unambiguous service, use availability_discovery, and leave doctor fields unselected so the adapter compares compatible doctors.\n\nClinic timezone: {timezone_name}. Clinic local date/time: {local_now.isoformat()}. Active workflow present: {str(active_flow).lower()}\"\"\"\n\n'''
          path.write_text(text[:start] + replacement + text[end + 1:], encoding='utf-8')
          PY

      - name: Commit candidate locally
        run: |
          git config user.name "Tia CI"
          git config user.email "tia-ci@users.noreply.github.com"
          git add app/agents/turn_interpreter.py
          git commit -m "Trim duplicate semantic prompt guidance"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Deterministic prompt regression
        run: |
          python -m pytest \
            tests/test_unified_turn_interpreter.py \
            tests/test_contextual_time_followups.py \
            tests/test_contextual_followup_regressions.py \
            tests/test_single_location_agent_semantics.py \
            tests/test_clinic_grounding_compatibility.py \
            tests/test_compound_customer_requests.py \
            -q -k 'not live'
          python -m compileall -q app/agents/turn_interpreter.py

      - name: Audit prompt size and required semantics
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from datetime import datetime
          from app.agents.turn_interpreter import _interpreter_system_prompt
          prompt = _interpreter_system_prompt(
              timezone_name='Africa/Cairo',
              local_now=datetime.fromisoformat('2026-09-11T02:00:00+03:00'),
              active_flow=False,
          )
          required = [
              'distinguish semantically between selecting an appointment start and changing the availability search',
              'including by referring to the start or beginning of a presented period',
              "assistant's immediately preceding question",
              "the customer does not need to repeat the word 'book'",
              'Use not_before_time/not_after_time only when the customer actually wants to search',
              'Never infer a time that cannot resolve against the verified presented options',
              'verified service/doctor option set',
              'harmless side read',
              'intervening factual answer is not a new option list',
              'presented replacement availability window',
              'replacement search should begin/end',
              'same exact time belongs to multiple presented doctors',
              'service details/existence/duration -> service_information',
              'price -> pricing',
              'which doctor/doctor information -> doctor_discovery',
          ]
          missing = [item for item in required if item not in prompt]
          audit = {
              'old_prompt_chars': 15023,
              'new_prompt_chars': len(prompt),
              'char_reduction': 15023 - len(prompt),
              'reduction_percent': round((15023 - len(prompt)) * 100 / 15023, 1),
              'missing_required_phrases': missing,
          }
          print(json.dumps(audit, ensure_ascii=False, indent=2))
          assert not missing, missing
          assert len(prompt) < 10500, len(prompt)
          with open('artifacts/prompt-audit.json', 'w', encoding='utf-8') as handle:
              json.dump(audit, handle, ensure_ascii=False, indent=2)
          PY

      - name: Run three new semantic smoke cases
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from langchain_core.messages import HumanMessage
          from sqlalchemy import create_engine, select
          from sqlalchemy.orm import Session
          from app.agents.clinic_grounding import build_clinic_catalog
          from app.agents.turn_interpreter import interpret_customer_turn
          from app.core.config import settings
          from app.models.workspace import Workspace
          from scripts.run_realistic_system_journeys import TokenMeter

          engine = create_engine(settings.database_url)
          with Session(engine) as db:
              workspace = db.scalar(select(Workspace).where(Workspace.slug == 'tia'))
              assert workspace is not None
              catalog = build_clinic_catalog(db, workspace)

          services = [row for row in catalog.get('services', []) if isinstance(row, dict)]
          prp = next(row for row in services if row.get('name') == 'PRP للبشرة')
          botox = next(row for row in services if row.get('name') == 'بوتوكس')
          underarm = next(row for row in services if row.get('name') == 'ليزر إزالة الشعر - إبط')

          cases = [
              {
                  'name': 'new_prp_price_duration',
                  'message': 'جلسة PRP للبشرة سعرها كام وبتاخد وقت قد إيه؟',
                  'service': str(prp['id']),
                  'caps': {'pricing', 'service_information'},
              },
              {
                  'name': 'new_botox_doctors',
                  'message': 'مين الدكاترة اللي بيعملوا بوتوكس عندكم؟',
                  'service': str(botox['id']),
                  'caps': {'doctor_discovery'},
              },
              {
                  'name': 'new_package_purchase_semantics',
                  'message': 'عايز أشتري باكيدج 6 جلسات ليزر إبط على جهاز Prime Lase',
                  'service': str(underarm['id']),
                  'caps': {'package_purchase'},
                  'sessions': 6,
                  'device': 'prime_lase',
              },
          ]

          meter = TokenMeter()
          meter.install()
          rows = []
          error = None
          try:
              for case in cases:
                  mark = meter.mark()
                  decision = interpret_customer_turn(
                      flow=None,
                      history=[HumanMessage(content=case['message'])],
                      timezone_name='Africa/Cairo',
                      local_now=datetime.fromisoformat('2026-09-11T02:00:00+03:00'),
                      clinic_catalog=catalog,
                  )
                  usage = meter.since(mark)
                  row = {
                      'name': case['name'],
                      'message': case['message'],
                      'capabilities': list(decision.capabilities),
                      'package_intent': decision.package_intent,
                      'service_id': decision.entity_hints.service_id,
                      'package_sessions_count': decision.entity_hints.package_sessions_count,
                      'laser_device_key': decision.entity_hints.laser_device_key,
                      'tokens': usage,
                  }
                  rows.append(row)
                  print(json.dumps(row, ensure_ascii=False, indent=2))
                  assert decision.entity_hints.service_id == case['service'], decision.entity_hints
                  assert case['caps'].issubset(set(decision.capabilities)), decision.capabilities
                  if 'sessions' in case:
                      assert decision.package_intent == 'purchase', decision
                      assert decision.entity_hints.package_sessions_count == case['sessions'], decision.entity_hints
                      assert decision.entity_hints.laser_device_key == case['device'], decision.entity_hints
          except Exception as exc:
              error = repr(exc)
              raise
          finally:
              meter.uninstall()
              report = {
                  'cases': rows,
                  'total_input_tokens': sum(row['tokens']['input_tokens'] for row in rows),
                  'average_input_tokens': round(sum(row['tokens']['input_tokens'] for row in rows) / max(1, len(rows)), 1),
                  'error': error,
              }
              with open('artifacts/compact-semantic-prompt.json', 'w', encoding='utf-8') as handle:
                  json.dump(report, handle, ensure_ascii=False, indent=2)
          PY

      - name: Push verified prompt candidate
        run: git push origin HEAD:test/realistic-system-journeys-v1

      - name: Upload prompt audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-semantic-prompt
          path: |
            backend/artifacts/prompt-audit.json
            backend/artifacts/compact-semantic-prompt.json
          if-no-files-found: warn
          retention-days: 7
