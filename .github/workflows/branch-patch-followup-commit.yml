name: Commit follow-up pool patch
on:
  pull_request:
    paths:
      - .github/workflows/branch-patch-followup-commit.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'feat/clinic-ops-ux-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('backend/app/services/automations.py')
          text = path.read_text(encoding='utf-8')
          if 'def _ai_followup_template_candidates(' not in text:
              helper = '''def _ai_followup_template_candidates(connection: ChannelConnection) -> list[tuple[str, str]]:
              config = connection.config_json or {}
              candidates: list[tuple[str, str]] = []
              raw_pool = config.get("ai_followup_templates")
              if isinstance(raw_pool, list):
                  for raw in raw_pool:
                      if not isinstance(raw, dict):
                          continue
                      name = str(raw.get("name") or "").strip()
                      language = str(raw.get("language_code") or "ar").strip() or "ar"
                      candidate = (name[:512], language[:32])
                      if name and candidate not in candidates:
                          candidates.append(candidate)
              legacy = config.get("ai_followup_template")
              if isinstance(legacy, dict):
                  name = str(legacy.get("name") or "").strip()
                  language = str(legacy.get("language_code") or "ar").strip() or "ar"
                  candidate = (name[:512], language[:32])
                  if name and candidate not in candidates:
                      candidates.append(candidate)
              return candidates


          def _latest_ai_followup_template_name(
              db: Session, *, workspace_id: UUID, conversation_id: UUID
          ) -> str | None:
              messages = db.scalars(
                  select(Message)
                  .where(
                      Message.workspace_id == workspace_id,
                      Message.conversation_id == conversation_id,
                      Message.direction == "outbound",
                      Message.message_type == "template",
                  )
                  .order_by(Message.created_at.desc())
                  .limit(10)
              )
              for message in messages:
                  metadata = message.metadata_json or {}
                  if metadata.get("source") != "ai_followup":
                      continue
                  raw = metadata.get("whatsapp_template")
                  if isinstance(raw, dict):
                      name = str(raw.get("name") or "").strip()
                      if name:
                          return name
              return None


          def _select_ai_followup_template(
              connection: ChannelConnection,
              *,
              task_id: UUID,
              patient_id: UUID,
              previous_template: str | None = None,
          ) -> tuple[str, str] | None:
              candidates = _ai_followup_template_candidates(connection)
              if not candidates:
                  return None
              digest = hashlib.sha256(f"{patient_id}:{task_id}".encode()).digest()
              index = int.from_bytes(digest[:8], "big") % len(candidates)
              if len(candidates) > 1 and previous_template and candidates[index][0] == previous_template:
                  index = (index + 1) % len(candidates)
              return candidates[index]
          '''
              helper = '\n'.join(line[14:] if line.startswith('              ') else line for line in helper.splitlines())
              pattern = re.compile(r'def _ai_followup_template_config\(connection: ChannelConnection\) -> tuple\[str, str\] \| None:\n.*?\n\ndef _dispatch_ai_followup_template\(', re.S)
              text, count = pattern.subn(helper + '\n\ndef _dispatch_ai_followup_template(', text, count=1)
              if count != 1:
                  raise SystemExit(f'helper replacement count={count}')
              call = re.compile(r'(?P<i>\s*)template = _ai_followup_template_config\(connection\)\n(?P=i)if template is None:')
              def repl(m):
                  i = m.group('i')
                  return f'''{i}previous_template = _latest_ai_followup_template_name(\n{i}    db, workspace_id=workspace_id, conversation_id=conversation.id\n{i})\n{i}template = _select_ai_followup_template(\n{i}    connection,\n{i}    task_id=task.id,\n{i}    patient_id=patient.id,\n{i}    previous_template=previous_template,\n{i})\n{i}if template is None:'''
              text, count = call.subn(repl, text, count=1)
              if count != 1:
                  raise SystemExit(f'call replacement count={count}')
              path.write_text(text, encoding='utf-8')

          test = Path('backend/tests/test_ai_followup_template_pool.py')
          test.write_text('''from types import SimpleNamespace\nfrom uuid import UUID\n\nfrom app.services.automations import _ai_followup_template_candidates, _select_ai_followup_template\n\nTASK = UUID("38d2d461-73ce-4fab-87e6-c7cf25fefe56")\nPATIENT = UUID("9cac0792-37aa-4e4c-864f-c29ebc51d96e")\n\ndef conn(config: dict):\n    return SimpleNamespace(config_json=config)\n\ndef test_followup_pool_legacy_compatibility():\n    row = conn({"ai_followup_template": {"name": "legacy_ar", "language_code": "ar"}})\n    assert _ai_followup_template_candidates(row) == [("legacy_ar", "ar")]\n\ndef test_followup_pool_deterministic_and_deduplicated():\n    row = conn({"ai_followup_templates": [{"name": "one", "language_code": "ar"}, {"name": "two", "language_code": "ar"}, {"name": "one", "language_code": "ar"}]})\n    assert _ai_followup_template_candidates(row) == [("one", "ar"), ("two", "ar")]\n    assert _select_ai_followup_template(row, task_id=TASK, patient_id=PATIENT) == _select_ai_followup_template(row, task_id=TASK, patient_id=PATIENT)\n\ndef test_followup_pool_avoids_immediate_repeat():\n    row = conn({"ai_followup_templates": [{"name": "one", "language_code": "ar"}, {"name": "two", "language_code": "ar"}]})\n    first = _select_ai_followup_template(row, task_id=TASK, patient_id=PATIENT)\n    assert first is not None\n    second = _select_ai_followup_template(row, task_id=TASK, patient_id=PATIENT, previous_template=first[0])\n    assert second is not None and second[0] != first[0]\n''', encoding='utf-8')
          PY
          git add backend/app/services/automations.py backend/tests/test_ai_followup_template_pool.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add deterministic WhatsApp follow-up template pool'
          git push origin HEAD:${{ github.head_ref }}
