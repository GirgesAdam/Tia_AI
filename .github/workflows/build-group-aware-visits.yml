name: Build Group-Aware Visits

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-group-aware-visits.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
  MIGRATION_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
  SUPABASE_URL: https://example.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
  SUPABASE_SECRET_KEY: sb_secret_ci_dummy
  ENVIRONMENT: test
  DEBUG: "false"
  DOCS_ENABLED: "false"

jobs:
  patch-test-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Apply deterministic patch
        run: |
          python .github/implementation/group_aware_visit_patch.py
          python .github/implementation/fix_group_aware_write_indent.py
          git diff --check
          git status --short

      - name: Ruff
        working-directory: backend
        run: ruff check app tests alembic

      - name: Compile
        working-directory: backend
        run: python -m compileall -q app alembic tests

      - name: Focused grouped-visit tests
        working-directory: backend
        run: python -m pytest -q tests/test_v2_grouped_visits.py tests/test_agent_v2_orchestrator.py

      - name: Full backend suite
        working-directory: backend
        run: python -m pytest -q

      - name: Commit fully verified runtime patch
        run: |
          rm -f .github/workflows/build-group-aware-visits.yml
          rm -f .github/implementation/group_aware_visit_patch.py
          rm -f .github/implementation/fix_group_aware_write_indent.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make grouped visits cancel reschedule and read coherently"
          git push origin HEAD:main
