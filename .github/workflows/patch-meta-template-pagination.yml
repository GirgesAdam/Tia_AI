name: Patch Meta Template Pagination
on:
  push:
    branches: [feat/clinic-ops-ux-cleanup]
    paths: [.github/workflows/patch-meta-template-pagination.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clinic-ops-ux-cleanup
      - name: Patch template pagination
        run: |
          python - <<'PY'
          from pathlib import Path

          transport_path = Path('backend/app/services/meta_whatsapp_transport.py')
          text = transport_path.read_text(encoding='utf-8')
          text = text.replace(
              '_PENDING_PROVIDER_REFRESH_INTERVAL = timedelta(minutes=2)\n',
              '_PENDING_PROVIDER_REFRESH_INTERVAL = timedelta(minutes=2)\n_MAX_TEMPLATE_STATUS_PAGES = 20\n',
              1,
          )

          old = '''def _fetch_template_statuses(token: str, waba_id: str) -> dict[str, str]:\n    response = httpx.get(\n        _graph_url(f"{waba_id}/message_templates"),\n        params={"fields": "name,status,language", "limit": 100},\n        headers={"Authorization": f"Bearer {token}"},\n        timeout=20.0,\n    )\n    if response.status_code >= 400:\n        message, meta = _provider_error_payload(response)\n        raise MetaWhatsAppTransportError(\n            message,\n            code=_coerce_meta_error_code(meta.get("code")),\n        )\n    payload = response.json()\n    data = payload.get("data") if isinstance(payload, dict) else None\n    statuses: dict[str, str] = {}\n    for item in data if isinstance(data, list) else []:\n        if not isinstance(item, dict):\n            continue\n        name = str(item.get("name") or "").strip()\n        status = str(item.get("status") or "").strip().lower()\n        if name and status:\n            statuses[name] = status\n    return statuses\n'''
          new = '''def _fetch_template_statuses(token: str, waba_id: str) -> dict[str, str]:\n    endpoint = _graph_url(f"{waba_id}/message_templates")\n    headers = {"Authorization": f"Bearer {token}"}\n    statuses: dict[str, str] = {}\n    after: str | None = None\n    seen_cursors: set[str] = set()\n\n    for _ in range(_MAX_TEMPLATE_STATUS_PAGES):\n        params: dict[str, Any] = {\n            "fields": "name,status,language",\n            "limit": 100,\n        }\n        if after:\n            params["after"] = after\n\n        response = httpx.get(\n            endpoint,\n            params=params,\n            headers=headers,\n            timeout=20.0,\n        )\n        if response.status_code >= 400:\n            message, meta = _provider_error_payload(response)\n            raise MetaWhatsAppTransportError(\n                message,\n                code=_coerce_meta_error_code(meta.get("code")),\n            )\n\n        payload = response.json()\n        data = payload.get("data") if isinstance(payload, dict) else None\n        for item in data if isinstance(data, list) else []:\n            if not isinstance(item, dict):\n                continue\n            name = str(item.get("name") or "").strip()\n            status = str(item.get("status") or "").strip().lower()\n            if name and status:\n                statuses[name] = status\n\n        paging = payload.get("paging") if isinstance(payload, dict) else None\n        cursors = paging.get("cursors") if isinstance(paging, dict) else None\n        next_after = (\n            str(cursors.get("after") or "").strip()\n            if isinstance(cursors, dict)\n            else ""\n        )\n        if not next_after or next_after in seen_cursors:\n            break\n        seen_cursors.add(next_after)\n        after = next_after\n\n    return statuses\n'''
          if old not in text:
              raise SystemExit('template status function marker not found')
          text = text.replace(old, new, 1)
          transport_path.write_text(text, encoding='utf-8')

          test_path = Path('backend/tests/test_meta_native_whatsapp_transport.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              '    _readiness_refresh_due,\n',
              '    _fetch_template_statuses,\n    _readiness_refresh_due,\n',
              1,
          )
          anchor = '''def test_native_transport_builds_text_message() -> None:\n'''
          addition = '''def test_template_status_fetch_reads_all_meta_pages(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    calls: list[dict] = []\n    monkeypatch.setattr(meta_whatsapp_settings, "meta_graph_api_version", "v23.0")\n\n    class FakeResponse:\n        status_code = 200\n\n        def __init__(self, payload: dict) -> None:\n            self._payload = payload\n\n        def json(self) -> dict:\n            return self._payload\n\n    pages = [\n        {\n            "data": [{"name": "first_template", "status": "APPROVED", "language": "ar"}],\n            "paging": {"cursors": {"after": "cursor-2"}},\n        },\n        {\n            "data": [{"name": "tia_reminder_01", "status": "APPROVED", "language": "ar"}],\n        },\n    ]\n\n    def fake_get(_url: str, *, params: dict, headers: dict, timeout: float):\n        calls.append({"params": dict(params), "headers": dict(headers), "timeout": timeout})\n        return FakeResponse(pages[len(calls) - 1])\n\n    monkeypatch.setattr(meta_transport.httpx, "get", fake_get)\n\n    statuses = _fetch_template_statuses("secret-token", "waba-1")\n\n    assert statuses == {\n        "first_template": "approved",\n        "tia_reminder_01": "approved",\n    }\n    assert len(calls) == 2\n    assert "after" not in calls[0]["params"]\n    assert calls[1]["params"]["after"] == "cursor-2"\n    assert calls[0]["headers"]["Authorization"] == "Bearer secret-token"\n\n\ndef test_template_status_fetch_stops_on_repeated_cursor(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    calls = 0\n    monkeypatch.setattr(meta_whatsapp_settings, "meta_graph_api_version", "v23.0")\n\n    class FakeResponse:\n        status_code = 200\n\n        def json(self) -> dict:\n            return {\n                "data": [],\n                "paging": {"cursors": {"after": "same-cursor"}},\n            }\n\n    def fake_get(_url: str, **_kwargs):\n        nonlocal calls\n        calls += 1\n        return FakeResponse()\n\n    monkeypatch.setattr(meta_transport.httpx, "get", fake_get)\n\n    assert _fetch_template_statuses("token", "waba") == {}\n    assert calls == 2\n\n\n'''
          if anchor not in tests:
              raise SystemExit('native transport test anchor not found')
          tests = tests.replace(anchor, addition + anchor, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Validate pagination
        working-directory: backend
        run: |
          python -m pip install --upgrade pip >/dev/null
          pip install -r requirements.txt >/dev/null
          ruff check app/services/meta_whatsapp_transport.py tests/test_meta_native_whatsapp_transport.py
          python -m compileall -q app/services/meta_whatsapp_transport.py tests/test_meta_native_whatsapp_transport.py
          python -m pytest -q tests/test_meta_native_whatsapp_transport.py tests/test_whatsapp_template_dispatch_gating.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/meta_whatsapp_transport.py backend/tests/test_meta_native_whatsapp_transport.py
          git commit -m "fix: paginate Meta template readiness checks"
          git push origin HEAD:feat/clinic-ops-ux-cleanup
