name: Repair WhatsApp test schemas

on:
  pull_request:
    paths:
      - .github/workflows/fix-whatsapp-test-schemas.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Update stale SQLite patient schemas
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r"CREATE TABLE patients \((?P<body>.*?)\n\s*\)", re.DOTALL)
          marker = "marketing_consent_at DATETIME"
          changed = []

          for path in sorted(Path("backend/tests").glob("test_*.py")):
              text = path.read_text(encoding="utf-8")

              def repair(match: re.Match[str]) -> str:
                  block = match.group(0)
                  if "whatsapp_opt_in" in block or marker not in block:
                      return block
                  replacement = (
                      marker
                      + ", whatsapp_opt_in BOOLEAN DEFAULT 0,\n"
                      + "            whatsapp_opt_in_at DATETIME, whatsapp_opt_in_source VARCHAR(32)"
                  )
                  return block.replace(marker, replacement, 1)

              updated = pattern.sub(repair, text)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          profile_path = Path("backend/tests/test_patient_timeline_crm.py")
          profile_text = profile_path.read_text(encoding="utf-8")
          old = "            marketing_consent_at=None,\n            last_contact_at=now,"
          new = (
              "            marketing_consent_at=None,\n"
              "            whatsapp_opt_in=False,\n"
              "            whatsapp_opt_in_at=None,\n"
              "            whatsapp_opt_in_source=None,\n"
              "            last_contact_at=now,"
          )
          if old in profile_text:
              profile_path.write_text(profile_text.replace(old, new, 1), encoding="utf-8")
              changed.append(str(profile_path))

          print("Updated files:")
          for item in changed:
              print(f"- {item}")
          if not changed:
              raise SystemExit("No stale schemas found; refusing empty repair commit")
          PY
      - name: Run focused regression tests
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_cohort_campaign_messaging_phase69.py
          tests/test_connector_runtime_phase63.py
          tests/test_external_sync_engine_phase62c.py
          tests/test_external_appointment_sync_phase62e.py
          tests/test_historical_data_ai_retrieval_phase66.py
          tests/test_patient_timeline_crm.py
          tests/test_staff_analytics_bi_phase67.py
          tests/test_sync_authority_observability_phase62d.py
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-whatsapp-test-schemas.yml
          git add backend/tests
          git commit -m "test: sync patient SQLite schemas with WhatsApp fields"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
