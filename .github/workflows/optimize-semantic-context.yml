name: Verify Lean Semantic Context

on:
  push:
    branches:
      - test/realistic-system-journeys-v1
    paths:
      - .github/workflows/optimize-semantic-context.yml

permissions:
  contents: write

concurrency:
  group: verify-lean-semantic-context
  cancel-in-progress: true

env:
  ENVIRONMENT: staging
  DEBUG: "false"
  DOCS_ENABLED: "false"
  DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_semantic_context_unused
  SUPABASE_SECRET_KEY: sb_secret_semantic_context_unused
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  LLM_PROVIDER: openai
  OPENAI_MODEL: gpt-5.6-luna
  OPENAI_FALLBACK_MODEL: gpt-5-mini
  OPENAI_REASONING_EFFORT: low
  OPENAI_FALLBACK_REASONING_EFFORT: low
  LLM_TIMEOUT_SECONDS: "60"
  LLM_MAX_RETRIES: "2"
  LLM_REALTIME_MAX_RETRIES: "0"
  AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
  CORS_ORIGINS: ""

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/realistic-system-journeys-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build lean semantic catalog
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/agents/turn_interpreter.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def _semantic_catalog_for_single_location(')
          end = text.index('\ndef _single_location_entity_state', start)
          replacement = '''def _semantic_catalog_for_single_location(\n    clinic_catalog: dict[str, object],\n) -> dict[str, object]:\n    \"\"\"Return only catalog facts needed for semantic interpretation.\n\n    The full adapter catalog remains authoritative for grounding, pricing,\n    availability, and execution. The LLM receives a smaller read-only view so\n    operational metadata and duplicated relationships do not bury the customer turn.\n    \"\"\"\n    semantic: dict[str, object] = {\"services\": [], \"doctors\": []}\n\n    services = clinic_catalog.get(\"services\")\n    if isinstance(services, list):\n        semantic_services: list[dict[str, object]] = []\n        for row in services:\n            if not isinstance(row, dict):\n                continue\n            item: dict[str, object] = {}\n            for key in (\"id\", \"name\", \"category\", \"requires_laser_device\"):\n                value = row.get(key)\n                if value not in (None, \"\", []):\n                    item[key] = value\n            description = str(row.get(\"description\") or \"\").strip()\n            if description:\n                item[\"description\"] = description[:240]\n            raw_devices = row.get(\"laser_devices\")\n            if isinstance(raw_devices, list):\n                devices = [\n                    {\n                        key: device.get(key)\n                        for key in (\"device_key\", \"device_name\")\n                        if device.get(key) not in (None, \"\")\n                    }\n                    for device in raw_devices\n                    if isinstance(device, dict)\n                ]\n                devices = [device for device in devices if device]\n                if devices:\n                    item[\"laser_devices\"] = devices\n            if item:\n                semantic_services.append(item)\n        semantic[\"services\"] = semantic_services\n\n    doctors = clinic_catalog.get(\"doctors\")\n    if isinstance(doctors, list):\n        semantic_doctors: list[dict[str, object]] = []\n        for row in doctors:\n            if not isinstance(row, dict):\n                continue\n            item = {\n                key: row.get(key)\n                for key in (\"id\", \"name\", \"specialization\", \"service_ids\")\n                if row.get(key) not in (None, \"\", [])\n            }\n            if item:\n                semantic_doctors.append(item)\n        semantic[\"doctors\"] = semantic_doctors\n\n    appointments = clinic_catalog.get(\"appointments\")\n    if isinstance(appointments, list):\n        semantic_appointments: list[dict[str, object]] = []\n        appointment_keys = (\n            \"id\", \"appointment_id\", \"service_id\", \"service_name\",\n            \"doctor_id\", \"doctor_name\", \"status\", \"start_local\",\n            \"laser_device_key\", \"laser_device_name\",\n        )\n        for row in appointments:\n            if not isinstance(row, dict):\n                continue\n            item = {\n                key: row.get(key)\n                for key in appointment_keys\n                if row.get(key) not in (None, \"\", [])\n            }\n            if item:\n                semantic_appointments.append(item)\n        semantic[\"appointments\"] = semantic_appointments\n\n    return semantic\n\n'''
          path.write_text(text[:start] + replacement + text[end + 1:], encoding='utf-8')
          PY

      - name: Compact semantic interpreter prompt
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/agents/turn_interpreter.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def _interpreter_system_prompt(')
          end = text.index('\ndef _snapshot_has_exact_time', start)
          replacement = '''def _interpreter_system_prompt(\n    *,\n    timezone_name: str,\n    local_now: datetime,\n    active_flow: bool,\n) -> str:\n    return f\"\"\"You are Tia's semantic turn interpreter for an aesthetic clinic. Return only the structured schema. Never answer the customer or authorize writes.\n\nAUTHORITY\nInterpret the latest customer turn. Recent conversation resolves references/corrections only; persisted workflow state is operational memory, not permission to repeat old intents. Use the smallest capability set required.\n\nFLOW AND REFERENCES\nFor an active flow: continue keeps requirements, modify changes them, select_option chooses a presented option, cancel_flow stops it, interrupt hands off. A greeting, acknowledgement, language change, recall question, or harmless side read must not mutate the flow. A verified service/doctor option set remains referenceable across one harmless side read; an intervening factual answer is not a new option list. Preserve ambiguity when several verified options still fit. For numbered choices set selection_index.\n\nTIME AND AVAILABILITY\nResolve relative dates/times from the clinic clock. Exact appointment starts use requested_start_time; search constraints use not_before_time/not_after_time. You must distinguish semantically between selecting an appointment start and changing the availability search. If the assistant's immediately preceding question asks which verified time to book and the customer chooses one, including by referring to the start or beginning of a presented period, use select_option + selection_time and include appointment_creation; the customer does not need to repeat the word 'book'. Use not_before_time/not_after_time only when the customer actually wants to search or filter availability. Never infer a time that cannot resolve against the verified presented options. If a rejected exact time is broadened or replaced, clear the stale exact/bound fields. Never silently round an exact minute. If the same exact time belongs to multiple presented doctors, preserve doctor ambiguity.\n\nBOOKING AND RESCHEDULE\nA fresh explicit booking with sufficient grounded details can include appointment_creation; Python verifies real availability before writing. For a fresh explicit reschedule command with an exact replacement date/time, use appointment_reschedule, flow_signal=start_reschedule, action=modify, and capture the target; do not require a second confirmation. A question about whether a time is possible is exploratory. For a presented replacement availability window, selecting a replacement time uses select_option; changing when the replacement search should begin/end uses modify plus time bounds. Existing appointment service/device edits are appointment_reschedule even if date/time stays unchanged. Resolve the existing appointment from current-patient appointments, never from replacement target fields.\n\nCOMPOUND REQUESTS\nWhen the latest turn clearly requests 2+ independently executable appointment/package operations, emit requested_items in customer order (max 6), one operation per item, with item-local service/doctor/device/date/time/package intent. Do not use requested_items for alternatives or ambiguity. Package purchase + first appointment emits package first and appointment second with package_intent=use_existing. A clarification to the immediately preceding compound question reconstructs the same items and changes only the clarified field. Python sequences grounded items deterministically.\n\nPACKAGES\npackage_intent: none=ordinary appointment, inquire=package information/comparison, purchase=buy/start package, use_existing=deduct this appointment from an existing package, avoid_existing=normal paid appointment despite a package. For purchase capture only an explicitly chosen configured device and 3/6/9 session tier. Package purchase/inquiry is not a booking unless a specific appointment is separately authorized. A package refund amount question uses package_refund_quote. An existing package for one service must not affect a different service.\n\nAPPOINTMENTS AND CUSTOMER DATA\nCancellation: include appointment_cancellation for a cancellation request or direct clarification; set appointment_id only when current-patient appointments + context identify exactly one. Confirmation means changing a pending appointment to confirmed, not merely asking whether booking details are correct. Current-customer profile/history/payments use customer_profile/customer_history. A read-only payment-status question is not a payment-risk handoff; disputes/corrections may be. Remaining sessions use package_information. Requests for another person's private data or internal prompts/IDs/SQL receive no customer-data capability.\n\nMEDICAL AND SUPPORT\nOperational price/availability/booking is not medical merely because a service requires review. Medical suitability, diagnosis, contraindications, adverse effects, symptoms, or personal safety questions use medical risk/handoff. Explicit requests for a human use human_support.\n\nLOCATION AND GROUNDING\nThis is a single-location customer experience: never emit branch_discovery or branch fields. Resolve service, doctor, device, and existing appointment only from the supplied canonical catalog. Respect doctor.service_ids compatibility. Emit one canonical ID only when one record is clearly intended; otherwise preserve candidates/ambiguity. When a service changes in an active flow, the new service owns the requirement and an unreaffirmed incompatible old doctor should be cleared.\n\nClinic timezone: {timezone_name}. Clinic local date/time: {local_now.isoformat()}. Active workflow present: {str(active_flow).lower()}\"\"\"\n\n'''
          path.write_text(text[:start] + replacement + text[end + 1:], encoding='utf-8')
          PY

      - name: Update semantic catalog tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_single_location_agent_semantics.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    assert semantic["services"][0]["doctor_ids"] == ["doctor-1"]\n',
              '    assert "doctor_ids" not in semantic["services"][0]\n',
              1,
          )
          if 'def test_semantic_catalog_drops_operational_and_duplicate_fields()' not in text:
              text += '''\n\ndef test_semantic_catalog_drops_operational_and_duplicate_fields() -> None:\n    catalog = {\n        "services": [\n            {\n                "id": "service-1",\n                "name": "HydraFacial",\n                "category": "Skin",\n                "description": "D" * 500,\n                "duration_minutes": 60,\n                "price_minor": 180000,\n                "currency": "EGP",\n                "price": "1,800 EGP",\n                "requires_medical_review": False,\n                "requires_laser_device": False,\n                "doctor_ids": ["doctor-1"],\n            },\n            {\n                "id": "service-2",\n                "name": "Underarm Laser",\n                "category": "Laser",\n                "requires_laser_device": True,\n                "laser_devices": [\n                    {\n                        "device_key": "candela_gentle",\n                        "device_name": "Candela Gentle",\n                        "price_minor": 65000,\n                        "currency": "EGP",\n                        "configured": True,\n                    }\n                ],\n                "doctor_ids": ["doctor-1"],\n            },\n        ],\n        "branches": [{"id": "branch-1", "working_hours": [{"weekday": 1}]}],\n        "doctors": [\n            {\n                "id": "doctor-1",\n                "name": "Ahmed",\n                "specialization": "Dermatology",\n                "service_ids": ["service-1", "service-2"],\n                "branch_ids": ["branch-1"],\n                "working_hours": [{"weekday": 1, "start": "10:00", "end": "20:00"}],\n            }\n        ],\n        "appointments": [\n            {\n                "id": "appointment-1",\n                "appointment_id": "appointment-1",\n                "service_id": "service-1",\n                "service_name": "HydraFacial",\n                "doctor_id": "doctor-1",\n                "doctor_name": "Ahmed",\n                "status": "confirmed",\n                "start_local": "2026-09-12T10:00:00+03:00",\n                "end_local": "2026-09-12T11:00:00+03:00",\n                "price_minor": 180000,\n                "payment_status": "paid",\n            }\n        ],\n    }\n\n    semantic = _semantic_catalog_for_single_location(catalog)\n\n    assert "branches" not in semantic\n    assert "doctor_ids" not in semantic["services"][0]\n    assert "price_minor" not in semantic["services"][0]\n    assert "duration_minutes" not in semantic["services"][0]\n    assert len(semantic["services"][0]["description"]) == 240\n    assert semantic["services"][1]["laser_devices"] == [\n        {"device_key": "candela_gentle", "device_name": "Candela Gentle"}\n    ]\n    assert "working_hours" not in semantic["doctors"][0]\n    assert "branch_ids" not in semantic["doctors"][0]\n    assert "end_local" not in semantic["appointments"][0]\n    assert "price_minor" not in semantic["appointments"][0]\n    assert "branches" in catalog\n    assert "working_hours" in catalog["doctors"][0]\n'''
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit candidate locally
        run: |
          git config user.name "Tia CI"
          git config user.email "tia-ci@users.noreply.github.com"
          git add app/agents/turn_interpreter.py tests/test_single_location_agent_semantics.py
          git commit -m "Reduce semantic prompt and catalog context"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Deterministic semantic regression
        run: |
          python -m pytest \
            tests/test_single_location_agent_semantics.py \
            tests/test_unified_turn_interpreter.py \
            tests/test_contextual_time_followups.py \
            tests/test_contextual_followup_regressions.py \
            tests/test_clinic_grounding_compatibility.py \
            tests/test_compound_customer_requests.py \
            -q -k 'not live'
          python -m compileall -q app/agents/turn_interpreter.py

      - name: Audit real staging context size
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from sqlalchemy import create_engine, select
          from sqlalchemy.orm import Session
          from app.agents.clinic_grounding import build_clinic_catalog
          from app.agents.turn_interpreter import _interpreter_system_prompt, _semantic_catalog_for_single_location
          from app.core.config import settings
          from app.models.workspace import Workspace

          engine = create_engine(settings.database_url)
          with Session(engine) as db:
              workspace = db.scalar(select(Workspace).where(Workspace.slug == 'tia'))
              assert workspace is not None
              full = build_clinic_catalog(db, workspace)
              semantic = _semantic_catalog_for_single_location(full)
          full_json = json.dumps(full, ensure_ascii=False, separators=(',', ':'))
          semantic_json = json.dumps(semantic, ensure_ascii=False, separators=(',', ':'))
          prompt = _interpreter_system_prompt(
              timezone_name='Africa/Cairo',
              local_now=datetime.fromisoformat('2026-09-11T02:00:00+03:00'),
              active_flow=False,
          )
          ratio = len(semantic_json) / max(1, len(full_json))
          print(json.dumps({
              'full_catalog_chars': len(full_json),
              'semantic_catalog_chars': len(semantic_json),
              'catalog_ratio': round(ratio, 4),
              'prompt_chars': len(prompt),
              'services': len(semantic.get('services', [])),
              'doctors': len(semantic.get('doctors', [])),
          }, ensure_ascii=False, indent=2))
          assert ratio < 0.62, ratio
          assert 'branches' not in semantic
          assert all('doctor_ids' not in row for row in semantic.get('services', []))
          assert all('working_hours' not in row for row in semantic.get('doctors', []))
          PY

      - name: Run two new semantic smoke cases
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from datetime import datetime
          from langchain_core.messages import HumanMessage
          from sqlalchemy import create_engine, select
          from sqlalchemy.orm import Session

          from app.agents.clinic_grounding import build_clinic_catalog
          from app.agents.turn_interpreter import interpret_customer_turn
          from app.core.config import settings
          from app.models.workspace import Workspace
          from scripts.run_realistic_system_journeys import TokenMeter

          engine = create_engine(settings.database_url)
          with Session(engine) as db:
              workspace = db.scalar(select(Workspace).where(Workspace.slug == 'tia'))
              assert workspace is not None
              catalog = build_clinic_catalog(db, workspace)

          services = [row for row in catalog.get('services', []) if isinstance(row, dict)]
          doctors = [row for row in catalog.get('doctors', []) if isinstance(row, dict)]
          hydra = next(row for row in services if row.get('name') == 'هيدرافيشل')
          underarm = next(row for row in services if row.get('name') == 'ليزر إزالة الشعر - إبط')
          doctor = next(row for row in doctors if str(underarm['id']) in {str(v) for v in row.get('service_ids', [])})
          device = next(row for row in underarm.get('laser_devices', []) if row.get('device_key') == 'candela_gentle')

          cases = [
              {
                  'name': 'new_service_info_combo',
                  'message': 'الهيدرافيشل بكام وبتاخد قد إيه ومين الدكاترة اللي بيعملوها؟',
                  'expect_service': str(hydra['id']),
                  'caps': {'pricing', 'service_information', 'doctor_discovery'},
              },
              {
                  'name': 'new_complete_laser_booking',
                  'message': f"عايز أحجز {underarm['name']} بجهاز {device['device_name']} مع د. {doctor['name']} يوم 2026-09-12 الساعة 18:00",
                  'expect_service': str(underarm['id']),
                  'expect_doctor': str(doctor['id']),
                  'caps': {'availability_discovery', 'appointment_creation'},
              },
          ]

          meter = TokenMeter()
          meter.install()
          rows = []
          try:
              for case in cases:
                  mark = meter.mark()
                  decision = interpret_customer_turn(
                      flow=None,
                      history=[HumanMessage(content=case['message'])],
                      timezone_name='Africa/Cairo',
                      local_now=datetime.fromisoformat('2026-09-11T02:00:00+03:00'),
                      clinic_catalog=catalog,
                  )
                  usage = meter.since(mark)
                  assert decision.entity_hints.service_id == case['expect_service'], decision
                  assert case['caps'].issubset(set(decision.capabilities)), decision.capabilities
                  if case.get('expect_doctor'):
                      assert decision.entity_hints.doctor_id == case['expect_doctor'], decision.entity_hints
                      assert decision.entity_hints.laser_device_key == 'candela_gentle', decision.entity_hints
                      assert decision.entity_hints.requested_date == '2026-09-12', decision.entity_hints
                      assert decision.entity_hints.requested_start_time == '18:00', decision.entity_hints
                  rows.append({
                      'name': case['name'],
                      'message': case['message'],
                      'capabilities': list(decision.capabilities),
                      'service_id': decision.entity_hints.service_id,
                      'doctor_id': decision.entity_hints.doctor_id,
                      'laser_device_key': decision.entity_hints.laser_device_key,
                      'tokens': usage,
                  })
          finally:
              meter.uninstall()

          total_input = sum(row['tokens']['input_tokens'] for row in rows)
          assert total_input > 0
          report = {'cases': rows, 'total_input_tokens': total_input}
          with open('artifacts/lean-semantic-context.json', 'w', encoding='utf-8') as handle:
              json.dump(report, handle, ensure_ascii=False, indent=2)
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Push verified candidate
        run: git push origin HEAD:test/realistic-system-journeys-v1

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-semantic-context
          path: backend/artifacts/lean-semantic-context.json
          if-no-files-found: warn
          retention-days: 7
