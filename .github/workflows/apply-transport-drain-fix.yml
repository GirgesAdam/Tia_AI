name: Apply transport drain fix

on:
  push:
    branches:
      - fix/automation-transport-drain

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply transport drain fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/automation-transport-drain
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/apply_transport_drain_fix.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/api/routes/automations.py backend/app/services/meta_whatsapp_transport.py backend/tests/test_automation_transport_scheduler.py n8n/AUTOMATIONS_SETUP.md
          git commit -m "Apply transport drain fix"
          git push origin HEAD:fix/automation-transport-drain
