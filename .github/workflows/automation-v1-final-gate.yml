name: Automation V1 final gate

on:
  push:
    branches: [feat/core-product-hardening]
    paths:
      - .github/workflows/automation-v1-final-gate.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/core-product-hardening
          fetch-depth: 0

      - name: Apply final automation core patch
        shell: python
        run: |
          from pathlib import Path
          import re

          service_path = Path("backend/app/services/automations.py")
          source = service_path.read_text(encoding="utf-8")
          source, count = re.subn(
              r'    if rule_key == "appointment_reminder_6h":\n        return \(\n.*?        \)\n    # Legacy rules',
              '    if rule_key == "appointment_reminder_6h":\n'
              '        return (\n'
              '            f"أهلًا {data[\'patient_name\']} 👋 بفكرك بموعدك لـ{data[\'service_name\']} "\n'
              '            f"يوم {data[\'date\']} الساعة {data[\'time\']}. "\n'
              '            "لو محتاجة تعدّلي الموعد ابعتيلي هنا."\n'
              '        )\n'
              '    # Legacy rules',
              source,
              count=1,
              flags=re.S,
          )
          assert count == 1
          source, count = re.subn(
              r'    if rule_key == "post_visit_followup":\n        return \(\n.*?        \)\n    if rule_key == "no_show_followup":',
              '    if rule_key == "post_visit_followup":\n'
              '        return (\n'
              '            f"إزيك {data[\'patient_name\']}؟ حبيت أطمن عليكي بعد {data[\'service_name\']} "\n'
              '            f"اللي كانت يوم {data[\'date\']}. كل حاجة تمام؟ "\n'
              '            "لو محتاجة مساعدة أو حابة تحجزي الجلسة الجاية ابعتيلي هنا، "\n'
              '            "ويسعدنا نعرف تقييمك للجلسة."\n'
              '        )\n'
              '    if rule_key == "no_show_followup":',
              source,
              count=1,
              flags=re.S,
          )
          assert count == 1
          assert source.count("return [patient_name, service_name, time, branch_name]") == 1
          source = source.replace(
              "return [patient_name, service_name, time, branch_name]",
              "return [patient_name, service_name, date, time]",
              1,
          )
          service_path.write_text(source, encoding="utf-8")

          actions_path = Path("frontend/src/app/(dashboard)/automations/actions.ts")
          actions = actions_path.read_text(encoding="utf-8")
          start = actions.find("export async function saveAutomationTemplates")
          end = actions.find("export async function retryAutomationJob", start)
          assert start != -1 and end != -1
          actions_path.write_text(actions[:start] + actions[end:], encoding="utf-8")

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend gate
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
          MIGRATION_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          SUPABASE_SECRET_KEY: sb_secret_ci_dummy
          ENVIRONMENT: test
          DEBUG: "false"
          DOCS_ENABLED: "false"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ruff check app tests alembic
          python -m compileall -q app alembic tests
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend gate
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          TIA_API_URL: http://127.0.0.1:8000
        run: |
          npm ci
          npm run lint
          npx next typegen
          npm run typecheck
          npm run build

      - name: Commit final tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/automations.py 'frontend/src/app/(dashboard)/automations/actions.ts'
          git diff --cached --check
          git commit -m "feat: finalize configurable automation core"
          git push origin HEAD:feat/core-product-hardening
