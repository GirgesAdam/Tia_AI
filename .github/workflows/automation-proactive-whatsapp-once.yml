name: Automation proactive WhatsApp (one-time)

on:
  push:
    branches:
      - feat/core-product-hardening
    paths:
      - .github/workflows/automation-proactive-whatsapp-once.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/core-product-hardening
          fetch-depth: 0

      - name: Patch proactive WhatsApp route
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/app/services/automations.py")
          source = path.read_text(encoding="utf-8")

          import_anchor = "from app.schemas.automation import AutomationClaimedJob, AutomationOperationsOverview\n"
          import_replacement = import_anchor + "from app.schemas.crm import normalize_patient_identity_phone\n"
          assert source.count(import_anchor) == 1, "schema import anchor changed"
          source = source.replace(import_anchor, import_replacement, 1)

          helper_anchor = '''def _resolve_external_route(\n'''
          helpers = '''def _config_flag_enabled(value: object) -> bool:\n    if value is True:\n        return True\n    if isinstance(value, str):\n        return value.strip().lower() in {"1", "true", "yes", "on"}\n    return False\n\n\ndef _proactive_whatsapp_recipient(patient: Patient) -> str | None:\n    """Return the provider recipient id only when the CRM phone is globally routable."""\n    try:\n        _, normalized = normalize_patient_identity_phone(\n            patient.phone_normalized or patient.phone\n        )\n    except ValueError:\n        return None\n    if not normalized or not normalized.startswith("+"):\n        return None\n    digits = normalized[1:]\n    if not digits.isdigit() or not 8 <= len(digits) <= 15:\n        return None\n    return digits\n\n\ndef _real_proactive_whatsapp_connection(connection: ChannelConnection) -> bool:\n    config = connection.config_json or {}\n    return (\n        connection.channel == "whatsapp"\n        and connection.status == "active"\n        and bool(connection.external_account_id)\n        and str(config.get("runtime_kind") or "").strip().lower() == "real"\n        and not _config_flag_enabled(config.get("mock"))\n        and not _config_flag_enabled(config.get("do_not_send"))\n    )\n\n\ndef _resolve_external_route(\n'''
          assert source.count(helper_anchor) == 1, "route helper anchor changed"
          source = source.replace(helper_anchor, helpers, 1)

          old_tail = '''    if identity is None:\n        return None\n\n    connection = db.get(ChannelConnection, identity.channel_connection_id)\n    if connection is None:\n        return None\n\n    conversation = Conversation(\n'''
          new_tail = '''    if identity is None:\n        if channel not in {"auto", "whatsapp"}:\n            return None\n        patient = db.get(Patient, patient_id)\n        if patient is None:\n            return None\n        recipient = _proactive_whatsapp_recipient(patient)\n        if recipient is None:\n            return None\n\n        proactive_connections = [\n            candidate\n            for candidate in db.scalars(\n                select(ChannelConnection).where(\n                    ChannelConnection.workspace_id == workspace_id,\n                    ChannelConnection.channel == "whatsapp",\n                    ChannelConnection.status == "active",\n                )\n            )\n            if _real_proactive_whatsapp_connection(candidate)\n        ]\n        # For a patient without an established identity, routing must be unambiguous.\n        # Multi-number workspaces can still route through an existing identity/conversation.\n        if len(proactive_connections) != 1:\n            return None\n        connection = proactive_connections[0]\n\n        recipient_identity = db.scalar(\n            select(ChannelIdentity).where(\n                ChannelIdentity.workspace_id == workspace_id,\n                ChannelIdentity.channel_connection_id == connection.id,\n                ChannelIdentity.external_user_id == recipient,\n            )\n        )\n        if recipient_identity is not None:\n            if recipient_identity.patient_id != patient_id:\n                # Never send to a phone already owned by another CRM patient.\n                return None\n            identity = recipient_identity\n        else:\n            display_name = (\n                f"{patient.first_name or ''} {patient.last_name or ''}".strip()\n                or patient.first_name\n                or None\n            )\n            identity = ChannelIdentity(\n                workspace_id=workspace_id,\n                channel_connection_id=connection.id,\n                patient_id=patient_id,\n                external_user_id=recipient,\n                display_name=display_name,\n                phone=patient.phone,\n                metadata_json={\n                    "source": "crm_patient_phone",\n                    "proactive_identity": True,\n                },\n            )\n            db.add(identity)\n            db.flush()\n    else:\n        connection = db.get(ChannelConnection, identity.channel_connection_id)\n        if connection is None:\n            return None\n\n    conversation = Conversation(\n'''
          assert source.count(old_tail) == 1, "identity route tail changed"
          source = source.replace(old_tail, new_tail, 1)
          path.write_text(source, encoding="utf-8")

          test_path = Path("backend/tests/test_automation_proactive_whatsapp.py")
          test_path.write_text('''from types import SimpleNamespace\n\nfrom app.services.automations import (\n    _proactive_whatsapp_recipient,\n    _real_proactive_whatsapp_connection,\n)\n\n\ndef test_proactive_recipient_normalizes_egypt_mobile_to_provider_digits() -> None:\n    patient = SimpleNamespace(phone_normalized="01012345678", phone="01012345678")\n    assert _proactive_whatsapp_recipient(patient) == "201012345678"\n\n\ndef test_proactive_recipient_accepts_global_e164_and_rejects_ambiguous_local_phone() -> None:\n    assert _proactive_whatsapp_recipient(\n        SimpleNamespace(phone_normalized="+971501234567", phone="+971501234567")\n    ) == "971501234567"\n    assert _proactive_whatsapp_recipient(\n        SimpleNamespace(phone_normalized="501234567", phone="501234567")\n    ) is None\n\n\ndef test_proactive_connection_requires_one_real_sendable_whatsapp_runtime() -> None:\n    good = SimpleNamespace(\n        channel="whatsapp",\n        status="active",\n        external_account_id="phone-number-id",\n        config_json={"runtime_kind": "real", "do_not_send": False},\n    )\n    assert _real_proactive_whatsapp_connection(good) is True\n\n    for config in (\n        {"runtime_kind": "real", "mock": True},\n        {"runtime_kind": "real", "do_not_send": "true"},\n        {"runtime_kind": "staging_mock"},\n        {},\n    ):\n        candidate = SimpleNamespace(\n            channel="whatsapp", status="active", external_account_id="phone-number-id", config_json=config\n        )\n        assert _real_proactive_whatsapp_connection(candidate) is False\n\n\ndef test_external_route_has_collision_and_ambiguity_guards() -> None:\n    from pathlib import Path\n\n    root = Path(__file__).resolve().parents[1]\n    source = (root / "app/services/automations.py").read_text(encoding="utf-8")\n    route = source.split("def _resolve_external_route(", 1)[1].split("def _followup_active_handoff(", 1)[0]\n    assert "len(proactive_connections) != 1" in route\n    assert "recipient_identity.patient_id != patient_id" in route\n    assert '"source": "crm_patient_phone"' in route\n    assert '"proactive_identity": True' in route\n''', encoding="utf-8")

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run automation regression tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tia_test
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: test-publishable-key
          SUPABASE_SECRET_KEY: test-secret-key
        run: >-
          python -m pytest
          tests/test_automation_proactive_whatsapp.py
          tests/test_automation_rule_disable_contract.py
          tests/test_automation_lifecycle_contract.py
          tests/test_automation_engine.py
          tests/test_appointment_reminder_6h.py
          tests/test_n8n_workflow_contract.py
          -q

      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/automations.py backend/tests/test_automation_proactive_whatsapp.py
          git diff --cached --check
          git commit -m "fix: route proactive WhatsApp automations by patient phone"
          git push origin HEAD:feat/core-product-hardening
