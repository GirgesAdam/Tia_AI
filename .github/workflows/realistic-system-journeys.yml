name: Realistic System Journeys

on:
  workflow_dispatch:
  push:
    branches:
      - test/realistic-system-journeys-v1
    paths:
      - .github/workflows/realistic-system-journeys.yml
      - backend/scripts/run_realistic_system_journeys.py

permissions:
  contents: read

concurrency:
  group: realistic-system-journeys
  cancel-in-progress: false

jobs:
  review:
    name: Realistic Tia system journeys
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_realistic_journey_unused
      SUPABASE_SECRET_KEY: sb_secret_realistic_journey_unused
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-5.6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "2"
      LLM_REALTIME_MAX_RETRIES: "0"
      AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
      CORS_ORIGINS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify staging secrets
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$DATABASE_URL"
      - name: Run realistic system journeys
        run: python -m scripts.run_realistic_system_journeys --workspace-slug tia --report artifacts/realistic-system-journeys.json
      - name: Upload manual-review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realistic-system-journeys
          path: backend/artifacts/realistic-system-journeys.json
          if-no-files-found: warn
          retention-days: 7
