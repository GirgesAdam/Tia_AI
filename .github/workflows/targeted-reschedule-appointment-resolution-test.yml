name: Targeted reschedule appointment resolution test

on:
  push:
    branches:
      - fix/reschedule-appointment-resolution-v2

permissions:
  contents: write

jobs:
  targeted:
    if: ${{ !contains(github.event.head_commit.message, '[targeted-reschedule-test-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reschedule-appointment-resolution-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run only the new regression test
        working-directory: backend
        run: python -m pytest tests/test_reschedule_appointment_resolution.py -q
      - name: Remove targeted workflow after success
        run: rm .github/workflows/targeted-reschedule-appointment-resolution-test.yml
      - name: Commit workflow cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove targeted test workflow [targeted-reschedule-test-done]"
          git push origin HEAD:fix/reschedule-appointment-resolution-v2
