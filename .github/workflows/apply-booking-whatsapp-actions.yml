name: Apply booking WhatsApp actions patch

on:
  push:
    branches:
      - feat/booking-whatsapp-actions
    paths:
      - .github/workflows/apply-booking-whatsapp-actions.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/booking-whatsapp-actions
          fetch-depth: 0
      - name: Apply source patch
        run: python .github/patches/apply_booking_whatsapp_actions.py
      - name: Remove temporary patch machinery
        run: |
          rm .github/patches/apply_booking_whatsapp_actions.py
          rm .github/workflows/apply-booking-whatsapp-actions.yml
      - name: Commit feature implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement WhatsApp booking actions"
          git push origin HEAD:feat/booking-whatsapp-actions
