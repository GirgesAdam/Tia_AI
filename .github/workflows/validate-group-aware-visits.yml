name: Validate Group-Aware Visits

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/validate-group-aware-visits.yml
      - .github/implementation/group_aware_visit_patch.py
      - .github/implementation/fix_group_aware_builder_markers.py
      - .github/implementation/fix_group_aware_write_indent.py
      - .github/implementation/fix_group_aware_runtime_edges.py
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
  MIGRATION_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
  SUPABASE_URL: https://example.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
  SUPABASE_SECRET_KEY: sb_secret_ci_dummy
  ENVIRONMENT: test
  DEBUG: "false"
  DOCS_ENABLED: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Apply deterministic patch
        run: |
          python .github/implementation/fix_group_aware_builder_markers.py
          python .github/implementation/group_aware_visit_patch.py
          python .github/implementation/fix_group_aware_write_indent.py
          python .github/implementation/fix_group_aware_runtime_edges.py
          ruff check --fix backend/tests/test_v2_grouped_visits.py
          git diff --check
          git status --short

      - name: Ruff
        working-directory: backend
        run: ruff check app tests alembic

      - name: Compile
        working-directory: backend
        run: python -m compileall -q app alembic tests

      - name: Focused grouped-visit tests
        working-directory: backend
        run: python -m pytest -q tests/test_v2_grouped_visits.py tests/test_agent_v2_orchestrator.py

      - name: Full backend suite
        working-directory: backend
        run: python -m pytest -q

      - name: Build patch artifact
        if: success()
        run: git diff --binary > group-aware-visits.patch

      - name: Upload patch artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: group-aware-visits-patch
          path: group-aware-visits.patch
          retention-days: 3
