name: Apply Extended Flow Follow-up Fix

on:
  push:
    branches:
      - test/daily-clinic-conversation-review
    paths:
      - backend/scripts/apply_extended_flow_followup_fix.py
      - .github/workflows/apply-extended-flow-followup-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/daily-clinic-conversation-review
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact fix
        run: python backend/scripts/apply_extended_flow_followup_fix.py
      - name: Validate syntax
        run: |
          python -m py_compile backend/app/agents/turn_interpreter.py
          python -m py_compile backend/scripts/run_extended_booking_conversation_review.py
      - name: Commit product fix
        run: |
          git config user.name "Girges Ezzat"
          git config user.email "girgesadam1@gmail.com"
          git add backend/app/agents/turn_interpreter.py backend/scripts/run_extended_booking_conversation_review.py
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "Fix structured booking follow-up state handling"
          git push origin HEAD:test/daily-clinic-conversation-review
