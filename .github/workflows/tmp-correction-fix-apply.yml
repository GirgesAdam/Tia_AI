name: Temporary Correction Patch Apply

on:
  push:
    branches:
      - fix/correction-semantics-20261011

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: stage correction apply workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused patch
        run: python .github/tmp_apply_correction_fix.py
      - name: Syntax and whitespace check
        run: |
          python -m py_compile \
            backend/app/agents/v2/turn_contract.py \
            backend/app/agents/v2/turn_interpreter.py \
            backend/app/agents/v2/availability_reference_interpreter.py \
            backend/app/services/agent_v2/active_task_progress.py \
            backend/app/services/agent_v2/orchestrator.py \
            backend/app/services/agent_v2/outcome_builder.py \
            backend/tests/test_v2_correction_semantics_fix.py
          git diff --check
      - name: Commit applied patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "fix: focused correction semantics"
          git push origin HEAD:fix/correction-semantics-20261011
