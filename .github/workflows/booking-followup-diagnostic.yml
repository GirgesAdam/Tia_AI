name: Booking Follow-up Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - test/daily-clinic-conversation-review
    paths:
      - backend/scripts/run_booking_followup_diagnostic.py
      - .github/workflows/booking-followup-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: staging
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_booking_diag_unused
      SUPABASE_SECRET_KEY: sb_secret_booking_diag_unused
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_PROVIDER: openai
      OPENAI_MODEL: gpt-5.6-luna
      OPENAI_FALLBACK_MODEL: gpt-5-mini
      OPENAI_REASONING_EFFORT: low
      OPENAI_FALLBACK_REASONING_EFFORT: low
      LLM_TIMEOUT_SECONDS: "60"
      LLM_MAX_RETRIES: "2"
      LLM_REALTIME_MAX_RETRIES: "0"
      AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
      BOOKING_DIAGNOSTIC_CASES: booking_change_service_mid_conversation
      CORS_ORIGINS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run targeted diagnostic
        run: python -m scripts.run_booking_followup_diagnostic
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-followup-diagnostic
          path: backend/artifacts/booking-followup-diagnostic.json
          if-no-files-found: warn
          retention-days: 2