name: Build Compound Visit Patch

on:
  push:
    branches:
      - main
    paths:
      - .github/implementation/compound_visit_patch.py
      - .github/implementation/compound_visit_patch_finish.py
      - .github/implementation/compound_visit_atomicity_test.py
      - .github/workflows/build-compound-visit-patch.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Apply patch in checkout only
        shell: bash
        run: |
          set +e
          patch_output="$(python .github/implementation/compound_visit_patch.py 2>&1)"
          patch_status=$?
          set -e
          printf '%s\n' "$patch_output"
          if [ "$patch_status" -ne 0 ]; then
            expected="expected one match in backend/app/services/agent_v2/compound_visit_preflight.py: '    groups: dict[str, list[PlanStep]] = {}\\n'; got 2"
            if [[ "$patch_output" != *"$expected"* ]]; then
              exit "$patch_status"
            fi
            echo "Verified expected stage-one handoff to finish script."
          fi
          python .github/implementation/compound_visit_patch_finish.py
          python .github/implementation/compound_visit_atomicity_test.py
          python -m ruff check --fix \
            backend/tests/test_v2_same_visit_booking.py \
            backend/tests/test_v2_compound_atomicity.py
      - name: Validate diff
        run: git diff --check
      - name: Compile changed runtime
        working-directory: backend
        run: python -m compileall -q app tests
      - name: Ruff changed runtime
        working-directory: backend
        run: |
          python -m ruff check \
            app/models/appointment.py \
            app/services/appointment_creation.py \
            app/services/agent_v2/planner.py \
            app/services/agent_v2/compound_turn_policy.py \
            app/services/agent_v2/compound_visit_preflight.py \
            app/services/agent_v2/orchestrator.py \
            app/services/agent_v2/write_executor.py \
            tests/test_v2_same_visit_booking.py \
            tests/test_v2_visit_group_write.py \
            tests/test_v2_compound_atomicity.py \
            tests/test_v2_compound_visit_preflight.py
      - name: Run focused compound tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_v2_same_visit_booking.py \
            tests/test_v2_visit_group_write.py \
            tests/test_v2_compound_atomicity.py \
            tests/test_v2_compound_turn_policy.py \
            tests/test_v2_compound_visit_preflight.py \
            tests/test_v2_planner.py
      - name: Run all V2 unit tests
        working-directory: backend
        env:
          PYTHONPATH: .
        shell: bash
        run: python -m pytest -q tests/test_v2_*.py
      - name: Save patch diff
        if: always()
        run: git diff -- backend > compound-visit.patch
      - name: Upload patched files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compound-visit-patch
          path: |
            compound-visit.patch
            backend/app/models/appointment.py
            backend/app/services/appointment_creation.py
            backend/app/services/agent_v2/planner.py
            backend/app/services/agent_v2/compound_turn_policy.py
            backend/app/services/agent_v2/compound_visit_preflight.py
            backend/app/services/agent_v2/orchestrator.py
            backend/app/services/agent_v2/write_executor.py
            backend/tests/test_v2_same_visit_booking.py
            backend/tests/test_v2_visit_group_write.py
            backend/tests/test_v2_compound_atomicity.py
            backend/tests/test_v2_compound_visit_preflight.py
          if-no-files-found: error
