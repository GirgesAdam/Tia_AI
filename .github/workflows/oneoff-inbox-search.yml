name: One-off Inbox Search Patch

on:
  push:
    paths:
      - .github/workflows/oneoff-inbox-search.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch inbox search
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path('backend/app/api/routes/inbox.py')
          source = backend.read_text(encoding='utf-8')
          old = 'from sqlalchemy import case, func, select'
          new = 'from sqlalchemy import case, func, or_, select'
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          old = '''    assigned_to_me: bool = False,\n    unread_only: bool = False,\n    limit: Annotated[int, Query(ge=1, le=100)] = 50,'''
          new = '''    assigned_to_me: bool = False,\n    unread_only: bool = False,\n    q: Annotated[str | None, Query(max_length=120)] = None,\n    limit: Annotated[int, Query(ge=1, le=100)] = 50,'''
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          old = '''    if unread_only:\n        stmt = stmt.where(Conversation.unread_count > 0)\n\n    stmt = ('''
          new = '''    if unread_only:\n        stmt = stmt.where(Conversation.unread_count > 0)\n    if q:\n        search = q.strip()\n        if search:\n            escaped = search.replace("\\\\", "\\\\\\\\").replace("%", "\\\\%").replace("_", "\\\\_")\n            pattern = f"%{escaped}%"\n            conditions = [\n                Patient.first_name.ilike(pattern, escape="\\\\"),\n                Patient.last_name.ilike(pattern, escape="\\\\"),\n                func.concat_ws(" ", Patient.first_name, Patient.last_name).ilike(\n                    pattern, escape="\\\\"\n                ),\n                Patient.phone.ilike(pattern, escape="\\\\"),\n            ]\n            phone_digits = "".join(character for character in search if character.isdigit())\n            if phone_digits:\n                phone_pattern = f"%{phone_digits}%"\n                conditions.append(\n                    Patient.phone_normalized.ilike(phone_pattern, escape="\\\\")\n                )\n            stmt = stmt.where(or_(*conditions))\n\n    stmt = ('''
          assert source.count(old) == 1
          source = source.replace(old, new, 1)
          backend.write_text(source, encoding='utf-8')

          frontend = Path('frontend/src/app/(dashboard)/inbox/page.tsx')
          source = frontend.read_text(encoding='utf-8')
          old = 'import { Bot, MessageSquareMore, UserRound } from "lucide-react";'
          new = 'import { Bot, MessageSquareMore, Search, UserRound } from "lucide-react";'
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          old = 'type InboxSearchParams = { owner?: string; status?: string; mine?: string; unread?: string };'
          new = 'type InboxSearchParams = { owner?: string; status?: string; mine?: string; unread?: string; q?: string };'
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          old = '''    mine: raw.mine === "1" ? "1" : "",\n    unread: raw.unread === "1" ? "1" : "",\n  };'''
          new = '''    mine: raw.mine === "1" ? "1" : "",\n    unread: raw.unread === "1" ? "1" : "",\n    q: (raw.q || "").trim().slice(0, 120),\n  };'''
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          old = '''  if (filters.mine) query.set("assigned_to_me", "true");\n  if (filters.unread) query.set("unread_only", "true");'''
          new = '''  if (filters.mine) query.set("assigned_to_me", "true");\n  if (filters.unread) query.set("unread_only", "true");\n  if (filters.q) query.set("q", filters.q);'''
          assert source.count(old) == 1
          source = source.replace(old, new, 1)

          marker = '''      <div className="surface-toolbar mb-4">'''
          search_form = '''      <form action="/inbox" method="get" className="mb-4 flex flex-col gap-2 sm:flex-row">\n        {filters.owner && <input type="hidden" name="owner" value={filters.owner} />}\n        {filters.status && <input type="hidden" name="status" value={filters.status} />}\n        {filters.mine && <input type="hidden" name="mine" value={filters.mine} />}\n        {filters.unread && <input type="hidden" name="unread" value={filters.unread} />}\n        <div className="relative min-w-0 flex-1">\n          <Search\n            size={17}\n            aria-hidden="true"\n            className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-slate-400"\n          />\n          <input\n            type="search"\n            name="q"\n            defaultValue={filters.q}\n            maxLength={120}\n            className="form-control w-full pr-10"\n            placeholder="ابحث باسم العميل أو رقم الموبايل"\n            aria-label="البحث في المحادثات باسم العميل أو رقم الموبايل"\n          />\n        </div>\n        <button\n          type="submit"\n          className="inline-flex h-10 items-center justify-center rounded-xl bg-[var(--accent)] px-5 text-sm font-bold text-white transition hover:bg-[var(--accent-strong)]"\n        >\n          بحث\n        </button>\n        {filters.q && (\n          <Link\n            href={filterHref(filters, "q", "")}\n            className="inline-flex h-10 items-center justify-center rounded-xl border border-[var(--border)] px-4 text-sm font-bold text-slate-700 transition hover:bg-slate-50"\n          >\n            مسح البحث\n          </Link>\n        )}\n      </form>\n\n'''
          assert source.count(marker) == 1
          source = source.replace(marker, search_form + marker, 1)

          old = '''              description="غيّر الفلاتر أو افتح كل المحادثات لعرض نتائج أخرى."'''
          new = '''              description={filters.q ? "جرّب اسمًا أو رقم موبايل مختلفًا، أو امسح البحث لعرض كل المحادثات." : "غيّر الفلاتر أو افتح كل المحادثات لعرض نتائج أخرى."}'''
          assert source.count(old) == 1
          source = source.replace(old, new, 1)
          frontend.write_text(source, encoding='utf-8')

          test_file = Path('backend/tests/test_inbox_search_contract.py')
          if test_file.exists():
              test_file.unlink()
          PY

          git rm .github/workflows/oneoff-inbox-search.yml
          git config user.name "Tia CI"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/api/routes/inbox.py frontend/src/app/'(dashboard)'/inbox/page.tsx backend/tests/test_inbox_search_contract.py
          git commit -m "feat: search inbox by patient name or phone"
          git push origin HEAD:main
