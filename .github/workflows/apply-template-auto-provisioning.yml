name: Apply template auto-provisioning patch

on:
  push:
    branches:
      - feat/clinic-ops-ux-cleanup
    paths:
      - .github/workflows/apply-template-auto-provisioning.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clinic-ops-ux-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/apply_template_auto_provisioning.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "Auto-provision WhatsApp automation templates"
          git push origin HEAD:feat/clinic-ops-ux-cleanup
