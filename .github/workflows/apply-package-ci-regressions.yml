name: Apply package CI regression fixes

on:
  push:
    branches:
      - feat/laser-package-offers

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[package-ci-regressions-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/laser-package-offers
          fetch-depth: 0
      - name: Apply compatibility fixes
        run: |
          python backend/scripts/patch_package_ci_regressions_temp.py
          git diff --check
          python -m compileall -q backend/app
      - name: Commit product fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/integrations/clinic/tia_database.py backend/app/services/agent_chat.py backend/app/services/patient_packages.py backend/app/api/routes/booking.py backend/app/api/routes/package_offers.py backend/app/services/staff_appointment_edits.py
          git commit -m "fix(packages): preserve compatibility and opt-in finance reads [package-ci-regressions-patched]"
          git push origin HEAD:feat/laser-package-offers
