name: Automation rule disable hardening (one-time)

on:
  push:
    branches:
      - feat/core-product-hardening
    paths:
      - .github/workflows/automation-rule-disable-hardening-once.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/core-product-hardening
          fetch-depth: 0

      - name: Patch immediate rule-disable cancellation
        shell: python
        run: |
          from pathlib import Path

          path = Path("backend/app/api/routes/automations.py")
          source = path.read_text(encoding="utf-8")

          old_import = "from sqlalchemy import select\n"
          new_import = "from sqlalchemy import and_, or_, select\n"
          assert source.count(old_import) == 1, "sqlalchemy import anchor changed"
          source = source.replace(old_import, new_import, 1)

          old_block = '''    if payload.enabled is False:\n        for job in db.scalars(\n            select(AutomationJob).where(\n                AutomationJob.workspace_id == access.workspace.id,\n                AutomationJob.rule_id == rule.id,\n                AutomationJob.status.in_(("queued", "failed")),\n            )\n        ):\n            job.status = "cancelled"\n            job.completed_at = datetime.now(UTC)\n            job.result_json = {"reason": "rule_disabled_by_admin"}\n\n'''
          new_block = '''    if payload.enabled is False:\n        cancellable_job_ids = list(\n            db.scalars(\n                select(AutomationJob.id)\n                .outerjoin(MessageDispatch, MessageDispatch.id == AutomationJob.dispatch_id)\n                .where(\n                    AutomationJob.workspace_id == access.workspace.id,\n                    AutomationJob.rule_id == rule.id,\n                    or_(\n                        AutomationJob.status.in_(("queued", "failed")),\n                        and_(\n                            AutomationJob.status == "dispatched",\n                            MessageDispatch.status == "queued",\n                        ),\n                    ),\n                )\n            )\n        )\n        for pending_job_id in cancellable_job_ids:\n            cancel_automation_job(\n                db,\n                workspace_id=access.workspace.id,\n                job_id=pending_job_id,\n                actor_user_id=access.user.id,\n            )\n\n'''
          assert source.count(old_block) == 1, "rule-disable block changed"
          source = source.replace(old_block, new_block, 1)
          path.write_text(source, encoding="utf-8")

          test_path = Path("backend/tests/test_automation_rule_disable_contract.py")
          test_path.write_text('''from pathlib import Path\n\n\ndef _route_source() -> str:\n    root = Path(__file__).resolve().parents[1]\n    return (root / "app/api/routes/automations.py").read_text(encoding="utf-8")\n\n\ndef test_disabling_rule_immediately_cancels_safely_queued_provider_sends() -> None:\n    source = _route_source()\n    update = source.split("def update_rule(", 1)[1].split("@router.get(\\\"/overview\\\"", 1)[0]\n    assert 'AutomationJob.status.in_(("queued", "failed"))' in update\n    assert 'AutomationJob.status == "dispatched"' in update\n    assert 'MessageDispatch.status == "queued"' in update\n    assert "cancel_automation_job(" in update\n    assert "actor_user_id=access.user.id" in update\n\n\ndef test_rule_disable_does_not_claim_processing_or_already_sent_dispatches() -> None:\n    source = _route_source()\n    update = source.split("def update_rule(", 1)[1].split("@router.get(\\\"/overview\\\"", 1)[0]\n    assert 'MessageDispatch.status == "processing"' not in update\n    assert 'MessageDispatch.status == "sent"' not in update\n''', encoding="utf-8")

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run automation regression tests
        working-directory: backend
        run: >-
          python -m pytest
          tests/test_automation_rule_disable_contract.py
          tests/test_automation_lifecycle_contract.py
          tests/test_automation_engine.py
          tests/test_appointment_reminder_6h.py
          tests/test_n8n_workflow_contract.py
          -q

      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/api/routes/automations.py backend/tests/test_automation_rule_disable_contract.py
          git diff --cached --check
          git commit -m "fix: cancel queued automation sends when rule stops"
          git push origin HEAD:feat/core-product-hardening
