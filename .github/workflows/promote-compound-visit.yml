name: Promote Compound Visit Patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/promote-compound-visit.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Reproduce validated patch
        shell: bash
        run: |
          set +e
          patch_output="$(python .github/implementation/compound_visit_patch.py 2>&1)"
          patch_status=$?
          set -e
          printf '%s\n' "$patch_output"
          if [ "$patch_status" -ne 0 ]; then
            expected="expected one match in backend/app/services/agent_v2/compound_visit_preflight.py: '    groups: dict[str, list[PlanStep]] = {}\\n'; got 2"
            if [[ "$patch_output" != *"$expected"* ]]; then
              exit "$patch_status"
            fi
          fi
          python .github/implementation/compound_visit_patch_finish.py
          python .github/implementation/compound_visit_atomicity_test.py
          python -m ruff check --fix \
            backend/tests/test_v2_same_visit_booking.py \
            backend/tests/test_v2_compound_atomicity.py

      - name: Verify exact artifact hashes
        shell: bash
        run: |
          cat > /tmp/expected.sha256 <<'EOF'
          f03b6a1b3d3cdd5ee6567878117b0bf3b73b7f44902b88ef7fef49c50acab351  backend/app/models/appointment.py
          1c1a6e413c1296efd41af61fb16a169e7dbb05b65a680c20f952a5589e8f2804  backend/app/services/agent_v2/compound_turn_policy.py
          423797b15f10fc7701530acec8e0c53ac427c7d67637873ee696c62e4600980d  backend/app/services/agent_v2/compound_visit_preflight.py
          303680d47cfd64d36ca6decb01aaf2e9362a369acfe5b04be981968c0a82dff8  backend/app/services/agent_v2/orchestrator.py
          957607344321eee4060be32856c8ef7cd422db94caf28e58364141004fe182e0  backend/app/services/agent_v2/planner.py
          7d7f19dd9315ddc9744145e52258fe45373bd5f9def6b22f719cf6ff77417dd7  backend/app/services/agent_v2/write_executor.py
          b74919b34b52049d8b93cf4b9a8ce3ed83183d61a51fc0e7a1f6b48b7e72005c  backend/app/services/appointment_creation.py
          dc9ee9fd15c64fe6a08aa8a85ac05e99f6922052d094665f01329c76fe8d0fa7  backend/tests/test_v2_compound_atomicity.py
          a359a6d42babb433d5c0b94f5674002327dad0a70941aff6b87a0c6af19e3758  backend/tests/test_v2_compound_visit_preflight.py
          9f72ab92c747f1d0b11a44d4d4ecce25099ab27124dc02555f2ba0518d76805a  backend/tests/test_v2_same_visit_booking.py
          8d068024a03e1c548bae176541aef7fefe1e3767fd5571e81eb92f9f6f3c85e1  backend/tests/test_v2_visit_group_write.py
          EOF
          sed -i 's/^          //' /tmp/expected.sha256
          sha256sum -c /tmp/expected.sha256

      - name: Validate exact patch
        run: |
          git diff --check
          cd backend
          python -m compileall -q app tests
          python -m ruff check \
            app/models/appointment.py \
            app/services/appointment_creation.py \
            app/services/agent_v2/planner.py \
            app/services/agent_v2/compound_turn_policy.py \
            app/services/agent_v2/compound_visit_preflight.py \
            app/services/agent_v2/orchestrator.py \
            app/services/agent_v2/write_executor.py \
            tests/test_v2_same_visit_booking.py \
            tests/test_v2_visit_group_write.py \
            tests/test_v2_compound_atomicity.py \
            tests/test_v2_compound_visit_preflight.py
          python -m pytest -q \
            tests/test_v2_same_visit_booking.py \
            tests/test_v2_visit_group_write.py \
            tests/test_v2_compound_atomicity.py \
            tests/test_v2_compound_turn_policy.py \
            tests/test_v2_compound_visit_preflight.py \
            tests/test_v2_planner.py
          python -m pytest -q tests/test_v2_*.py

      - name: Commit validated runtime atomically
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/promote-compound-visit.yml
          git add \
            backend/app/models/appointment.py \
            backend/app/services/appointment_creation.py \
            backend/app/services/agent_v2/planner.py \
            backend/app/services/agent_v2/compound_turn_policy.py \
            backend/app/services/agent_v2/compound_visit_preflight.py \
            backend/app/services/agent_v2/orchestrator.py \
            backend/app/services/agent_v2/write_executor.py \
            backend/tests/test_v2_same_visit_booking.py \
            backend/tests/test_v2_visit_group_write.py \
            backend/tests/test_v2_compound_atomicity.py \
            backend/tests/test_v2_compound_visit_preflight.py
          git commit -m "Add atomic multi-service visit booking"
          git push origin HEAD:main
