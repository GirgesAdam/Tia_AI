name: Automation V1 finalize once

on:
  push:
    branches: [feat/core-product-hardening]
    paths:
      - .github/workflows/automation-v1-finalize-once.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/core-product-hardening
          fetch-depth: 0

      - name: Finalize automation copy and simplify admin actions
        shell: python
        run: |
          from pathlib import Path

          service_path = Path("backend/app/services/automations.py")
          source = service_path.read_text(encoding="utf-8")

          old_reminder = '''    if rule_key == "appointment_reminder_6h":
              return (
                  f"أهلًا {data['patient_name']} 👋 بفكرك بموعدك لـ{data['service_name']} "
                  f"النهارده الساعة {data['time']} في {data['branch_name']}، فاضل حوالي 6 ساعات. "
                  "مستنيينك 💛"
              )'''
          new_reminder = '''    if rule_key == "appointment_reminder_6h":
              return (
                  f"أهلًا {data['patient_name']} 👋 بفكرك بموعدك لـ{data['service_name']} "
                  f"يوم {data['date']} الساعة {data['time']}. "
                  "لو محتاجة تعدّلي الموعد ابعتيلي هنا."
              )'''
          assert source.count(old_reminder) == 1, "reminder copy changed unexpectedly"
          source = source.replace(old_reminder, new_reminder, 1)

          old_post = '''    if rule_key == "post_visit_followup":
              return (
                  f"إزيك {data['patient_name']}؟ حبيت أطمن عليكي بعد {data['service_name']} "
                  f"اللي كانت يوم {data['date']}. كل حاجة تمام؟"
              )'''
          new_post = '''    if rule_key == "post_visit_followup":
              return (
                  f"إزيك {data['patient_name']}؟ حبيت أطمن عليكي بعد {data['service_name']} "
                  f"اللي كانت يوم {data['date']}. كل حاجة تمام؟ "
                  "لو محتاجة مساعدة أو حابة تحجزي الجلسة الجاية ابعتيلي هنا، "
                  "ويسعدنا نعرف تقييمك للجلسة."
              )'''
          assert source.count(old_post) == 1, "post-visit copy changed unexpectedly"
          source = source.replace(old_post, new_post, 1)

          old_params = '''    if rule_key == "appointment_reminder_6h":
              return [patient_name, service_name, time, branch_name]'''
          new_params = '''    if rule_key == "appointment_reminder_6h":
              return [patient_name, service_name, date, time]'''
          assert source.count(old_params) == 1, "reminder template variables changed unexpectedly"
          source = source.replace(old_params, new_params, 1)
          service_path.write_text(source, encoding="utf-8")

          actions_path = Path("frontend/src/app/(dashboard)/automations/actions.ts")
          actions = actions_path.read_text(encoding="utf-8")
          start = actions.find("export async function saveAutomationTemplates")
          end = actions.find("export async function retryAutomationJob", start)
          assert start != -1 and end != -1, "template action block not found"
          actions = actions[:start] + actions[end:]
          actions_path.write_text(actions, encoding="utf-8")

          docs_path = Path("n8n/AUTOMATIONS_SETUP.md")
          docs = docs_path.read_text(encoding="utf-8")
          docs = docs.replace(
              "- appointment reminder: customer name, service, appointment time, clinic name.",
              "- appointment reminder: customer name, service, appointment date, appointment time.",
          )
          docs_path.write_text(docs, encoding="utf-8")

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Backend quality gate
        working-directory: backend
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          SUPABASE_SECRET_KEY: sb_secret_ci_dummy
        run: |
          ruff check app tests alembic
          python -m compileall -q app tests
          python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend quality gate
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          TIA_API_URL: http://127.0.0.1:8000
        run: |
          npm run lint
          npx next typegen
          npm run typecheck
          npm run build

      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/automations.py 'frontend/src/app/(dashboard)/automations/actions.ts' n8n/AUTOMATIONS_SETUP.md
          git diff --cached --check
          git commit -m "feat: finalize configurable automation core"
          git push origin HEAD:feat/core-product-hardening
