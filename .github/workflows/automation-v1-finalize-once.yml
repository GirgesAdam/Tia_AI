name: Automation V1 finalize once

on:
  push:
    branches: [feat/core-product-hardening]
    paths:
      - .github/workflows/automation-v1-finalize-once.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/core-product-hardening
          fetch-depth: 0

      - name: Finalize automation copy and simplify admin actions
        shell: python
        run: |
          from pathlib import Path
          import re

          service_path = Path("backend/app/services/automations.py")
          source = service_path.read_text(encoding="utf-8")

          reminder_pattern = re.compile(
              r'    if rule_key == "appointment_reminder_6h":\n'
              r'        return \(\n'
              r'.*?'
              r'        \)\n'
              r'    # Legacy rules',
              re.S,
          )
          reminder_replacement = (
              '    if rule_key == "appointment_reminder_6h":\n'
              '        return (\n'
              '            f"أهلًا {data[\'patient_name\']} 👋 بفكرك بموعدك لـ{data[\'service_name\']} "\n'
              '            f"يوم {data[\'date\']} الساعة {data[\'time\']}. "\n'
              '            "لو محتاجة تعدّلي الموعد ابعتيلي هنا."\n'
              '        )\n'
              '    # Legacy rules'
          )
          source, reminder_count = reminder_pattern.subn(reminder_replacement, source, count=1)
          assert reminder_count == 1, "reminder block changed unexpectedly"

          post_pattern = re.compile(
              r'    if rule_key == "post_visit_followup":\n'
              r'        return \(\n'
              r'.*?'
              r'        \)\n'
              r'    if rule_key == "no_show_followup":',
              re.S,
          )
          post_replacement = (
              '    if rule_key == "post_visit_followup":\n'
              '        return (\n'
              '            f"إزيك {data[\'patient_name\']}؟ حبيت أطمن عليكي بعد {data[\'service_name\']} "\n'
              '            f"اللي كانت يوم {data[\'date\']}. كل حاجة تمام؟ "\n'
              '            "لو محتاجة مساعدة أو حابة تحجزي الجلسة الجاية ابعتيلي هنا، "\n'
              '            "ويسعدنا نعرف تقييمك للجلسة."\n'
              '        )\n'
              '    if rule_key == "no_show_followup":'
          )
          source, post_count = post_pattern.subn(post_replacement, source, count=1)
          assert post_count == 1, "post-visit block changed unexpectedly"

          old_params = "return [patient_name, service_name, time, branch_name]"
          assert source.count(old_params) == 1, "reminder template variables changed unexpectedly"
          source = source.replace(old_params, "return [patient_name, service_name, date, time]", 1)
          service_path.write_text(source, encoding="utf-8")

          actions_path = Path("frontend/src/app/(dashboard)/automations/actions.ts")
          actions = actions_path.read_text(encoding="utf-8")
          start = actions.find("export async function saveAutomationTemplates")
          end = actions.find("export async function retryAutomationJob", start)
          assert start != -1 and end != -1, "template action block not found"
          actions = actions[:start] + actions[end:]
          actions_path.write_text(actions, encoding="utf-8")

          docs_path = Path("n8n/AUTOMATIONS_SETUP.md")
          docs = docs_path.read_text(encoding="utf-8")
          old_contract = "- appointment reminder: customer name, service, appointment time, clinic name."
          if old_contract in docs:
              docs = docs.replace(
                  old_contract,
                  "- appointment reminder: customer name, service, appointment date, appointment time.",
              )
          docs_path.write_text(docs, encoding="utf-8")

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Backend quality gate
        working-directory: backend
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          SUPABASE_SECRET_KEY: sb_secret_ci_dummy
        run: |
          ruff check app tests alembic
          python -m compileall -q app tests
          python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend quality gate
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          TIA_API_URL: http://127.0.0.1:8000
        run: |
          npm run lint
          npx next typegen
          npm run typecheck
          npm run build

      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/automations.py 'frontend/src/app/(dashboard)/automations/actions.ts' n8n/AUTOMATIONS_SETUP.md
          git diff --cached --check
          git commit -m "feat: finalize configurable automation core"
          git push origin HEAD:feat/core-product-hardening
