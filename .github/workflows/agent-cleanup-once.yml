name: Agent Cleanup Once

on:
  push:
    branches:
      - feat/core-product-hardening
    paths:
      - .github/workflows/agent-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply cleanup
        run: python scripts/apply_agent_cleanup_once.py
      - name: Compile changed runtime
        run: |
          python -m py_compile app/agents/turn_models.py
          python -m py_compile app/agents/turn_interpreter.py
          python -m py_compile app/agents/semantic_router.py
          python -m py_compile app/agents/flow_interpreter.py
          python -m py_compile app/services/agent_chat.py
          python -m py_compile scripts/run_live_agent_ux_review.py
      - name: Format changed runtime imports
        run: |
          ruff check --fix \
            app/agents/turn_models.py \
            app/agents/turn_interpreter.py \
            app/agents/semantic_router.py \
            app/agents/flow_interpreter.py \
            app/services/agent_chat.py \
            tests/test_unified_turn_interpreter_architecture.py
      - name: Ruff changed runtime
        run: |
          ruff check \
            app/agents/turn_models.py \
            app/agents/turn_interpreter.py \
            app/agents/semantic_router.py \
            app/agents/flow_interpreter.py \
            app/services/agent_chat.py \
            tests/test_unified_turn_interpreter_architecture.py
      - name: Focused no-LLM regression tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_unified_turn_interpreter_architecture.py \
            tests/test_agent_production_contract.py \
            tests/test_agent_natural_availability.py \
            tests/test_agent_package_semantics_contract.py \
            tests/test_agent_e2e_matrix_runner.py
      - name: Diff check
        working-directory: .
        run: git diff --check
      - name: Commit cleanup
        working-directory: .
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(agent): keep one semantic interpreter [skip ci]"
          git push origin HEAD:feat/core-product-hardening
