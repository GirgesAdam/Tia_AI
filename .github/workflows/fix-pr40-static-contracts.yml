name: Fix PR40 Static Contracts

on:
  push:
    branches:
      - test/realistic-system-journeys-v1
    paths:
      - .github/workflows/fix-pr40-static-contracts.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/realistic-system-journeys-v1
          fetch-depth: 0
      - name: Restore compact prompt contract markers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/agents/turn_interpreter.py')
          text = path.read_text(encoding='utf-8')
          old_time = 'Resolve relative dates/times from the clinic clock.'
          new_time = 'Resolve clear relative dates/times from the clinic clock.'
          old_header = 'FRESH BOOKING AND RESCHEDULE'
          new_header = 'FRESH BOOKING, RESCHEDULE, AND EXISTING APPOINTMENT EDITS'
          if old_time not in text:
              raise RuntimeError('relative-time prompt anchor not found')
          if old_header not in text:
              raise RuntimeError('existing-edit prompt anchor not found')
          text = text.replace(old_time, new_time, 1)
          text = text.replace(old_header, new_header, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify affected tests
        working-directory: backend
        run: |
          python -m pytest tests/test_realtime_recovery.py tests/test_service_edit_doctor_calendar_contract.py -q
      - name: Commit fixes
        run: |
          git config user.name "Tia CI"
          git config user.email "tia-ci@users.noreply.github.com"
          git add backend/app/agents/turn_interpreter.py
          git commit -m "Restore compact semantic contract markers"
          git push origin HEAD:test/realistic-system-journeys-v1
