name: Apply 0068 Production Migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-0068-production.yml

permissions:
  contents: read

jobs:
  migrate:
    name: Apply grouped-visit schema to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: production
      DEBUG: "false"
      DOCS_ENABLED: "false"
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CORS_ORIGINS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Verify production migration secret
        shell: bash
        run: test -n "$MIGRATION_DATABASE_URL" || { echo "MIGRATION_DATABASE_URL is missing"; exit 1; }
      - name: Show current revision
        run: python -m alembic current
      - name: Apply migration head
        run: python -m alembic upgrade head
      - name: Verify 0068 is current
        shell: bash
        run: python -m alembic current | grep -q "0068_visit_group_id (head)"
