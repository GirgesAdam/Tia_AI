name: Patch verified reschedule confirmation

on:
  push:
    branches: [feat/core-product-hardening]
    paths: [.github/workflows/patch-reschedule-confirmation.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/core-product-hardening

      - name: Wire verified reschedule confirmation
        run: |
          python - <<'PY'
          from pathlib import Path

          chat = Path('backend/app/services/agent_chat.py')
          text = chat.read_text(encoding='utf-8')

          old = '''    format_handoff_reply,
              format_verified_tool_fallback,'''
          new = '''    format_handoff_reply,
              format_reschedule_success,
              format_verified_tool_fallback,'''
          if old not in text:
              raise SystemExit('semantic_actions import marker not found')
          text = text.replace(old, new, 1)

          tag = '"flow-interpreter:deterministic-reschedule",'
          tag_index = text.find(tag)
          if tag_index < 0:
              raise SystemExit('deterministic reschedule tag not found')
          block_start = text.rfind('    return (', 0, tag_index)
          block_end = text.find('\n    )', tag_index)
          if block_start < 0 or block_end < 0:
              raise SystemExit('deterministic reschedule return block not found')
          block_end += len('\n    )')
          old_block = text[block_start:block_end]
          new_block = '''    appointment = result.get("appointment")
          reschedule_reply = (
              format_reschedule_success(appointment)
              if isinstance(appointment, dict)
              else "تمام، الموعد اتغيّر للميعاد الجديد بنجاح."
          )
          return (
              reschedule_reply,
              "flow-interpreter:deterministic-reschedule",
          )'''
          text = text[:block_start] + new_block + text[block_end:]
          chat.write_text(text, encoding='utf-8')

          test = Path('backend/tests/test_agent_customer_presentation.py')
          test.write_text('''from pathlib import Path\n\nfrom app.agents.availability_presentation import format_availability_windows_reply\nfrom app.agents.semantic_actions import format_reschedule_success\n\n\ndef test_availability_uses_neutral_doctor_wording() -> None:\n    reply = format_availability_windows_reply(\n        {\n            "ok": True,\n            "date": "2026-09-05",\n            "availability_windows": [\n                {\n                    "doctor_name": "مريم حسن",\n                    "start_local": "2026-09-05T15:00:00+03:00",\n                    "end_local": "2026-09-05T18:00:00+03:00",\n                }\n            ],\n        },\n        booking_authorized=False,\n    )\n\n    assert reply is not None\n    assert "المتاح مع مريم حسن من 3 م لـ6 م." in reply\n    assert "مريم حسن متاح" not in reply\n\n\ndef test_reschedule_confirmation_uses_verified_details() -> None:\n    reply = format_reschedule_success(\n        {\n            "doctor": "نور علي",\n            "start_local": "2026-09-05T17:00:00+03:00",\n        }\n    )\n\n    assert reply == "تمام، الموعد اتغيّر ليوم 05/09/2026 الساعة 5 م مع نور علي."\n\n\ndef test_structured_reschedule_uses_verified_detail_formatter() -> None:\n    backend = Path(__file__).resolve().parent.parent\n    source = (backend / "app/services/agent_chat.py").read_text(encoding="utf-8")\n\n    assert "format_reschedule_success(appointment)" in source\n''', encoding='utf-8')
          PY

      - name: Validate patch without dependencies
        run: |
          python -m py_compile backend/app/agents/semantic_actions.py backend/app/services/agent_chat.py backend/tests/test_agent_customer_presentation.py
          grep -q 'format_reschedule_success(appointment)' backend/app/services/agent_chat.py
          grep -q 'المتاح مع' backend/app/agents/availability_presentation.py

      - name: Remove patch workflow and commit
        run: |
          rm .github/workflows/patch-reschedule-confirmation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/agent_chat.py backend/tests/test_agent_customer_presentation.py .github/workflows/patch-reschedule-confirmation.yml
          git diff --cached --check
          git commit -m "fix(agent): confirm reschedules with verified details"
          git push origin HEAD:feat/core-product-hardening
