name: Finalize PR11 Cleanup

on:
  push:
    branches:
      - test/daily-clinic-conversation-review
    paths:
      - .github/scripts/finalize-pr11-cleanup-once.py
      - .github/workflows/finalize-pr11-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/daily-clinic-conversation-review
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply final cleanup
        run: python .github/scripts/finalize-pr11-cleanup-once.py
      - name: Remove one-shot cleanup helper
        run: |
          rm .github/scripts/finalize-pr11-cleanup-once.py
          rm .github/workflows/finalize-pr11-cleanup-once.yml
      - name: Commit clean PR state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize clinic conversation review fixes"
          git push origin HEAD:test/daily-clinic-conversation-review
