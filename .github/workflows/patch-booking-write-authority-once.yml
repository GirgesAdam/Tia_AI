name: Apply Booking Write Authority Patch

on:
  push:
    branches:
      - test/daily-clinic-conversation-review
    paths:
      - .github/scripts/patch-booking-write-authority-once.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/daily-clinic-conversation-review
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded patch
        run: python .github/scripts/patch-booking-write-authority-once.py
      - name: Remove one-shot patcher
        run: |
          rm .github/scripts/patch-booking-write-authority-once.py
          rm .github/workflows/patch-booking-write-authority-once.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/agent_chat.py .github/scripts/patch-booking-write-authority-once.py .github/workflows/patch-booking-write-authority-once.yml
          git commit -m "Require latest-turn booking write authority"
          git push origin HEAD:test/daily-clinic-conversation-review
