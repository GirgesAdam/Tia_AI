name: Verify Message Timestamp Ordering

on:
  push:
    branches:
      - test/realistic-system-journeys-v1
    paths:
      - .github/workflows/apply-realistic-source-patch.yml

permissions:
  contents: read

env:
  ENVIRONMENT: staging
  DEBUG: "false"
  DOCS_ENABLED: "false"
  DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_timestamp_audit_unused
  SUPABASE_SECRET_KEY: sb_secret_timestamp_audit_unused
  CORS_ORIGINS: ""

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/realistic-system-journeys-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prove PostgreSQL transaction timestamp behavior
        run: |
          python - <<'PY'
          import json
          import time
          from sqlalchemy import create_engine, text
          from app.core.config import settings

          engine = create_engine(settings.database_url, pool_pre_ping=True)
          with engine.connect() as conn:
              tx = conn.begin()
              first = conn.execute(text("select now() as tx_now, clock_timestamp() as wall_now")).mappings().one()
              time.sleep(0.25)
              second = conn.execute(text("select now() as tx_now, clock_timestamp() as wall_now")).mappings().one()
              print(json.dumps({
                  "first_tx_now": first["tx_now"],
                  "second_tx_now": second["tx_now"],
                  "tx_now_equal": first["tx_now"] == second["tx_now"],
                  "first_wall_now": first["wall_now"],
                  "second_wall_now": second["wall_now"],
                  "wall_now_equal": first["wall_now"] == second["wall_now"],
              }, default=str, indent=2))
              assert first["tx_now"] == second["tx_now"]
              assert first["wall_now"] != second["wall_now"]
              tx.rollback()
          engine.dispose()
          PY
      - name: Verify agent message creation does not set created_at explicitly
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('app/services/agent_chat.py').read_text(encoding='utf-8')
          inbound = source[source.index('    inbound = Message('):]
          inbound = inbound[:inbound.index('    db.add(inbound)')]
          outbound = source[source.index('    outbound = Message('):]
          outbound = outbound[:outbound.index('    db.add(outbound)')]
          print('inbound explicit created_at:', 'created_at=' in inbound)
          print('outbound explicit created_at:', 'created_at=' in outbound)
          assert 'created_at=' not in inbound
          assert 'created_at=' not in outbound
          PY
