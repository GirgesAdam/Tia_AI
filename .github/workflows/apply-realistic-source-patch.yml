name: Semantic Context Size Audit

on:
  push:
    branches:
      - test/realistic-system-journeys-v1
    paths:
      - .github/workflows/apply-realistic-source-patch.yml

permissions:
  contents: read

env:
  ENVIRONMENT: staging
  DEBUG: "false"
  DOCS_ENABLED: "false"
  DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_context_audit_unused
  SUPABASE_SECRET_KEY: sb_secret_context_audit_unused
  CORS_ORIGINS: ""

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/realistic-system-journeys-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Audit semantic context without model calls
        run: |
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          import tiktoken
          from sqlalchemy import create_engine, select
          from sqlalchemy.orm import Session

          from app.agents.clinic_grounding import build_clinic_catalog
          from app.agents.turn_interpreter import _interpreter_system_prompt, _semantic_catalog_for_single_location
          from app.core.config import settings
          from app.models.workspace import Workspace
          from app.services.agent_chat import _with_current_patient_appointments
          from scripts.run_realistic_system_journeys import HYDRA, UNDERARM, _find_slot, _new_patient, _seed_appointment

          enc = tiktoken.get_encoding('o200k_base')
          def measure(value):
              text = value if isinstance(value, str) else json.dumps(value, ensure_ascii=False, default=str, separators=(',', ':'))
              return {'chars': len(text), 'estimated_tokens': len(enc.encode(text))}

          engine = create_engine(settings.database_url, pool_pre_ping=True)
          connection = engine.connect()
          outer = connection.begin()
          db = Session(bind=connection, join_transaction_mode='create_savepoint', expire_on_commit=False)
          try:
              workspace = db.scalar(select(Workspace).where(Workspace.slug == 'tia'))
              if workspace is None:
                  raise RuntimeError('Workspace not found')
              patient = _new_patient(db, workspace, 9920)
              laser_slot = _find_slot(db, workspace, UNDERARM, laser_device_key='prime_lase')
              laser = _seed_appointment(db, workspace, patient, laser_slot)
              hydra_slot = _find_slot(db, workspace, HYDRA, avoid=[(laser.start_at, laser.end_at)])
              _seed_appointment(db, workspace, patient, hydra_slot)

              catalog = build_clinic_catalog(db, workspace)
              catalog = _with_current_patient_appointments(
                  db=db, workspace=workspace, patient=patient, clinic_catalog=catalog
              )
              semantic = _semantic_catalog_for_single_location(catalog)
              system_prompt = _interpreter_system_prompt(
                  timezone_name=workspace.timezone,
                  local_now=datetime.now(UTC),
                  active_flow=False,
              )
              per_key = {}
              for key, value in semantic.items():
                  item = measure(value)
                  item['count'] = len(value) if isinstance(value, list) else None
                  per_key[key] = item
              print(json.dumps({
                  'openai_calls': 0,
                  'system_prompt': measure(system_prompt),
                  'semantic_catalog_total': measure(semantic),
                  'catalog_sections': per_key,
                  'latest_customer_example': measure('قصدي معاد الهيدرافيشل، سيب معاد الليزر زي ما هو.'),
              }, ensure_ascii=False, indent=2))
          finally:
              db.close()
              if outer.is_active:
                  outer.rollback()
              connection.close()
              engine.dispose()
          PY
