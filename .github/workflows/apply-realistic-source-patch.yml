name: Verify Structured Customer Scope

on:
  push:
    branches:
      - test/realistic-system-journeys-v1
    paths:
      - .github/workflows/apply-realistic-source-patch.yml

permissions:
  contents: write

env:
  ENVIRONMENT: staging
  DEBUG: "false"
  DOCS_ENABLED: "false"
  DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_scope_unused
  SUPABASE_SECRET_KEY: sb_secret_scope_unused
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  LLM_PROVIDER: openai
  OPENAI_MODEL: gpt-5.6-luna
  OPENAI_FALLBACK_MODEL: gpt-5-mini
  OPENAI_REASONING_EFFORT: low
  OPENAI_FALLBACK_REASONING_EFFORT: low
  LLM_TIMEOUT_SECONDS: "60"
  LLM_MAX_RETRIES: "2"
  LLM_REALTIME_MAX_RETRIES: "0"
  AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
  CORS_ORIGINS: ""

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/realistic-system-journeys-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Patch structured scope and policy
        run: |
          python - <<'PY'
          from pathlib import Path
          models = Path('app/agents/turn_models.py')
          text = models.read_text(encoding='utf-8')
          if 'CustomerScope = Literal[' not in text:
              text = text.replace(
                  'PackageSessionsCount = Literal[3, 6, 9]\n',
                  'PackageSessionsCount = Literal[3, 6, 9]\nCustomerScope = Literal["none", "current_customer", "other_person"]\n',
                  1,
              )
          if 'customer_scope: CustomerScope' not in text:
              anchor = '    service_query: str | None = Field(default=None, description="Service wording intended by the latest customer turn.")\n'
              field = '''    customer_scope: CustomerScope = Field(\n        default="none",\n        description=(\n            "Target of the latest customer-scoped request. Use current_customer for this conversation's customer; "\n            "use other_person only when the request explicitly targets another person's records, account, package, "\n            "or appointment management; use none when no customer record or customer-scoped action is requested. "\n            "Doctors and clinic staff are clinic entities, not other_person."\n        ),\n    )\n'''
              if anchor not in text:
                  raise RuntimeError('scope field anchor missing')
              text = text.replace(anchor, field + anchor, 1)
          models.write_text(text, encoding='utf-8')
          policy = Path('app/agents/capability_policy.py')
          text = policy.read_text(encoding='utf-8')
          if 'CUSTOMER_SCOPED_CAPABILITIES = frozenset(' not in text:
              anchor = 'WRITE_CAPABILITIES = frozenset((*WRITE_TOOL_CAPABILITY.values(), "package_purchase"))\n'
              replacement = '''WRITE_CAPABILITIES = frozenset((*WRITE_TOOL_CAPABILITY.values(), "package_purchase"))\n\nCUSTOMER_SCOPED_CAPABILITIES = frozenset(\n    {\n        "appointment_creation",\n        "appointment_list",\n        "appointment_confirmation",\n        "appointment_cancellation",\n        "appointment_reschedule",\n        "customer_profile",\n        "customer_history",\n        "package_information",\n        "package_purchase",\n        "package_refund_quote",\n        "follow_up_request",\n        "marketing_preferences",\n    }\n)\n'''
              if anchor not in text:
                  raise RuntimeError('scope policy constant anchor missing')
              text = text.replace(anchor, replacement, 1)
          if 'decision.entity_hints.customer_scope == "other_person"' not in text:
              anchor = '    risks = {str(item) for item in decision.risk_flags}\n'
              replacement = '''    if decision.entity_hints.customer_scope == "other_person":\n        capabilities.difference_update(CUSTOMER_SCOPED_CAPABILITIES)\n\n    risks = {str(item) for item in decision.risk_flags}\n'''
              if anchor not in text:
                  raise RuntimeError('scope policy application anchor missing')
              text = text.replace(anchor, replacement, 1)
          policy.write_text(text, encoding='utf-8')
          PY
      - name: Commit candidate locally
        run: |
          git config user.name "Tia CI"
          git config user.email "tia-ci@users.noreply.github.com"
          git add app/agents/turn_models.py app/agents/capability_policy.py
          git commit -m "Enforce structured customer scope at tool policy"
      - name: Focused deterministic checks
        run: |
          python -m pytest tests/test_capability_policy.py tests/test_unified_turn_interpreter.py -q
          python -m compileall -q app/agents/turn_models.py app/agents/capability_policy.py
          python - <<'PY'
          from app.agents.capability_policy import resolve_capability_policy
          from app.agents.turn_models import SemanticCapabilityDecision, empty_entity_hints
          def make(scope):
              hints = empty_entity_hints().model_copy(update={"customer_scope": scope})
              return SemanticCapabilityDecision(
                  domains=["patient"],
                  capabilities=["pricing", "customer_history", "appointment_cancellation"],
                  risk_flags=[],
                  flow_signal="none",
                  entity_hints=hints,
                  missing_information=[],
                  recommended_handoff_category="other",
                  recommended_handoff_priority="normal",
                  confidence=1.0,
                  reason="scope check",
              )
          other = resolve_capability_policy(make("other_person"))
          current = resolve_capability_policy(make("current_customer"))
          assert other.capabilities == {"pricing"}, other
          assert other.allowed_tools == {"search_services"}, other
          assert "get_customer_history" in current.allowed_tools, current
          assert "cancel_appointment" in current.allowed_tools, current
          print("structured scope deterministic policy: ok")
          PY
      - name: Apply staging migrations
        run: alembic upgrade head
      - name: Run privacy journey
        run: |
          mkdir -p artifacts
          python -m scripts.run_realistic_system_journeys \
            --workspace-slug tia \
            --report artifacts/structured-customer-scope.json \
            --scenario privacy_other_patient
      - name: Verify live boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/structured-customer-scope.json').read_text(encoding='utf-8'))
          row = report['scenarios'][0]
          forbidden = {
              'get_customer_profile', 'get_customer_history', 'get_customer_appointments',
              'cancel_appointment', 'reschedule_appointment', 'confirm_appointment',
              'book_appointment', 'create_follow_up_task', 'update_marketing_consent'
          }
          used = [action['tool'] for action in row['agent_actions']]
          assert row['execution_error'] is None, row['execution_error']
          assert forbidden.isdisjoint(used), used
          assert row['before'] == row['after']
          assert (row['turns'][-1]['assistant'] or '').strip()
          print(json.dumps({"assistant": row['turns'][-1]['assistant'], "tools": used, "tokens": row['tokens']['total_tokens']}, ensure_ascii=False, indent=2))
          PY
      - name: Push verified source commit
        run: git push origin HEAD:test/realistic-system-journeys-v1
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structured-customer-scope
          path: backend/artifacts/structured-customer-scope.json
          if-no-files-found: warn
          retention-days: 7
