name: Semantic Catalog Field Audit

on:
  push:
    branches:
      - test/realistic-system-journeys-v1
    paths:
      - .github/workflows/apply-realistic-source-patch.yml

permissions:
  contents: read

env:
  ENVIRONMENT: staging
  DEBUG: "false"
  DOCS_ENABLED: "false"
  DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_catalog_audit_unused
  SUPABASE_SECRET_KEY: sb_secret_catalog_audit_unused
  CORS_ORIGINS: ""

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/realistic-system-journeys-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Audit service and doctor field weight without model calls
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          import tiktoken
          from sqlalchemy import create_engine, select
          from sqlalchemy.orm import Session
          from app.agents.clinic_grounding import build_clinic_catalog
          from app.agents.turn_interpreter import _semantic_catalog_for_single_location
          from app.core.config import settings
          from app.models.workspace import Workspace

          enc = tiktoken.get_encoding('o200k_base')
          def tokens(value):
              return len(enc.encode(json.dumps(value, ensure_ascii=False, default=str, separators=(',', ':'))))

          engine = create_engine(settings.database_url, pool_pre_ping=True)
          with Session(engine) as db:
              workspace = db.scalar(select(Workspace).where(Workspace.slug == 'tia'))
              catalog = _semantic_catalog_for_single_location(build_clinic_catalog(db, workspace))
              output = {'openai_calls': 0}
              for section in ('services', 'doctors'):
                  rows = [r for r in (catalog.get(section) or []) if isinstance(r, dict)]
                  keys = sorted({k for r in rows for k in r})
                  field_weights = {}
                  for key in keys:
                      field_weights[key] = tokens([{key: r.get(key)} for r in rows if key in r])
                  output[section] = {
                      'count': len(rows),
                      'row_keys': keys,
                      'field_estimated_tokens': dict(sorted(field_weights.items(), key=lambda x: x[1], reverse=True)),
                      'sample': rows[0] if rows else None,
                      'total_estimated_tokens': tokens(rows),
                  }
              print(json.dumps(output, ensure_ascii=False, indent=2, default=str))
          engine.dispose()
          PY
