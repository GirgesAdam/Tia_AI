name: Apply Realistic Source Patch

on:
  push:
    branches:
      - test/realistic-system-journeys-v1
    paths:
      - .github/workflows/apply-realistic-source-patch.yml

permissions:
  contents: write

env:
  ENVIRONMENT: staging
  DEBUG: "false"
  DOCS_ENABLED: "false"
  DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_realistic_journey_unused
  SUPABASE_SECRET_KEY: sb_secret_realistic_journey_unused
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  LLM_PROVIDER: openai
  OPENAI_MODEL: gpt-5.6-luna
  OPENAI_FALLBACK_MODEL: gpt-5-mini
  OPENAI_REASONING_EFFORT: low
  OPENAI_FALLBACK_REASONING_EFFORT: low
  LLM_TIMEOUT_SECONDS: "60"
  LLM_MAX_RETRIES: "2"
  LLM_REALTIME_MAX_RETRIES: "0"
  AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
  CORS_ORIGINS: ""

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/realistic-system-journeys-v1
      - name: Apply focused execution patch
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/services/agent_chat.py")
          text = path.read_text(encoding="utf-8")
          old = '''            flow = start_flow(\n                db,\n                workspace_id=workspace.id,\n                conversation_id=conversation.id,\n                patient_id=patient.id,\n                flow_type=flow_type,\n                capabilities=_persistent_flow_capabilities(flow_type, policy.capabilities),\n                entity_state=initial_entity_state,\n                missing_information=semantic_decision.missing_information,\n                last_decision=_decision_payload(semantic_decision),\n                run_id=run_id,\n            )\n'''
          new = old + '''            # A fresh reschedule still belongs to this same interpreted customer turn.\n            # Preserve the structured write authorization so the verified exact-slot\n            # path can execute without forcing a redundant second confirmation.\n            if flow_type == "appointment_reschedule":\n                flow_turn = unified_turn.as_flow_turn_decision().model_copy(\n                    update={\n                        "capabilities": list(semantic_decision.capabilities),\n                        "package_intent": semantic_decision.package_intent,\n                        "entity_hints": semantic_decision.entity_hints,\n                    }\n                )\n                turn_local_side_read = _turn_is_local_side_read(flow, flow_turn)\n'''
          if old not in text:
              raise SystemExit("Fresh-flow anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify staging secrets
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$DATABASE_URL"
      - name: Apply staging migrations
        run: alembic upgrade head
      - name: Focused unit tests
        run: python -m pytest tests/test_clinic_grounding_compatibility.py tests/test_unified_turn_interpreter.py -q
      - name: Verify paid reschedule only
        run: |
          python -m scripts.run_realistic_system_journeys \
            --workspace-slug tia \
            --report artifacts/realistic-system-journeys.json \
            --scenario paid_reschedule_no_double_charge
      - name: Upload manual-review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realistic-paid-reschedule-execution-fix
          path: backend/artifacts/realistic-system-journeys.json
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified execution patch
        if: success()
        working-directory: .
        run: |
          git config user.name "Girges Ezzat"
          git config user.email "girgesadam1@gmail.com"
          git add backend/app/services/agent_chat.py
          git diff --cached --quiet && exit 0
          git commit -m "Execute authorized fresh reschedules after verification"
          git push origin HEAD:test/realistic-system-journeys-v1
