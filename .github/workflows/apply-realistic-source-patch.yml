name: Verify Compound Item Laser Device Isolation

on:
  push:
    branches:
      - test/realistic-system-journeys-v1
    paths:
      - .github/workflows/apply-realistic-source-patch.yml

permissions:
  contents: write

concurrency:
  group: verify-compound-device-isolation
  cancel-in-progress: true

env:
  ENVIRONMENT: staging
  DEBUG: "false"
  DOCS_ENABLED: "false"
  DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_compound_fix_unused
  SUPABASE_SECRET_KEY: sb_secret_compound_fix_unused
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  LLM_PROVIDER: openai
  OPENAI_MODEL: gpt-5.6-luna
  OPENAI_FALLBACK_MODEL: gpt-5-mini
  OPENAI_REASONING_EFFORT: low
  OPENAI_FALLBACK_REASONING_EFFORT: low
  LLM_TIMEOUT_SECONDS: "60"
  LLM_MAX_RETRIES: "2"
  LLM_REALTIME_MAX_RETRIES: "0"
  AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
  CORS_ORIGINS: ""

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/realistic-system-journeys-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply deterministic compound device grounding
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/services/compound_customer_requests.py')
          text = path.read_text(encoding='utf-8')

          helper_sentinel = 'def _catalog_service_laser_policy('
          if helper_sentinel not in text:
              anchor = '''    return None\n\n\ndef ground_compound_requested_items(\n'''
              helper = '''    return None\n\n\ndef _catalog_service_laser_policy(\n    catalog: dict[str, object],\n    service_id: str | None,\n) -> tuple[bool | None, set[str]]:\n    \"\"\"Return canonical laser requirements for one grounded service.\n\n    None means the catalog row does not expose laser metadata, so grounding\n    leaves the item unchanged rather than guessing.\n    \"\"\"\n    if not service_id:\n        return None, set()\n    rows = catalog.get(\"services\")\n    if not isinstance(rows, list):\n        return None, set()\n    for row in rows:\n        if not isinstance(row, dict) or str(row.get(\"id\") or \"\") != str(service_id):\n            continue\n        if \"requires_laser_device\" not in row:\n            return None, set()\n        requires_laser_device = bool(row.get(\"requires_laser_device\"))\n        raw_devices = row.get(\"laser_devices\")\n        allowed_devices: set[str] = set()\n        if isinstance(raw_devices, list):\n            for device in raw_devices:\n                if not isinstance(device, dict):\n                    continue\n                device_key = device.get(\"device_key\")\n                if device_key:\n                    allowed_devices.add(str(device_key))\n        return requires_laser_device, allowed_devices\n    return None, set()\n\n\ndef ground_compound_requested_items(\n'''
              if anchor not in text:
                  raise RuntimeError('compound helper insertion anchor not found')
              text = text.replace(anchor, helper, 1)

          grounding_sentinel = 'requires_laser_device, allowed_laser_devices = _catalog_service_laser_policy('
          if grounding_sentinel not in text:
              anchor = '''        grounded.append(\n            item.model_copy(\n                update={\n                    \"service_id\": service_id,\n                    \"service_candidate_ids\": service_candidates,\n                    \"doctor_id\": doctor_id,\n                    \"doctor_candidate_ids\": doctor_candidates,\n                }\n            )\n        )\n'''
              replacement = '''        laser_device_key = item.laser_device_key\n        if service_id:\n            requires_laser_device, allowed_laser_devices = _catalog_service_laser_policy(\n                catalog,\n                service_id,\n            )\n            if requires_laser_device is False:\n                laser_device_key = None\n            elif (\n                requires_laser_device is True\n                and laser_device_key\n                and allowed_laser_devices\n                and str(laser_device_key) not in allowed_laser_devices\n            ):\n                laser_device_key = None\n\n        grounded.append(\n            item.model_copy(\n                update={\n                    \"service_id\": service_id,\n                    \"service_candidate_ids\": service_candidates,\n                    \"doctor_id\": doctor_id,\n                    \"doctor_candidate_ids\": doctor_candidates,\n                    \"laser_device_key\": laser_device_key,\n                }\n            )\n        )\n'''
              if anchor not in text:
                  raise RuntimeError('compound grounding anchor not found')
              text = text.replace(anchor, replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Add focused regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_compound_customer_requests.py')
          text = path.read_text(encoding='utf-8')
          sentinel = 'def test_grounding_strips_laser_device_from_non_laser_item()'
          if sentinel not in text:
              text += '''\n\ndef test_grounding_strips_laser_device_from_non_laser_item() -> None:\n    service_id = uuid4()\n    contaminated = _appointment(service_id, day=\"2026-09-12\", time=\"10:00\").model_copy(\n        update={\"laser_device_key\": \"candela_gentle\"}\n    )\n    catalog = {\n        \"services\": [\n            {\n                \"id\": str(service_id),\n                \"name\": \"Hydrafacial\",\n                \"requires_laser_device\": False,\n                \"laser_devices\": [],\n            }\n        ],\n        \"doctors\": [],\n    }\n\n    grounded = compound.ground_compound_requested_items([contaminated], catalog)\n    decision = compound.appointment_decision_from_item(_decision(grounded), grounded[0])\n    state = compound.appointment_item_state(\n        grounded[0],\n        remaining=[],\n        total=1,\n        completed=0,\n        catalog=catalog,\n    )\n\n    assert grounded[0].laser_device_key is None\n    assert decision.entity_hints.laser_device_key is None\n    assert \"laser_device_key\" not in state\n\n\ndef test_grounding_keeps_only_device_configured_for_laser_service() -> None:\n    service_id = uuid4()\n    catalog = {\n        \"services\": [\n            {\n                \"id\": str(service_id),\n                \"name\": \"Underarm Laser\",\n                \"requires_laser_device\": True,\n                \"laser_devices\": [{\"device_key\": \"prime_lase\"}],\n            }\n        ],\n        \"doctors\": [],\n    }\n    valid = _appointment(service_id, day=\"2026-09-12\", time=\"10:00\").model_copy(\n        update={\"laser_device_key\": \"prime_lase\"}\n    )\n    invalid = valid.model_copy(update={\"laser_device_key\": \"candela_gentle\"})\n\n    grounded_valid = compound.ground_compound_requested_items([valid], catalog)[0]\n    grounded_invalid = compound.ground_compound_requested_items([invalid], catalog)[0]\n\n    assert grounded_valid.laser_device_key == \"prime_lase\"\n    assert grounded_invalid.laser_device_key is None\n'''
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit candidate locally
        run: |
          git config user.name "Tia CI"
          git config user.email "tia-ci@users.noreply.github.com"
          git add app/services/compound_customer_requests.py tests/test_compound_customer_requests.py
          git commit -m "Keep laser devices local to compound items"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Focused tests
        run: |
          python -m pytest \
            tests/test_compound_customer_requests.py \
            tests/test_clinic_grounding_compatibility.py -q
          python -m compileall -q app/services/compound_customer_requests.py

      - name: Apply staging migrations
        run: alembic upgrade head

      - name: Run compound realistic journey
        run: |
          mkdir -p artifacts
          python -m scripts.run_realistic_system_journeys \
            --workspace-slug tia \
            --report artifacts/compound-device-isolation.json \
            --scenario compound_two_services

      - name: Verify compound DB behavior
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/compound-device-isolation.json').read_text(encoding='utf-8'))
          row = report['scenarios'][0]
          appointments = row['after']['appointments']
          booking_actions = [a for a in row['agent_actions'] if a['tool'] == 'book_appointment' and a['status'] == 'success']
          discovery_errors = [a for a in row['agent_actions'] if a['tool'] == 'get_booking_options' and a['status'] == 'error']

          assert row['execution_error'] is None, row['execution_error']
          assert len(appointments) == 2, appointments
          assert {a['service'] for a in appointments} == {'ليزر إزالة الشعر - إبط', 'هيدرافيشل'}, appointments
          hydra = next(a for a in appointments if a['service'] == 'هيدرافيشل')
          laser = next(a for a in appointments if a['service'] == 'ليزر إزالة الشعر - إبط')
          assert hydra['device'] is None, hydra
          assert laser['device'] == 'Candela Gentle', laser
          assert len(booking_actions) == 2, booking_actions
          assert discovery_errors == [], discovery_errors

          print(json.dumps({
              'source_commit': '${{ env.SOURCE_COMMIT }}',
              'assistant': row['turns'][-1]['assistant'],
              'appointments': appointments,
              'tokens': row['tokens']['total_tokens'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Push verified source commit
        run: git push origin HEAD:test/realistic-system-journeys-v1

      - name: Upload compound report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compound-device-isolation
          path: backend/artifacts/compound-device-isolation.json
          if-no-files-found: warn
          retention-days: 7
