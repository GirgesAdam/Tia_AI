name: Verify Isolated Ownership Handback

on:
  push:
    branches:
      - test/realistic-system-journeys-v1
    paths:
      - .github/workflows/apply-realistic-source-patch.yml

permissions:
  contents: write

env:
  ENVIRONMENT: staging
  DEBUG: "false"
  DOCS_ENABLED: "false"
  DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_ownership_isolated_unused
  SUPABASE_SECRET_KEY: sb_secret_ownership_isolated_unused
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  LLM_PROVIDER: openai
  OPENAI_MODEL: gpt-5.6-luna
  OPENAI_FALLBACK_MODEL: gpt-5-mini
  OPENAI_REASONING_EFFORT: low
  OPENAI_FALLBACK_REASONING_EFFORT: low
  LLM_TIMEOUT_SECONDS: "60"
  LLM_MAX_RETRIES: "2"
  LLM_REALTIME_MAX_RETRIES: "0"
  AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
  CORS_ORIGINS: ""

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/realistic-system-journeys-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Isolate handback from cross-owner context recall
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/run_realistic_system_journeys.py')
          text = path.read_text(encoding='utf-8')
          old = 'f"رجعت تاني، لو نفس الميعاد {slot.date_text} الساعة {slot.time_text} لسه متاح احجزهولي.",'
          new = 'f"رجعت تاني، عايز أحجز هيدرافيشل مع {slot.doctor_name} يوم {slot.date_text} الساعة {slot.time_text}.",'
          if old not in text:
              raise RuntimeError('handback message anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Ownership regression tests without model calls
        run: |
          python -m pytest \
            tests/test_handoff_resume_guard.py \
            tests/test_conversation_ownership_core.py \
            tests/test_conversation_ownership_hardening.py -q
          python -m compileall -q scripts/run_realistic_system_journeys.py
      - name: Run isolated human takeover journey
        run: |
          mkdir -p artifacts
          python -m scripts.run_realistic_system_journeys \
            --workspace-slug tia \
            --report artifacts/human-takeover-isolated.json \
            --scenario human_takeover_and_return
      - name: Verify silence and fresh-inbound booking
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/human-takeover-isolated.json').read_text(encoding='utf-8'))
          scenario = report['scenarios'][0]
          turns = scenario['turns']
          appointments = scenario['after']['appointments']
          bookings = [a for a in scenario['agent_actions'] if a['tool'] == 'book_appointment' and a['status'] == 'success']
          assert scenario['execution_error'] is None
          assert turns[1]['agent_paused'] is True
          assert turns[1]['tokens']['model_calls'] == 0
          assert turns[1]['assistant'] is None
          assert scenario['conversation']['owner_type'] == 'ai'
          assert scenario['conversation']['status'] == 'open'
          assert len(appointments) == 1, appointments
          assert appointments[0]['service'] == 'هيدرافيشل', appointments
          assert appointments[0]['status'] == 'confirmed', appointments
          assert len(bookings) == 1, bookings
          print(json.dumps({
              'turns': [{
                  'turn': row['turn'],
                  'assistant': row['assistant'],
                  'paused': row['agent_paused'],
                  'tokens': row['tokens']['total_tokens'],
              } for row in turns],
              'after': appointments,
              'bookings': len(bookings),
              'total_tokens': scenario['tokens']['total_tokens'],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Commit verified scenario isolation
        run: |
          git config user.name "Tia CI"
          git config user.email "tia-ci@users.noreply.github.com"
          git add scripts/run_realistic_system_journeys.py
          git diff --cached --quiet && exit 0
          git commit -m "Isolate handback behavior in realistic ownership journey"
          git push origin HEAD:test/realistic-system-journeys-v1
