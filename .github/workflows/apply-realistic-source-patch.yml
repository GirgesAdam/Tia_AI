name: Verify Production Ownership Journey

on:
  push:
    branches:
      - test/realistic-system-journeys-v1
    paths:
      - .github/workflows/apply-realistic-source-patch.yml

permissions:
  contents: write

env:
  ENVIRONMENT: staging
  DEBUG: "false"
  DOCS_ENABLED: "false"
  DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_ownership_journey_unused
  SUPABASE_SECRET_KEY: sb_secret_ownership_journey_unused
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  LLM_PROVIDER: openai
  OPENAI_MODEL: gpt-5.6-luna
  OPENAI_FALLBACK_MODEL: gpt-5-mini
  OPENAI_REASONING_EFFORT: low
  OPENAI_FALLBACK_REASONING_EFFORT: low
  LLM_TIMEOUT_SECONDS: "60"
  LLM_MAX_RETRIES: "2"
  LLM_REALTIME_MAX_RETRIES: "0"
  AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
  CORS_ORIGINS: ""

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/realistic-system-journeys-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Use production ownership functions in runner
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/run_realistic_system_journeys.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from app.services.agent_chat import run_agent_chat\n'
          new_import = 'from app.services.agent_chat import run_agent_chat\nfrom app.services.conversation_ownership import return_to_ai, transfer_to_human\n'
          if old_import not in text:
              raise RuntimeError('agent_chat import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_takeover = '''                conversation.owner_type = "human"\n                conversation.ownership_changed_at = datetime.now(UTC)\n                db.flush()\n'''
          new_takeover = '''                transfer_to_human(conversation)\n                db.flush()\n'''
          if old_takeover not in text:
              raise RuntimeError('takeover block anchor not found')
          text = text.replace(old_takeover, new_takeover, 1)

          old_return = '''                conversation.owner_type = "ai"\n                conversation.assigned_user_id = None\n                conversation.ownership_changed_at = datetime.now(UTC)\n                db.flush()\n'''
          new_return = '''                return_to_ai(conversation)\n                db.flush()\n'''
          if old_return not in text:
              raise RuntimeError('return block anchor not found')
          text = text.replace(old_return, new_return, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Ownership regression tests without model calls
        run: |
          python -m pytest \
            tests/test_handoff_resume_guard.py \
            tests/test_conversation_ownership_core.py \
            tests/test_conversation_ownership_hardening.py -q
          python -m compileall -q scripts/run_realistic_system_journeys.py
      - name: Run human takeover journey
        run: |
          mkdir -p artifacts
          python -m scripts.run_realistic_system_journeys \
            --workspace-slug tia \
            --report artifacts/human-takeover-production.json \
            --scenario human_takeover_and_return
      - name: Verify ownership behavior
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/human-takeover-production.json').read_text(encoding='utf-8'))
          scenario = report['scenarios'][0]
          turns = scenario['turns']
          assert scenario['execution_error'] is None, scenario['execution_error']
          assert len(turns) == 3, turns
          assert turns[1]['agent_paused'] is True, turns[1]
          assert turns[1]['tokens']['model_calls'] == 0, turns[1]['tokens']
          assert scenario['conversation']['owner_type'] == 'ai', scenario['conversation']
          assert scenario['conversation']['status'] == 'open', scenario['conversation']
          print(json.dumps({
              'turns': [{
                  'turn': row['turn'],
                  'assistant': row['assistant'],
                  'agent_paused': row['agent_paused'],
                  'tokens': row['tokens']['total_tokens'],
              } for row in turns],
              'conversation': scenario['conversation'],
              'total_tokens': scenario['tokens']['total_tokens'],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Commit verified runner correction
        run: |
          git config user.name "Tia CI"
          git config user.email "tia-ci@users.noreply.github.com"
          git add scripts/run_realistic_system_journeys.py
          git diff --cached --quiet && exit 0
          git commit -m "Use production ownership transitions in realistic runner"
          git push origin HEAD:test/realistic-system-journeys-v1
