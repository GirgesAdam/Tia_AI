name: Simplified Cancellation Turn Trace

on:
  push:
    branches:
      - test/realistic-system-journeys-v1
    paths:
      - .github/workflows/apply-realistic-source-patch.yml

permissions:
  contents: read

env:
  ENVIRONMENT: staging
  DEBUG: "false"
  DOCS_ENABLED: "false"
  DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_semantic_trace_unused
  SUPABASE_SECRET_KEY: sb_secret_semantic_trace_unused
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  LLM_PROVIDER: openai
  OPENAI_MODEL: gpt-5.6-luna
  OPENAI_FALLBACK_MODEL: gpt-5-mini
  OPENAI_REASONING_EFFORT: low
  OPENAI_FALLBACK_REASONING_EFFORT: low
  LLM_TIMEOUT_SECONDS: "60"
  LLM_MAX_RETRIES: "2"
  LLM_REALTIME_MAX_RETRIES: "0"
  AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
  CORS_ORIGINS: ""

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/realistic-system-journeys-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply semantic-input simplification in working tree
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/agents/turn_interpreter.py')
          text = path.read_text(encoding='utf-8')
          old_catalog = '''    semantic_catalog = deepcopy(clinic_catalog)\n    semantic_catalog.pop("branches", None)\n\n    doctors = semantic_catalog.get("doctors")\n    if isinstance(doctors, list):\n        for doctor in doctors:\n            if not isinstance(doctor, dict):\n                continue\n            doctor.pop("branch_ids", None)\n            doctor.pop("scheduled_branch_ids", None)\n\n    return semantic_catalog\n'''
          new_catalog = '''    semantic_catalog = deepcopy(clinic_catalog)\n    semantic_catalog.pop("branches", None)\n\n    services = semantic_catalog.get("services")\n    if isinstance(services, list):\n        for service in services:\n            if isinstance(service, dict):\n                service.pop("doctor_ids", None)\n\n    doctors = semantic_catalog.get("doctors")\n    if isinstance(doctors, list):\n        for doctor in doctors:\n            if not isinstance(doctor, dict):\n                continue\n            doctor.pop("branch_ids", None)\n            doctor.pop("scheduled_branch_ids", None)\n            doctor.pop("working_hours", None)\n\n    return semantic_catalog\n'''
          if old_catalog not in text:
              raise RuntimeError('semantic catalog anchor not found')
          text = text.replace(old_catalog, new_catalog, 1)

          start = text.index('    semantic_catalog = _semantic_catalog_for_single_location(clinic_catalog)\n', text.index('def interpret_customer_turn('))
          end = text.index('\n\n    primary_name =', start)
          replacement = '''    semantic_catalog = _semantic_catalog_for_single_location(clinic_catalog)\n    context = HumanMessage(\n        content=(\n            "PostgreSQL clinic catalog (canonical IDs; do not invent IDs):\\n"\n            f"{json.dumps(semantic_catalog, ensure_ascii=False, default=str, separators=(',', ':'))}\\n\\n"\n            "Persisted workflow state:\\n"\n            f"{json.dumps(state_payload, ensure_ascii=False, default=str, separators=(',', ':'))}\\n\\n"\n            "Recent conversation for reference resolution only:\\n"\n            f"{_recent_conversation_excerpt(history)}\\n\\n"\n            "Latest-turn authority reminder: before inheriting any service, doctor, date, or time from "\n            "persisted workflow state, first ground every such entity explicitly stated in the latest "\n            "customer turn. Persisted values may fill only fields the latest turn leaves unchanged. In a "\n            "reschedule flow, appointment_id is the canonical existing appointment when one supplied appointment "\n            "is clearly identified; appointment_reference is its customer-facing description, while requested_date "\n            "and requested_start_time are the replacement target.\\n\\n"\n            "Latest-turn consistency reminder: if presented booking/reschedule options exist and "\n            "the latest customer turn explicitly chooses one option or exact clock time and authorizes "\n            "the action, capture that choice in selection_index/selection_time or requested_start_time "\n            "and include the matching write capability. Never infer a choice the customer did not state."\n        )\n    )\n    user = HumanMessage(content=_latest_customer_turn(history))\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace('messages=[system, user]', 'messages=[system, context, user]')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Trace only the cancellation follow-up
        run: python -m scripts.trace_cancellation_semantics
