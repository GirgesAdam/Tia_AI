name: Verify Appointment ID Contract

on:
  push:
    branches:
      - test/realistic-system-journeys-v1
    paths:
      - .github/workflows/apply-realistic-source-patch.yml

permissions:
  contents: read

env:
  ENVIRONMENT: staging
  DEBUG: "false"
  DOCS_ENABLED: "false"
  DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_schema_contract_unused
  SUPABASE_SECRET_KEY: sb_secret_schema_contract_unused
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  LLM_PROVIDER: openai
  OPENAI_MODEL: gpt-5.6-luna
  OPENAI_FALLBACK_MODEL: gpt-5-mini
  OPENAI_REASONING_EFFORT: low
  OPENAI_FALLBACK_REASONING_EFFORT: low
  LLM_TIMEOUT_SECONDS: "60"
  LLM_MAX_RETRIES: "2"
  LLM_REALTIME_MAX_RETRIES: "0"
  AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
  CORS_ORIGINS: ""

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/realistic-system-journeys-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Clarify appointment ID schema description in working tree
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/agents/turn_models.py')
          text = path.read_text(encoding='utf-8')
          old = 'description="Canonical ID of the EXISTING appointment being acted on, selected only from current-patient appointments.",'
          new = 'description=(\n            "Canonical ID of the EXISTING appointment being acted on, selected only from supplied current-patient appointments. "\n            "For cancellation or reschedule, when the latest turn plus recent conversation clearly singles out exactly one current "\n            "appointment, copy that appointment exact ID here. A direct answer to the assistant immediately preceding question about "\n            "which appointment to act on is a selection when it uniquely identifies one appointment. An appointment explicitly said "\n            "to stay unchanged is excluded rather than kept as an ambiguity candidate. Use null only when more than one current "\n            "appointment genuinely still fits."\n        ),'
          if old not in text:
              raise RuntimeError('appointment_id description anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Focused tests without model calls
        run: |
          python -m pytest tests/test_unified_turn_interpreter.py tests/test_verified_cancellation_execution.py -q
          python -m compileall -q app/agents/turn_models.py
      - name: Trace cancellation semantics once
        run: python -m scripts.trace_cancellation_semantics
      - name: Run real cancellation journey once
        run: |
          mkdir -p artifacts
          python -m scripts.run_realistic_system_journeys \
            --workspace-slug tia \
            --report artifacts/cancellation-schema-contract.json \
            --scenario ambiguous_cancel_two_appointments
      - name: Require exact DB behavior
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/cancellation-schema-contract.json').read_text(encoding='utf-8'))
          scenario = report['scenarios'][0]
          after = {row['service']: row['status'] for row in scenario['after']['appointments']}
          cancel_actions = [row for row in scenario['agent_actions'] if row['tool'] == 'cancel_appointment' and row['status'] == 'success']
          assert after['هيدرافيشل'] == 'cancelled', after
          assert after['ليزر إزالة الشعر - إبط'] == 'confirmed', after
          assert len(cancel_actions) == 1, cancel_actions
          print(json.dumps({'assistant': scenario['turns'][-1]['assistant'], 'after': after, 'cancel_actions': len(cancel_actions), 'tokens': scenario['tokens']}, ensure_ascii=False, indent=2))
          PY
