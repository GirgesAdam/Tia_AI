name: Apply Realistic Source Patch

on:
  push:
    branches:
      - test/realistic-system-journeys-v1
    paths:
      - .github/workflows/apply-realistic-source-patch.yml

permissions:
  contents: write

env:
  ENVIRONMENT: staging
  DEBUG: "false"
  DOCS_ENABLED: "false"
  DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_realistic_journey_unused
  SUPABASE_SECRET_KEY: sb_secret_realistic_journey_unused
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  LLM_PROVIDER: openai
  OPENAI_MODEL: gpt-5.6-luna
  OPENAI_FALLBACK_MODEL: gpt-5-mini
  OPENAI_REASONING_EFFORT: low
  OPENAI_FALLBACK_REASONING_EFFORT: low
  LLM_TIMEOUT_SECONDS: "60"
  LLM_MAX_RETRIES: "2"
  LLM_REALTIME_MAX_RETRIES: "0"
  AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
  CORS_ORIGINS: ""

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/realistic-system-journeys-v1
      - name: Apply canonical cancellation target patch
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path

          agent_path = Path("backend/app/services/agent_chat.py")
          text = agent_path.read_text(encoding="utf-8")
          old = '''def _verified_cancellation_action(
              *,
              tool_context: AgentToolContext,
              policy: CapabilityPolicyDecision,
              decision: SemanticCapabilityDecision,
              clinic_catalog: dict[str, object],
          ) -> tuple[str, str] | None:
              """Execute only a semantically selected, current-patient appointment cancellation.

              The interpreter selects a canonical appointment ID from the verified current-patient
              catalog. Python never matches customer wording here: it only rechecks that exact ID
              against the same verified appointment set before authorizing the write.
              """
              if "appointment_cancellation" not in {str(item) for item in policy.capabilities}:
                  return None
              appointment_id = str(decision.entity_hints.appointment_id or "").strip()
              if not appointment_id:
                  return None
              rows = clinic_catalog.get("appointments")
              if not isinstance(rows, list):
                  return None
              selected = next(
                  (
                      row
                      for row in rows
                      if isinstance(row, dict)
                      and str(row.get("appointment_id") or row.get("id") or "") == appointment_id
                  ),
                  None,
              )
              if selected is None:
                  return None

              result = _invoke_authorized_tool(
                  tool_context=tool_context,
                  policy=policy,
                  tool_name="cancel_appointment",
                  arguments={
                      "appointment_id": appointment_id,
                      "reason": "Customer explicitly requested cancellation.",
                  },
              )
              if not result or result.get("ok") is not True:
                  return None

              service_name = str(selected.get("service_name") or "الموعد").strip()
              start_label = ""
              raw_start = selected.get("start_local")
              if raw_start:
                  try:
                      start = datetime.fromisoformat(str(raw_start))
                      start_label = f" يوم {start.strftime('%d/%m/%Y')} الساعة {start.strftime('%H:%M')}"
                  except ValueError:
                      start_label = ""
              return (
                  f"تمام، ألغيت موعد {service_name}{start_label}.",
                  "deterministic:verified-appointment-cancellation",
              )
          '''
          new = '''def _verified_cancellation_action(
              *,
              tool_context: AgentToolContext,
              policy: CapabilityPolicyDecision,
              decision: SemanticCapabilityDecision,
              clinic_catalog: dict[str, object],
          ) -> tuple[str, str] | None:
              """Cancel one verified current-patient appointment selected by semantic entities.

              The semantic layer owns meaning. Python only intersects canonical IDs/date/time
              fields with the verified current-patient appointment set, and writes only when the
              intersection contains exactly one appointment. Customer wording is never parsed here.
              """
              if "appointment_cancellation" not in {str(item) for item in policy.capabilities}:
                  return None
              rows = clinic_catalog.get("appointments")
              if not isinstance(rows, list):
                  return None
              candidates = [row for row in rows if isinstance(row, dict)]
              hints = decision.entity_hints
              appointment_id = str(hints.appointment_id or "").strip()

              if appointment_id:
                  candidates = [
                      row
                      for row in candidates
                      if str(row.get("appointment_id") or row.get("id") or "") == appointment_id
                  ]
              else:
                  filters_applied = 0
                  service_ids = []
                  if hints.service_id:
                      service_ids = [str(hints.service_id)]
                  elif getattr(hints, "service_candidate_ids", None):
                      service_ids = [str(value) for value in hints.service_candidate_ids]
                  if service_ids:
                      candidates = [
                          row for row in candidates if str(row.get("service_id") or "") in service_ids
                      ]
                      filters_applied += 1

                  doctor_ids = []
                  if hints.doctor_id:
                      doctor_ids = [str(hints.doctor_id)]
                  elif getattr(hints, "doctor_candidate_ids", None):
                      doctor_ids = [str(value) for value in hints.doctor_candidate_ids]
                  if doctor_ids:
                      candidates = [
                          row for row in candidates if str(row.get("doctor_id") or "") in doctor_ids
                      ]
                      filters_applied += 1

                  requested_date = str(hints.requested_date or "").strip()
                  if requested_date:
                      candidates = [
                          row
                          for row in candidates
                          if str(row.get("start_local") or "")[:10] == requested_date
                      ]
                      filters_applied += 1

                  requested_time = str(hints.requested_start_time or "").strip()
                  if requested_time:
                      normalized_time = requested_time if len(requested_time) != 4 else f"0{requested_time}"
                      matched: list[dict[str, object]] = []
                      for row in candidates:
                          try:
                              row_time = datetime.fromisoformat(str(row.get("start_local") or "")).strftime("%H:%M")
                          except ValueError:
                              continue
                          if row_time == normalized_time:
                              matched.append(row)
                      candidates = matched
                      filters_applied += 1

                  if filters_applied == 0:
                      return None

              if len(candidates) != 1:
                  return None
              selected = candidates[0]
              appointment_id = str(selected.get("appointment_id") or selected.get("id") or "").strip()
              if not appointment_id:
                  return None

              result = _invoke_authorized_tool(
                  tool_context=tool_context,
                  policy=policy,
                  tool_name="cancel_appointment",
                  arguments={
                      "appointment_id": appointment_id,
                      "reason": "Customer explicitly requested cancellation.",
                  },
              )
              if not result or result.get("ok") is not True:
                  return None

              service_name = str(selected.get("service_name") or "الموعد").strip()
              start_label = ""
              raw_start = selected.get("start_local")
              if raw_start:
                  try:
                      start = datetime.fromisoformat(str(raw_start))
                      start_label = f" يوم {start.strftime('%d/%m/%Y')} الساعة {start.strftime('%H:%M')}"
                  except ValueError:
                      start_label = ""
              return (
                  f"تمام، ألغيت موعد {service_name}{start_label}.",
                  "deterministic:verified-appointment-cancellation",
              )
          '''
          # Workflow YAML indentation adds ten spaces inside this block. Dedent both source templates.
          import textwrap
          old = textwrap.dedent(old)
          new = textwrap.dedent(new)
          if old not in text:
              raise SystemExit("Current cancellation helper not found")
          agent_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          interpreter_path = Path("backend/app/agents/turn_interpreter.py")
          interpreter = interpreter_path.read_text(encoding="utf-8")
          old_grounding = (
              '        "When current-patient appointments are supplied and a reschedule turn clearly identifies one existing "\n'
              '        "appointment from its displayed date/time/service/doctor, set appointment_id to that exact catalog ID; "\n'
          )
          new_grounding = (
              '        "When current-patient appointments are supplied and a reschedule or cancellation turn clearly identifies one existing "\n'
              '        "appointment from its displayed date/time/service/doctor, set appointment_id to that exact catalog ID; "\n'
          )
          if old_grounding not in interpreter:
              raise SystemExit("Grounding wording anchor not found")
          interpreter_path.write_text(interpreter.replace(old_grounding, new_grounding, 1), encoding="utf-8")

          test_path = Path("backend/tests/test_verified_cancellation_execution.py")
          test_path.write_text('''from types import SimpleNamespace

from app.services import agent_chat


HYDRA_SERVICE = "service-hydra"
LASER_SERVICE = "service-laser"


def _policy():
    return SimpleNamespace(capabilities={"appointment_cancellation"})


def _hints(**updates):
    values = {
        "appointment_id": None,
        "service_id": None,
        "service_candidate_ids": [],
        "doctor_id": None,
        "doctor_candidate_ids": [],
        "requested_date": None,
        "requested_start_time": None,
    }
    values.update(updates)
    return SimpleNamespace(**values)


def _decision(**updates):
    return SimpleNamespace(entity_hints=_hints(**updates))


def _catalog(*, duplicate_hydra=False):
    rows = [
        {
            "id": "appt-hydra",
            "appointment_id": "appt-hydra",
            "service_id": HYDRA_SERVICE,
            "service_name": "هيدرافيشل",
            "doctor_id": "doctor-hala",
            "start_local": "2026-09-12T10:00:00+03:00",
        },
        {
            "id": "appt-laser",
            "appointment_id": "appt-laser",
            "service_id": LASER_SERVICE,
            "service_name": "ليزر إزالة الشعر - إبط",
            "doctor_id": "doctor-ahmed",
            "start_local": "2026-09-13T11:00:00+03:00",
        },
    ]
    if duplicate_hydra:
        rows.append(
            {
                "id": "appt-hydra-2",
                "appointment_id": "appt-hydra-2",
                "service_id": HYDRA_SERVICE,
                "service_name": "هيدرافيشل",
                "doctor_id": "doctor-hala",
                "start_local": "2026-09-14T10:00:00+03:00",
            }
        )
    return {"appointments": rows}


def _capture(monkeypatch):
    calls = []

    def fake_invoke(**kwargs):
        calls.append(kwargs)
        return {"ok": True}

    monkeypatch.setattr(agent_chat, "_invoke_authorized_tool", fake_invoke)
    return calls


def test_cancellation_without_canonical_target_never_writes(monkeypatch):
    calls = _capture(monkeypatch)
    assert agent_chat._verified_cancellation_action(
        tool_context=object(), policy=_policy(), decision=_decision(), clinic_catalog=_catalog()
    ) is None
    assert calls == []


def test_unknown_explicit_appointment_id_never_writes(monkeypatch):
    calls = _capture(monkeypatch)
    assert agent_chat._verified_cancellation_action(
        tool_context=object(),
        policy=_policy(),
        decision=_decision(appointment_id="not-current"),
        clinic_catalog=_catalog(),
    ) is None
    assert calls == []


def test_exact_semantic_appointment_id_executes_once(monkeypatch):
    calls = _capture(monkeypatch)
    result = agent_chat._verified_cancellation_action(
        tool_context=object(),
        policy=_policy(),
        decision=_decision(appointment_id="appt-hydra"),
        clinic_catalog=_catalog(),
    )
    assert result is not None
    assert calls[0]["arguments"]["appointment_id"] == "appt-hydra"
    assert len(calls) == 1


def test_unique_canonical_service_resolves_appointment_without_text_matching(monkeypatch):
    calls = _capture(monkeypatch)
    result = agent_chat._verified_cancellation_action(
        tool_context=object(),
        policy=_policy(),
        decision=_decision(service_id=HYDRA_SERVICE),
        clinic_catalog=_catalog(),
    )
    assert result is not None
    assert "هيدرافيشل" in result[0]
    assert calls[0]["arguments"]["appointment_id"] == "appt-hydra"
    assert len(calls) == 1


def test_same_service_multiple_appointments_stays_ambiguous(monkeypatch):
    calls = _capture(monkeypatch)
    result = agent_chat._verified_cancellation_action(
        tool_context=object(),
        policy=_policy(),
        decision=_decision(service_id=HYDRA_SERVICE),
        clinic_catalog=_catalog(duplicate_hydra=True),
    )
    assert result is None
    assert calls == []


def test_structured_date_can_narrow_same_service_to_one(monkeypatch):
    calls = _capture(monkeypatch)
    result = agent_chat._verified_cancellation_action(
        tool_context=object(),
        policy=_policy(),
        decision=_decision(service_id=HYDRA_SERVICE, requested_date="2026-09-14"),
        clinic_catalog=_catalog(duplicate_hydra=True),
    )
    assert result is not None
    assert calls[0]["arguments"]["appointment_id"] == "appt-hydra-2"
    assert len(calls) == 1
''', encoding="utf-8")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify staging secrets
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$DATABASE_URL"
      - name: Apply staging migrations
        run: alembic upgrade head
      - name: Focused unit tests
        run: |
          python -m pytest \
            tests/test_verified_cancellation_execution.py \
            tests/test_clinic_grounding_compatibility.py \
            tests/test_unified_turn_interpreter.py -q
      - name: Verify cancellation journey only
        run: |
          python -m scripts.run_realistic_system_journeys \
            --workspace-slug tia \
            --report artifacts/realistic-system-journeys.json \
            --scenario ambiguous_cancel_two_appointments
      - name: Upload manual-review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realistic-cancellation-canonical-target
          path: backend/artifacts/realistic-system-journeys.json
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified cancellation target patch
        if: success()
        working-directory: .
        run: |
          git config user.name "Girges Ezzat"
          git config user.email "girgesadam1@gmail.com"
          git add backend/app/services/agent_chat.py backend/app/agents/turn_interpreter.py backend/tests/test_verified_cancellation_execution.py
          git diff --cached --quiet && exit 0
          git commit -m "Resolve cancellation targets from canonical entities"
          git push origin HEAD:test/realistic-system-journeys-v1
