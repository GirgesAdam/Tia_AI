name: Verify Cross Customer Semantic Boundary

on:
  push:
    branches:
      - test/realistic-system-journeys-v1
    paths:
      - .github/workflows/apply-realistic-source-patch.yml

permissions:
  contents: write

env:
  ENVIRONMENT: staging
  DEBUG: "false"
  DOCS_ENABLED: "false"
  DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_boundary_unused
  SUPABASE_SECRET_KEY: sb_secret_boundary_unused
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  LLM_PROVIDER: openai
  OPENAI_MODEL: gpt-5.6-luna
  OPENAI_FALLBACK_MODEL: gpt-5-mini
  OPENAI_REASONING_EFFORT: low
  OPENAI_FALLBACK_REASONING_EFFORT: low
  LLM_TIMEOUT_SECONDS: "60"
  LLM_MAX_RETRIES: "2"
  LLM_REALTIME_MAX_RETRIES: "0"
  AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
  CORS_ORIGINS: ""

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/realistic-system-journeys-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Add cross customer contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/agents/turn_interpreter.py')
          text = path.read_text(encoding='utf-8')
          sentinel = 'CROSS-CUSTOMER BOUNDARY: customer-scoped capabilities'
          if sentinel not in text:
              anchor = '''        "COMPOUND REQUESTS: when the latest customer turn clearly asks for two or more independently "\n'''
              rule = '''        "CROSS-CUSTOMER BOUNDARY: customer-scoped capabilities apply only to the current customer in "\n        "this conversation. If the latest turn asks about a different customer, do not include customer_profile, "\n        "customer_history, appointment_list, appointment_confirmation, appointment_cancellation, or "\n        "appointment_reschedule for that request, and do not reinterpret the different person as the current "\n        "customer. Return no customer-data capability so the customer-facing agent can decline without a record "\n        "lookup. General clinic information about services or doctors is unaffected.\\n\\n"\n'''
              if anchor not in text:
                  raise RuntimeError('cross-customer insertion anchor not found')
              text = text.replace(anchor, rule + anchor, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Add contract test
        run: |
          cat > tests/test_turn_interpreter_cross_customer_contract.py <<'PY'
          from datetime import UTC, datetime
          from app.agents.turn_interpreter import _interpreter_system_prompt

          def test_cross_customer_contract_is_present() -> None:
              prompt = _interpreter_system_prompt(
                  timezone_name="Africa/Cairo",
                  local_now=datetime(2026, 9, 11, tzinfo=UTC),
                  active_flow=False,
              )
              assert "CROSS-CUSTOMER BOUNDARY" in prompt
              assert "current customer" in prompt
              assert "Return no customer-data capability" in prompt
          PY
      - name: Commit candidate locally
        run: |
          git config user.name "Tia CI"
          git config user.email "tia-ci@users.noreply.github.com"
          git add app/agents/turn_interpreter.py tests/test_turn_interpreter_cross_customer_contract.py
          git commit -m "Enforce cross-customer semantic boundary"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Focused tests
        run: |
          python -m pytest tests/test_turn_interpreter_cross_customer_contract.py tests/test_unified_turn_interpreter.py -q
          python -m compileall -q app/agents/turn_interpreter.py
      - name: Apply staging migrations
        run: alembic upgrade head
      - name: Run boundary journey
        run: |
          mkdir -p artifacts
          python -m scripts.run_realistic_system_journeys \
            --workspace-slug tia \
            --report artifacts/cross-customer-boundary.json \
            --scenario privacy_other_patient
      - name: Verify no customer record tool was used
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/cross-customer-boundary.json').read_text(encoding='utf-8'))
          row = report['scenarios'][0]
          customer_tools = {
              'get_customer_profile', 'get_customer_history', 'get_customer_appointments',
              'cancel_appointment', 'reschedule_appointment', 'confirm_appointment'
          }
          used = [a['tool'] for a in row['agent_actions']]
          assert row['execution_error'] is None
          assert customer_tools.isdisjoint(used), used
          assert row['before'] == row['after']
          assert (row['turns'][-1]['assistant'] or '').strip()
          print(json.dumps({
              'source_commit': '${{ env.SOURCE_COMMIT }}',
              'assistant': row['turns'][-1]['assistant'],
              'tools': used,
              'tokens': row['tokens']['total_tokens'],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Push verified source commit
        run: git push origin HEAD:test/realistic-system-journeys-v1
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-customer-boundary
          path: backend/artifacts/cross-customer-boundary.json
          if-no-files-found: warn
          retention-days: 7
