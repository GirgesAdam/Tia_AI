name: Verify Committed Cancellation Contract

on:
  push:
    branches:
      - test/realistic-system-journeys-v1
    paths:
      - .github/workflows/apply-realistic-source-patch.yml

permissions:
  contents: read

env:
  ENVIRONMENT: staging
  DEBUG: "false"
  DOCS_ENABLED: "false"
  DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_committed_cancel_unused
  SUPABASE_SECRET_KEY: sb_secret_committed_cancel_unused
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  LLM_PROVIDER: openai
  OPENAI_MODEL: gpt-5.6-luna
  OPENAI_FALLBACK_MODEL: gpt-5-mini
  OPENAI_REASONING_EFFORT: low
  OPENAI_FALLBACK_REASONING_EFFORT: low
  LLM_TIMEOUT_SECONDS: "60"
  LLM_MAX_RETRIES: "2"
  LLM_REALTIME_MAX_RETRIES: "0"
  AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
  CORS_ORIGINS: ""

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/realistic-system-journeys-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Focused tests without model calls
        run: |
          python -m pytest tests/test_unified_turn_interpreter.py tests/test_verified_cancellation_execution.py -q
          python -m compileall -q app/agents/turn_models.py app/services/agent_chat.py
      - name: Run committed cancellation journey
        run: |
          mkdir -p artifacts
          python -m scripts.run_realistic_system_journeys \
            --workspace-slug tia \
            --report artifacts/cancellation-committed.json \
            --scenario ambiguous_cancel_two_appointments
      - name: Require exact DB behavior
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/cancellation-committed.json').read_text(encoding='utf-8'))
          scenario = report['scenarios'][0]
          after = {row['service']: row['status'] for row in scenario['after']['appointments']}
          cancels = [row for row in scenario['agent_actions'] if row['tool'] == 'cancel_appointment' and row['status'] == 'success']
          assert after['هيدرافيشل'] == 'cancelled', after
          assert after['ليزر إزالة الشعر - إبط'] == 'confirmed', after
          assert len(cancels) == 1, cancels
          print(json.dumps({'assistant': scenario['turns'][-1]['assistant'], 'after': after, 'cancels': len(cancels), 'tokens': scenario['tokens']}, ensure_ascii=False, indent=2))
          PY
