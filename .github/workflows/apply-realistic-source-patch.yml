name: Finalize Timestamp Fix And Realistic Regression

on:
  push:
    branches:
      - test/realistic-system-journeys-v1
    paths:
      - .github/workflows/apply-realistic-source-patch.yml

permissions:
  contents: write

concurrency:
  group: finalize-realistic-regression
  cancel-in-progress: true

env:
  ENVIRONMENT: staging
  DEBUG: "false"
  DOCS_ENABLED: "false"
  DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_realistic_regression_unused
  SUPABASE_SECRET_KEY: sb_secret_realistic_regression_unused
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  LLM_PROVIDER: openai
  OPENAI_MODEL: gpt-5.6-luna
  OPENAI_FALLBACK_MODEL: gpt-5-mini
  OPENAI_REASONING_EFFORT: low
  OPENAI_FALLBACK_REASONING_EFFORT: low
  LLM_TIMEOUT_SECONDS: "60"
  LLM_MAX_RETRIES: "2"
  LLM_REALTIME_MAX_RETRIES: "0"
  AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
  CORS_ORIGINS: ""

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/realistic-system-journeys-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply minimal timestamp fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/services/agent_chat.py')
          text = path.read_text(encoding='utf-8')

          inbound_old = '''    inbound = Message(\n        workspace_id=workspace.id,\n        conversation_id=conversation.id,\n        channel_connection_id=conversation.channel_connection_id,\n        sender_type="patient",\n        direction="inbound",\n'''
          inbound_new = '''    inbound = Message(\n        workspace_id=workspace.id,\n        conversation_id=conversation.id,\n        channel_connection_id=conversation.channel_connection_id,\n        sender_type="patient",\n        direction="inbound",\n        created_at=activity_now,\n'''
          if 'direction="inbound",\n        created_at=activity_now,' not in text:
              if inbound_old not in text:
                  raise RuntimeError('inbound timestamp anchor not found')
              text = text.replace(inbound_old, inbound_new, 1)

          outbound_old = '''    outbound = Message(\n        workspace_id=workspace.id,\n        conversation_id=conversation.id,\n        channel_connection_id=conversation.channel_connection_id,\n        sender_type="ai",\n        direction="outbound",\n'''
          outbound_new = '''    outbound = Message(\n        workspace_id=workspace.id,\n        conversation_id=conversation.id,\n        channel_connection_id=conversation.channel_connection_id,\n        sender_type="ai",\n        direction="outbound",\n        created_at=outbound_now,\n'''
          if 'direction="outbound",\n        created_at=outbound_now,' not in text:
              if outbound_old not in text:
                  raise RuntimeError('outbound timestamp anchor not found')
              text = text.replace(outbound_old, outbound_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix locally
        run: |
          git config user.name "Tia CI"
          git config user.email "tia-ci@users.noreply.github.com"
          git add app/services/agent_chat.py
          if git diff --cached --quiet; then
            echo "Timestamp fix already committed."
          else
            git commit -m "Use explicit timestamps for agent messages"
          fi
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Focused regression before push
        run: |
          python -m pytest \
            tests/test_conversation_ownership_hardening.py \
            tests/test_handoff_resume_guard.py \
            tests/test_verified_cancellation_execution.py \
            tests/test_unified_turn_interpreter.py \
            tests/test_clinic_grounding_compatibility.py -q
          python -m compileall -q app/services/agent_chat.py

      - name: Apply staging migrations
        run: alembic upgrade head

      - name: Targeted cancellation and ownership gate
        run: |
          mkdir -p artifacts
          python -m scripts.run_realistic_system_journeys \
            --workspace-slug tia \
            --report artifacts/timestamp-source-gate.json \
            --scenario ambiguous_cancel_two_appointments \
            --scenario human_takeover_and_return

      - name: Verify targeted DB behavior
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/timestamp-source-gate.json').read_text(encoding='utf-8'))
          rows = {row['scenario']: row for row in report['scenarios']}

          cancel = rows['ambiguous_cancel_two_appointments']
          cancel_after = {row['service']: row['status'] for row in cancel['after']['appointments']}
          cancel_actions = [row for row in cancel['agent_actions'] if row['tool'] == 'cancel_appointment' and row['status'] == 'success']
          assert cancel_after['هيدرافيشل'] == 'cancelled', cancel_after
          assert cancel_after['ليزر إزالة الشعر - إبط'] == 'confirmed', cancel_after
          assert len(cancel_actions) == 1, cancel_actions

          ownership = rows['human_takeover_and_return']
          turns = ownership['turns']
          bookings = [row for row in ownership['agent_actions'] if row['tool'] == 'book_appointment' and row['status'] == 'success']
          assert turns[1]['agent_paused'] is True, turns[1]
          assert turns[1]['tokens']['model_calls'] == 0, turns[1]['tokens']
          assert ownership['conversation']['owner_type'] == 'ai', ownership['conversation']
          assert ownership['conversation']['status'] == 'open', ownership['conversation']
          assert len(ownership['after']['appointments']) == 1, ownership['after']['appointments']
          assert ownership['after']['appointments'][0]['service'] == 'هيدرافيشل', ownership['after']['appointments']
          assert len(bookings) == 1, bookings

          print(json.dumps({
              'source_commit': '${{ env.SOURCE_COMMIT }}',
              'cancellation_tokens': cancel['tokens']['total_tokens'],
              'ownership_tokens': ownership['tokens']['total_tokens'],
              'targeted_total_tokens': report['totals']['total_tokens'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Push verified source commit
        run: git push origin HEAD:test/realistic-system-journeys-v1

      - name: Run final realistic regression
        run: |
          python -m scripts.run_realistic_system_journeys \
            --workspace-slug tia \
            --report artifacts/final-realistic-system-journeys.json \
            --scenario exact_time_then_verified_alternative \
            --scenario package_purchase_and_first_session \
            --scenario existing_package_separate_session \
            --scenario package_holder_other_service \
            --scenario paid_reschedule_no_double_charge \
            --scenario ambiguous_cancel_two_appointments \
            --scenario refund_quote_after_one_used \
            --scenario partial_payment_status \
            --scenario compound_two_services \
            --scenario medical_suitability_handoff \
            --scenario privacy_other_patient \
            --scenario human_takeover_and_return

      - name: Print regression totals
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('artifacts/final-realistic-system-journeys.json')
          if not path.exists():
              print('final report missing')
          else:
              report = json.loads(path.read_text(encoding='utf-8'))
              print(json.dumps({
                  'source_commit': '${{ env.SOURCE_COMMIT }}',
                  'totals': report.get('totals'),
                  'scenario_tokens': {
                      row['scenario']: row.get('tokens', {}).get('total_tokens')
                      for row in report.get('scenarios', [])
                  },
              }, ensure_ascii=False, indent=2))
          PY

      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-realistic-system-journeys
          path: |
            backend/artifacts/timestamp-source-gate.json
            backend/artifacts/final-realistic-system-journeys.json
          if-no-files-found: warn
          retention-days: 7
