name: Verify Minimal Cancellation Semantic Fix

on:
  push:
    branches:
      - test/realistic-system-journeys-v1
    paths:
      - .github/workflows/apply-realistic-source-patch.yml

permissions:
  contents: write

env:
  ENVIRONMENT: staging
  DEBUG: "false"
  DOCS_ENABLED: "false"
  DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
  SUPABASE_URL: https://ycuxjlkhnubztgqmhtom.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_realistic_journey_unused
  SUPABASE_SECRET_KEY: sb_secret_realistic_journey_unused
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  LLM_PROVIDER: openai
  OPENAI_MODEL: gpt-5.6-luna
  OPENAI_FALLBACK_MODEL: gpt-5-mini
  OPENAI_REASONING_EFFORT: low
  OPENAI_FALLBACK_REASONING_EFFORT: low
  LLM_TIMEOUT_SECONDS: "60"
  LLM_MAX_RETRIES: "2"
  LLM_REALTIME_MAX_RETRIES: "0"
  AGENT_UNIFIED_TURN_INTERPRETER_ENABLED: "true"
  CORS_ORIGINS: ""

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/realistic-system-journeys-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply one-sentence semantic contract fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/agents/turn_interpreter.py')
          text = path.read_text(encoding='utf-8')
          old = (
              '        "turn plus recent reference context identifies exactly one appointment. If more than one appointment still "\n'
          )
          new = (
              '        "turn plus recent reference context identifies exactly one appointment. If the latest turn clearly names one "\n'
              '        "appointment as the cancellation target and clearly says another current appointment should be kept unchanged, "\n'
              '        "treat the kept appointment as excluded, not as unresolved ambiguity. If more than one appointment still "\n'
          )
          if old not in text:
              raise RuntimeError('Cancellation contract anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_unified_turn_interpreter.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_name = 'test_cancellation_contract_treats_kept_appointment_as_excluded'
          if test_name not in test_text:
              test_text += '''\n\ndef test_cancellation_contract_treats_kept_appointment_as_excluded() -> None:\n    prompt = _interpreter_system_prompt(\n        timezone_name="Africa/Cairo",\n        local_now=datetime(2026, 9, 11, 12, 0),\n        active_flow=False,\n    )\n\n    assert "treat the kept appointment as excluded, not as unresolved ambiguity" in prompt\n'''
              test_path.write_text(test_text, encoding='utf-8')
          PY
      - name: Focused tests without model calls
        run: |
          python -m pytest \
            tests/test_unified_turn_interpreter.py \
            tests/test_verified_cancellation_execution.py \
            tests/test_clinic_grounding_compatibility.py -q
      - name: Run real cancellation journey once
        run: |
          python -m scripts.run_realistic_system_journeys \
            --workspace-slug tia \
            --report artifacts/cancellation-minimal-fix.json \
            --scenario ambiguous_cancel_two_appointments
      - name: Require exact DB behavior
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/cancellation-minimal-fix.json').read_text(encoding='utf-8'))
          scenario = report['scenarios'][0]
          after = {row['service']: row['status'] for row in scenario['after']['appointments']}
          cancel_actions = [
              row for row in scenario['agent_actions']
              if row['tool'] == 'cancel_appointment' and row['status'] == 'success'
          ]
          assert after['هيدرافيشل'] == 'cancelled', after
          assert after['ليزر إزالة الشعر - إبط'] == 'confirmed', after
          assert len(cancel_actions) == 1, cancel_actions
          print(json.dumps({
              'assistant': scenario['turns'][-1]['assistant'],
              'after': after,
              'cancel_actions': len(cancel_actions),
              'tokens': scenario['tokens'],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Commit only the verified minimal fix
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/agents/turn_interpreter.py backend/tests/test_unified_turn_interpreter.py
          git diff --cached --quiet && exit 0
          git commit -m "Clarify cancellation target exclusions"
          git push origin HEAD:test/realistic-system-journeys-v1
