name: Apply reschedule service-change patch

on:
  push:
    branches:
      - fix/reschedule-service-change

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[reschedule-service-change-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reschedule-service-change
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_reschedule_service_change_patch.py
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply_reschedule_service_change_patch.py
          rm .github/workflows/apply-reschedule-service-change.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Support safe service changes during rescheduling [reschedule-service-change-applied]"
          git push origin HEAD:fix/reschedule-service-change
