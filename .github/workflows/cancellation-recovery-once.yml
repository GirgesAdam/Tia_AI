name: Cancellation recovery once

on:
  push:
    branches: [feat/core-product-hardening]
    paths:
      - .github/workflows/cancellation-recovery-once.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/core-product-hardening
          fetch-depth: 0

      - name: Add optional cancellation recovery automation
        shell: python
        run: |
          from pathlib import Path

          # 1) Default rule + scheduling anchor.
          path = Path("backend/app/core/automation_rules.py")
          text = path.read_text(encoding="utf-8")
          marker = '''    DefaultAutomationRule(
              key="no_show_followup",
              name="No-show recovery follow-up",'''
          rule = '''    DefaultAutomationRule(
              key="cancellation_recovery",
              name="Cancellation recovery follow-up",
              trigger_kind="after_cancelled",
              offset_minutes=60,
              channel="whatsapp",
              template_name="tia_cancellation_recovery_ar",
              template_language="ar",
              max_lateness_minutes=1440,
              enabled_by_default=False,
          ),
          DefaultAutomationRule(
              key="no_show_followup",
              name="No-show recovery follow-up",'''
          assert marker in text and "key=\"cancellation_recovery\"" not in text
          text = text.replace(marker, rule, 1)
          signature = '''    completed_at: datetime | None,
              no_show_at: datetime | None,
          ) -> datetime | None:'''
          replacement = '''    completed_at: datetime | None,
              no_show_at: datetime | None,
              cancelled_at: datetime | None = None,
          ) -> datetime | None:'''
          assert signature in text
          text = text.replace(signature, replacement, 1)
          anchor = '''    elif trigger_kind == "after_no_show":
              anchor = no_show_at
          else:'''
          anchor_replacement = '''    elif trigger_kind == "after_no_show":
              anchor = no_show_at
          elif trigger_kind == "after_cancelled":
              anchor = cancelled_at
          else:'''
          assert anchor in text
          text = text.replace(anchor, anchor_replacement, 1)
          path.write_text(text, encoding="utf-8")

          # 2) Persisted trigger kind constraint.
          path = Path("backend/app/models/automation_rule.py")
          text = path.read_text(encoding="utf-8")
          tuple_old = '''    "after_completed",
              "after_no_show",
          )'''
          tuple_new = '''    "after_completed",
              "after_no_show",
              "after_cancelled",
          )'''
          assert tuple_old in text
          text = text.replace(tuple_old, tuple_new, 1)
          check_old = '''            "trigger_kind IN ('appointment_created', 'before_appointment', 'after_completed', 'after_no_show')",'''
          check_new = '''            "trigger_kind IN ('appointment_created', 'before_appointment', 'after_completed', 'after_no_show', 'after_cancelled')",'''
          assert check_old in text
          text = text.replace(check_old, check_new, 1)
          path.write_text(text, encoding="utf-8")

          # 3) Planner, eligibility, copy and template variables.
          path = Path("backend/app/services/automations.py")
          text = path.read_text(encoding="utf-8")
          eligible_old = '''    if rule.trigger_kind == "after_no_show":
              return appointment.status == "no_show" and appointment.no_show_at is not None
          return False'''
          eligible_new = '''    if rule.trigger_kind == "after_no_show":
              return appointment.status == "no_show" and appointment.no_show_at is not None
          if rule.trigger_kind == "after_cancelled":
              return appointment.status == "cancelled" and appointment.cancelled_at is not None
          return False'''
          assert eligible_old in text
          text = text.replace(eligible_old, eligible_new, 1)

          candidates_old = '''    if rule.trigger_kind == "after_no_show":
              oldest = now - timedelta(days=7)
              return list(
                  db.scalars(
                      select(Appointment).where(
                          Appointment.workspace_id == workspace_id,
                          Appointment.status == "no_show",
                          Appointment.no_show_at.is_not(None),
                          Appointment.no_show_at >= oldest,
                      )
                  )
              )
          return []'''
          candidates_new = '''    if rule.trigger_kind == "after_no_show":
              oldest = now - timedelta(days=7)
              return list(
                  db.scalars(
                      select(Appointment).where(
                          Appointment.workspace_id == workspace_id,
                          Appointment.status == "no_show",
                          Appointment.no_show_at.is_not(None),
                          Appointment.no_show_at >= oldest,
                      )
                  )
              )
          if rule.trigger_kind == "after_cancelled":
              oldest = now - timedelta(days=7)
              return list(
                  db.scalars(
                      select(Appointment).where(
                          Appointment.workspace_id == workspace_id,
                          Appointment.status == "cancelled",
                          Appointment.cancelled_at.is_not(None),
                          Appointment.cancelled_at >= oldest,
                      )
                  )
              )
          return []'''
          assert candidates_old in text
          text = text.replace(candidates_old, candidates_new, 1)

          schedule_old = '''                completed_at=appointment.completed_at,
                      no_show_at=appointment.no_show_at,
                  )'''
          schedule_new = '''                completed_at=appointment.completed_at,
                      no_show_at=appointment.no_show_at,
                      cancelled_at=appointment.cancelled_at,
                  )'''
          assert schedule_old in text
          text = text.replace(schedule_old, schedule_new, 1)

          copy_marker = '''    if rule_key == "no_show_followup":
              return (
                  f"أهلًا {data['patient_name']}، لاحظت إن ميعاد {data['service_name']} فات. "'''
          copy_replacement = '''    if rule_key == "cancellation_recovery":
              return (
                  f"أهلًا {data['patient_name']}، حبيت أساعدك بعد إلغاء موعد {data['service_name']} "
                  f"يوم {data['date']} الساعة {data['time']}. "
                  "لو حابة نرتب ميعاد جديد ابعتيلي هنا وأنا أساعدك."
              )
          if rule_key == "no_show_followup":
              return (
                  f"أهلًا {data['patient_name']}، لاحظت إن ميعاد {data['service_name']} فات. "'''
          assert copy_marker in text
          text = text.replace(copy_marker, copy_replacement, 1)

          params_old = '''    if rule_key == "appointment_reminder_6h":
              return [patient_name, service_name, date, time]
          if rule_key == "post_visit_followup":'''
          params_new = '''    if rule_key == "appointment_reminder_6h":
              return [patient_name, service_name, date, time]
          if rule_key == "cancellation_recovery":
              return [patient_name, service_name, date, time]
          if rule_key == "post_visit_followup":'''
          assert params_old in text
          text = text.replace(params_old, params_new, 1)
          path.write_text(text, encoding="utf-8")

          # 4) Admin UI: visible, optional, configurable timing.
          path = Path("frontend/src/app/(dashboard)/automations/page.tsx")
          text = path.read_text(encoding="utf-8")
          assert '  no_show_followup: "متابعة عدم الحضور",' in text
          text = text.replace(
              '  no_show_followup: "متابعة عدم الحضور",',
              '  cancellation_recovery: "استرجاع الحجوزات الملغاة",\n  no_show_followup: "متابعة عدم الحضور",',
              1,
          )
          assert '  no_show_followup: "اختياري: تتواصل مع العميل بعد عدم الحضور لعرض إعادة الحجز.",' in text
          text = text.replace(
              '  no_show_followup: "اختياري: تتواصل مع العميل بعد عدم الحضور لعرض إعادة الحجز.",',
              '  cancellation_recovery: "اختياري: تتواصل مع العميل بعد إلغاء الموعد وتعرض عليه ترتيب موعد جديد.",\n  no_show_followup: "اختياري: تتواصل مع العميل بعد عدم الحضور لعرض إعادة الحجز.",',
              1,
          )
          assert '  "post_visit_followup",\n  "no_show_followup",' in text
          text = text.replace(
              '  "post_visit_followup",\n  "no_show_followup",',
              '  "post_visit_followup",\n  "cancellation_recovery",\n  "no_show_followup",',
              1,
          )
          timing_old = 'const timingRuleKeys = new Set(["appointment_reminder_6h", "post_visit_followup", "no_show_followup"]);'
          timing_new = 'const timingRuleKeys = new Set(["appointment_reminder_6h", "post_visit_followup", "cancellation_recovery", "no_show_followup"]);'
          assert timing_old in text
          text = text.replace(timing_old, timing_new, 1)
          label_old = '  if (rule.trigger_kind === "after_no_show") return "أرسل بعد عدم الحضور بـ";'
          label_new = '  if (rule.trigger_kind === "after_no_show") return "أرسل بعد عدم الحضور بـ";\n  if (rule.trigger_kind === "after_cancelled") return "أرسل بعد إلغاء الموعد بـ";'
          assert label_old in text
          text = text.replace(label_old, label_new, 1)
          path.write_text(text, encoding="utf-8")

          # 5) Migration + readiness head.
          migration = Path("backend/alembic/versions/0054_cancellation_recovery_trigger.py")
          migration.write_text('''"""Allow cancellation recovery automation rules.\n\nRevision ID: 0054_cancellation_recovery_trigger\nRevises: 0053_public_table_rls_completion\nCreate Date: 2026-09-04\n"""\n\nfrom collections.abc import Sequence\n\nfrom alembic import op\n\nrevision: str = "0054_cancellation_recovery_trigger"\ndown_revision: str | Sequence[str] | None = "0053_public_table_rls_completion"\nbranch_labels: str | Sequence[str] | None = None\ndepends_on: str | Sequence[str] | None = None\n\n\ndef _replace_trigger_constraint(values: str) -> None:\n    op.drop_constraint(\n        "automation_rule_trigger_kind_valid",\n        "automation_rules",\n        type_="check",\n    )\n    op.create_check_constraint(\n        "automation_rule_trigger_kind_valid",\n        "automation_rules",\n        f"trigger_kind IN ({values})",\n    )\n\n\ndef upgrade() -> None:\n    _replace_trigger_constraint(\n        "'appointment_created', 'before_appointment', 'after_completed', 'after_no_show', 'after_cancelled'"\n    )\n\n\ndef downgrade() -> None:\n    _replace_trigger_constraint(\n        "'appointment_created', 'before_appointment', 'after_completed', 'after_no_show'"\n    )\n''', encoding="utf-8")

          readiness = Path("backend/app/services/operational_readiness.py")
          text = readiness.read_text(encoding="utf-8")
          assert 'EXPECTED_MIGRATION_HEAD = "0053_public_table_rls_completion"' in text
          text = text.replace(
              'EXPECTED_MIGRATION_HEAD = "0053_public_table_rls_completion"',
              'EXPECTED_MIGRATION_HEAD = "0054_cancellation_recovery_trigger"',
              1,
          )
          readiness.write_text(text, encoding="utf-8")

          existing_test = Path("backend/tests/test_automation_operations_phase54.py")
          text = existing_test.read_text(encoding="utf-8")
          assert 'EXPECTED_MIGRATION_HEAD = "0053_public_table_rls_completion"' in text
          text = text.replace(
              'EXPECTED_MIGRATION_HEAD = "0053_public_table_rls_completion"',
              'EXPECTED_MIGRATION_HEAD = "0054_cancellation_recovery_trigger"',
              1,
          )
          existing_test.write_text(text, encoding="utf-8")

          # 6) Focused contract tests.
          test = Path("backend/tests/test_cancellation_recovery_automation.py")
          test.write_text('''from datetime import UTC, datetime\nfrom pathlib import Path\n\nfrom app.core.automation_rules import DEFAULT_AUTOMATION_RULES, scheduled_for\nfrom app.services.automations import _appointment_template_body_parameters\n\n\ndef _root() -> Path:\n    return Path(__file__).resolve().parents[2]\n\n\ndef test_cancellation_recovery_is_optional_and_uses_cancelled_at() -> None:\n    rules = {rule.key: rule for rule in DEFAULT_AUTOMATION_RULES}\n    rule = rules["cancellation_recovery"]\n    assert rule.enabled_by_default is False\n    assert rule.trigger_kind == "after_cancelled"\n    assert rule.offset_minutes == 60\n    cancelled_at = datetime(2026, 9, 4, 12, 0, tzinfo=UTC)\n    when = scheduled_for(\n        trigger_kind=rule.trigger_kind,\n        offset_minutes=rule.offset_minutes,\n        appointment_created_at=cancelled_at,\n        appointment_start_at=cancelled_at,\n        completed_at=None,\n        no_show_at=None,\n        cancelled_at=cancelled_at,\n    )\n    assert when == datetime(2026, 9, 4, 13, 0, tzinfo=UTC)\n\n\ndef test_cancellation_recovery_uses_existing_appointment_engine_without_new_state_machine() -> None:\n    service = (_root() / "backend/app/services/automations.py").read_text(encoding="utf-8")\n    assert 'rule.trigger_kind == "after_cancelled"' in service\n    assert 'Appointment.status == "cancelled"' in service\n    assert "Appointment.cancelled_at >= oldest" in service\n    assert "cancellation_recovery_state" not in service\n    assert "CancellationRecovery" not in service\n\n\ndef test_cancellation_recovery_template_contract_is_four_simple_variables() -> None:\n    params = _appointment_template_body_parameters(\n        "cancellation_recovery",\n        {\n            "patient_name": "سارة",\n            "service_name": "ليزر",\n            "date": "04/09/2026",\n            "time": "18:00",\n            "branch_name": "العيادة",\n        },\n    )\n    assert params == ["سارة", "ليزر", "04/09/2026", "18:00"]\n\n\ndef test_cancellation_recovery_is_admin_visible_and_timing_configurable() -> None:\n    page = (_root() / "frontend/src/app/(dashboard)/automations/page.tsx").read_text(encoding="utf-8")\n    assert 'cancellation_recovery: "استرجاع الحجوزات الملغاة"' in page\n    assert '"cancellation_recovery"' in page\n    assert 'rule.trigger_kind === "after_cancelled"' in page\n\n\ndef test_migration_only_extends_automation_trigger_constraint() -> None:\n    migration = (_root() / "backend/alembic/versions/0054_cancellation_recovery_trigger.py").read_text(encoding="utf-8")\n    assert 'down_revision: str | Sequence[str] | None = "0053_public_table_rls_completion"' in migration\n    assert "automation_rule_trigger_kind_valid" in migration\n    assert "after_cancelled" in migration\n    assert "create_table" not in migration\n    assert "add_column" not in migration\n''', encoding="utf-8")

          # 7) Keep runtime docs concise and explicit.
          docs = Path("n8n/AUTOMATIONS_SETUP.md")
          text = docs.read_text(encoding="utf-8")
          if "## Cancellation recovery" not in text:
              text += '''\n\n## Cancellation recovery\n\n`cancellation_recovery` is an optional WhatsApp automation and is disabled by default.\nThe admin can enable it and choose how long after `appointments.cancelled_at` it should run.\nIt reuses the normal appointment automation job/outbox path; there is no separate cancellation workflow or state machine.\nThe Meta template is `tia_cancellation_recovery_ar` with four positional body parameters: customer name, service, cancelled appointment date, and cancelled appointment time.\n'''
          docs.write_text(text, encoding="utf-8")

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend quality gate
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
          MIGRATION_DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/ci_db
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          SUPABASE_SECRET_KEY: sb_secret_ci_dummy
          ENVIRONMENT: test
          DEBUG: "false"
          DOCS_ENABLED: "false"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ruff check app tests alembic
          python -m compileall -q app alembic tests
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend quality gate
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
          TIA_API_URL: http://127.0.0.1:8000
        run: |
          npm ci
          npm run lint
          npx next typegen
          npm run typecheck
          npm run build

      - name: Commit tested cancellation recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/core/automation_rules.py backend/app/models/automation_rule.py backend/app/services/automations.py backend/app/services/operational_readiness.py backend/alembic/versions/0054_cancellation_recovery_trigger.py backend/tests/test_cancellation_recovery_automation.py backend/tests/test_automation_operations_phase54.py 'frontend/src/app/(dashboard)/automations/page.tsx' n8n/AUTOMATIONS_SETUP.md
          git diff --cached --check
          git commit -m "feat: add optional cancellation recovery automation"
          git push origin HEAD:feat/core-product-hardening
